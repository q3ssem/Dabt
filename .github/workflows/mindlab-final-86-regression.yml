name: MindLab 86-puzzle release regression (independent review)

on:
  push:
    branches: [review/mindlab-final-closure-20261123]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mindlab-86-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    name: Static catalog, puzzle engines and all existing Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete project unit and regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run test:authored-stages
          npm run test:references

  active-puzzles:
    name: 86 active puzzles / ${{ matrix.chapter }} / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        chapter: [training, seven_seas, palace, atheran, first_trace]
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser engine
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps "${{ matrix.browser }}"
      - name: Open all chapter puzzles, test three phone widths, artwork, hints and reset
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
          CHAPTER: ${{ matrix.chapter }}
        run: |
          set -uo pipefail
          mkdir -p "/tmp/mindlab-86/${CHAPTER}-${BROWSER}"
          python -m http.server 8830 --bind 127.0.0.1 >/tmp/mindlab-86-http.log 2>&1 &
          sleep 2
          failed=0
          python -u qa/browser/jaziran_86_open_audit.py http://127.0.0.1:8830/ "${BROWSER}" "${CHAPTER}" "/tmp/mindlab-86/${CHAPTER}-${BROWSER}" || failed=1
          python -u qa/browser/jaziran_86_mechanics_probe.py http://127.0.0.1:8830/ "${BROWSER}" "${CHAPTER}" "/tmp/mindlab-86/${CHAPTER}-${BROWSER}" || failed=1
          exit "$failed"
      - name: Preserve real browser evidence for correction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindlab-86-${{ matrix.chapter }}-${{ matrix.browser }}
          path: /tmp/mindlab-86/
          if-no-files-found: warn
          retention-days: 14
