name: MindLab retired-content cleanup QA
on:
  push:
    branches: [review/mindlab-cleanup-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install tinycss2==1.4.0
      - run: node qa/tests/cleanup.cjs
      - run: npm test
      - run: node qa/tests/design-integration.cjs
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright/python:v1.58.0-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install playwright==1.58.0
      - run: python3 -m http.server 8765 >/tmp/mindlab-http.log 2>&1 &
      - run: python3 qa/browser/display_audio_review.py http://127.0.0.1:8765/ /tmp/mindlab-cleanup-smoke --engine ${{ matrix.engine }} --check
