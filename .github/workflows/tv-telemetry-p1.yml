name: Majlis development reports P1 (no pressure)
on:
  push:
    branches: ['work/majlis-3.0-development-reports']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check tv/tv/app.js
          node --check tv/shared/telemetry.js
          node tv/tests/telemetry.js
          node tv/tests/telemetry-receiver.js
          node tv/tests/cache-247.js
          cmp tv/shared/telemetry-schema.js tv/server/telemetry/telemetry-schema.js
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    env:
      QA_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 websockets==15.0.1
      - name: Isolate unrelated Microsoft APT feed
        run: |
          for file in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$file" ] || continue
            if grep -q 'packages.microsoft.com' "$file" && ! grep -Eq 'ubuntu.com|ubuntu-archive' "$file"; then sudo mv "$file" "$file.disabled"; fi
          done
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - run: python tv/tests/browser-telemetry.py
