name: MindLab performance and offline review
on:
  push:
    branches: [review/mindlab-performance-cleanup]
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright/python:v1.58.0-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: eaaa1ab9be44fe3cda7bc7be0b74c647463dca22
          path: baseline
      - run: python -m pip install playwright==1.58.0
      - name: Compare local startup and verify parking controls
        run: |
          set -eu
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          python qa/browser/performance_offline.py "http://127.0.0.1:8765/" --baseline "http://127.0.0.1:8765/baseline/" --engine "${{ matrix.engine }}"
