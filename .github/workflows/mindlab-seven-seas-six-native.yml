name: MindLab Seven Seas six native UI solutions

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mindlab-seven-seas-six-native.yml'
      - 'qa/browser/jaziran_sea_six_native_ui.py'
      - 'qa/browser/player_openings.py'
      - 'index.html'
      - 'ui/**'
      - 'motion/**'
  workflow_dispatch:

concurrency:
  group: sea-six-native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  native-sea-six:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - name: Prepare browser
        shell: bash
        run: |
          if [ "${{ matrix.engine }}" = "webkit" ]; then
            python -m playwright install --with-deps webkit
          else
            command -v google-chrome
          fi
      - name: Solve 6 puzzles times 8 levels using native player controls
        shell: bash
        run: |
          mkdir -p /tmp/mindlab-sea-six
          python -m http.server 8796 --bind 127.0.0.1 >/tmp/mindlab-sea-six-http.log 2>&1 &
          python qa/browser/jaziran_sea_six_native_ui.py \
            http://127.0.0.1:8796/ "${{ matrix.engine }}" /tmp/mindlab-sea-six
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sea-native-${{ matrix.engine }}
          path: /tmp/mindlab-sea-six/*
          if-no-files-found: warn
          retention-days: 30
