name: MindLab 6 — clean foundation and research continuity

on:
  push:
    branches:
      - prototype/mindlab-6-foundation-20261123
    paths:
      - 'mindlab6/**'
      - '.github/workflows/mindlab6-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mindlab6-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Research registry, handoff and app skeleton
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to compare against the pinned protected v5 baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies for isolated engine lab
        run: |
          cd mindlab6
          npm install --ignore-scripts --no-audit --no-fund
      - name: Type-check, test and build isolated browser bundles
        run: |
          cd mindlab6
          node --check src/app.js
          npm run verify
          npm run experiment:new -- "اختبار الترقيم" probe-only --dry-run
      - name: Emit lockfile for reproducible install (one-time bootstrap)
        run: |
          cd mindlab6
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const lock = fs.readFileSync('package-lock.json').toString('base64');
          const slice = 4096;
          for (let n = 0; n * slice < lock.length; n++) {
            console.log('LOCKCHUNK ' + n + ' ' + lock.slice(n * slice, (n + 1) * slice));
          }
          console.log('LOCKEND chunks=' + Math.ceil(lock.length / slice));
          NODE
      - name: Reject changes to the protected v5 app on this foundation branch
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base="81d9046e9cd3eae240f5603461aa73a53d5fbef4"
          diff=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          bad=[name for name in diff if not (name.startswith('mindlab6/') or name=='.github/workflows/mindlab6-foundation.yml')]
          if bad:
              raise SystemExit("Unexpected changes outside MindLab 6: "+repr(bad))
          print(f"V6_BOUNDARY_PASS: {len(diff)} allowed files, old app untouched")
          PY
