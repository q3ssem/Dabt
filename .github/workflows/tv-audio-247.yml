name: Majlis TV 2.4.7 focused audio verification (no pressure)
on:
  push:
    branches: ['work/majlis-2.4.7-local-cache']
    paths: ['tv/tests/browser-audio-247.py', 'tv/shared/av.js', '.github/workflows/tv-audio-247.yml']
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tv
    env:
      QA_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - name: Isolate unrelated Microsoft APT feed on disposable QA runner
        run: |
          for file in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$file" ] || continue
            if grep -q 'packages.microsoft.com' "$file" && ! grep -Eq 'ubuntu.com|ubuntu-archive' "$file"; then
              sudo mv "$file" "$file.disabled"
            fi
          done
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Provide real virtual audio output on Linux CI (not autoplay override)
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=majlisqa
          pactl set-default-sink majlisqa
          pactl info
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check shared/av.js && node tests/audio-contract-247.js
      - run: python tests/browser-audio-247.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-247-${{ matrix.engine }}
          path: tv/tests/results/2.4.7-audio/
          if-no-files-found: warn
