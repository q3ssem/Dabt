name: MindLab folder navigation and sequential unlock acceptance

on:
  push:
    branches: [feature/mindlab-puzzle-folders-20261122]
  pull_request:
    branches: [review/mindlab-acceptance-1to6-20261122, feature/mindlab-puzzle-folders-20261122]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mindlab-puzzle-folders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  folders:
    name: Native folder interaction / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax and core puzzle catalog
        run: |
          node --check ui/puzzle-folders.js
          node --check ui/journey-hub.js
          node --check ui/app.js
          node --check legacy/art.js
          node --check treasure/app.js
          node qa/tests/jaziran-catalog.cjs
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium webkit
      - name: Four columns, native unlocks and story chapters
        env:
          ENGINE: ${{ matrix.browser }}
          SHOTS: /tmp/mindlab-puzzle-folders-${{ matrix.browser }}
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8830 --bind 127.0.0.1 >/tmp/ml-folders-http.log 2>&1 &
          sleep 2
          python -u qa/browser/puzzle_folders_acceptance.py http://127.0.0.1:8830/ "$ENGINE"
      - name: Upload category and story screenshots for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindlab-puzzle-folders-${{ matrix.browser }}
          path: /tmp/mindlab-puzzle-folders-${{ matrix.browser }}/*.png
          if-no-files-found: ignore
