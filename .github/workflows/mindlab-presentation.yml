name: MindLab presentation acceptance
on:
  push:
    branches: [review/completion-20261119]
    paths:
      - '**/*.css'
      - 'qa/browser/**'
      - '.github/workflows/mindlab-presentation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mindlab-presentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        engine: [chromium, webkit]
        suite: [scenes, treasure, side, layout]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install playwright==1.58.0 tinycss2==1.4.0
      - run: python3 tools/build_light_theme.py --check
      - run: python3 -m playwright install --with-deps ${{ matrix.engine }}
      - name: Verify updated presentation and player paths
        env:
          ENGINE: ${{ matrix.engine }}
          SUITE: ${{ matrix.suite }}
          MINDLAB_URL: http://127.0.0.1:8765/index.html
          OUT: qa/browser/completion-shots
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mindlab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          case "$SUITE" in
            scenes) MODE=scenes python3 qa/browser/journey_completion.py ;;
            treasure) python3 qa/browser/journey.py --url "$MINDLAB_URL" --engine "$ENGINE" --shots "$OUT" ;;
            side) python3 qa/browser/expedition25_smoke.py ;;
            layout) python3 qa/browser/fit_audit.py "$MINDLAB_URL" ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-${{ matrix.engine }}-${{ matrix.suite }}
          path: qa/browser/completion-shots/
          if-no-files-found: ignore
