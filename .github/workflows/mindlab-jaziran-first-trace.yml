name: MindLab Phase 2 first-trace 40 real UI wins

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mindlab-jaziran-first-trace.yml'
      - 'qa/browser/jaziran_first_trace_40_real.py'
      - 'qa/browser/player_openings.py'
      - 'index.html'
      - 'ui/**'
  workflow_dispatch:

concurrency:
  group: firsttrace40-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  five-engines-eight-levels:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - name: Install browser
        run: |
          if [ "${{ matrix.engine }}" = "webkit" ]; then
            python -m playwright install --with-deps webkit
          else
            command -v google-chrome
          fi
      - name: Solve the five optional First Trace engines on 8 real boards each
        run: |
          mkdir -p /tmp/jaziran-first-trace
          python -m http.server 8791 --bind 127.0.0.1 >/tmp/jaziran-first-trace-http.log 2>&1 &
          python qa/browser/jaziran_first_trace_40_real.py \
            http://127.0.0.1:8791/ "${{ matrix.engine }}" /tmp/jaziran-first-trace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jaziran-first-trace-${{ matrix.engine }}
          path: /tmp/jaziran-first-trace/*
          if-no-files-found: warn
          retention-days: 30
