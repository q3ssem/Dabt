name: MindLab Stage 1 - single Treasure Journey gateway
on:
  push:
    branches: [review/journey-single-entry-20261119]
    paths:
      - 'ui/journey-hub.js'
      - 'ui/journey-hub.css'
      - 'qa/browser/journey_single_entry.py'
      - 'qa/browser/journey_completion.py'
      - '.github/workflows/mindlab-journey-stage1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: Stage 1 regression - ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright/python:v1.58.0-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install --disable-pip-version-check playwright==1.58.0 tinycss2==1.4.0
      - name: Syntax
        run: node --check ui/journey-hub.js
      - name: Project regression suite
        run: npm test
      - name: Live browser navigation, fit and locks
        env:
          ENGINE: ${{ matrix.engine }}
          OUT: qa/browser/journey-stage1-shots
          MINDLAB_URL: http://127.0.0.1:8765/index.html
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http-stage1.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          python3 qa/browser/journey_single_entry.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-${{ matrix.engine }}-screenshots
          path: qa/browser/journey-stage1-shots/
          if-no-files-found: ignore
