name: MindLab Athran fourteen native user-control acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mindlab-athran-native.yml'
      - 'qa/browser/jaziran_athran_native_ui.py'
      - 'qa/browser/jaziran_sea_six_native_ui.py'
      - 'qa/browser/player_openings.py'
      - 'index.html'
      - 'ui/**'
      - 'atheran/**'
      - 'motion/**'
  workflow_dispatch:
concurrency:
  group: athran-native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  athran-native:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        group: [coast, journey]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - name: Install browser
        shell: bash
        run: |
          if [ "${{ matrix.engine }}" = "webkit" ]; then
            python -m playwright install --with-deps webkit
          else
            command -v google-chrome
          fi
      - name: Native gameplay and persistence per Athran level
        shell: bash
        run: |
          mkdir -p /tmp/mindlab-athran
          python -m http.server 8800 --bind 127.0.0.1 >/tmp/mindlab-athran-http.log 2>&1 &
          python qa/browser/jaziran_athran_native_ui.py             http://127.0.0.1:8800/ "${{ matrix.engine }}" "${{ matrix.group }}" /tmp/mindlab-athran
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athran-native-${{ matrix.engine }}-${{ matrix.group }}
          path: /tmp/mindlab-athran/*
          if-no-files-found: warn
          retention-days: 30
