name: MindLab remaining classic training native UI proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mindlab-training-more-native.yml'
      - 'qa/browser/jaziran_training_more_native_ui.py'
      - 'qa/browser/jaziran_sea_six_native_ui.py'
      - 'qa/browser/player_openings.py'
      - 'index.html'
      - 'ui/**'
  workflow_dispatch:

concurrency:
  group: training-more-native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  training-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - name: Install browser
        shell: bash
        run: |
          if [ "${{ matrix.engine }}" = "webkit" ]; then
            python -m playwright install --with-deps webkit
          else
            command -v google-chrome
          fi
      - name: Prove all riddles and two classic logic generators using taps
        shell: bash
        run: |
          mkdir -p /tmp/mindlab-training-more
          python -m http.server 8799 --bind 127.0.0.1 >/tmp/mindlab-training-more-http.log 2>&1 &
          python qa/browser/jaziran_training_more_native_ui.py             http://127.0.0.1:8799/ "${{ matrix.engine }}" /tmp/mindlab-training-more
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-more-${{ matrix.engine }}
          path: /tmp/mindlab-training-more/*
          if-no-files-found: warn
          retention-days: 30
