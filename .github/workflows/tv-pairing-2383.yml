name: TV 2.3.8.3 pairing and control
on:
  push:
    branches: ['fix/tv-2.3.8.3-pairing']
    paths: ['tv/**', '.github/workflows/tv-pairing-2383.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [pairing, control, smoke, stress, themes, motion, reconnect, audit, race]
    defaults:
      run:
        working-directory: tv
    env:
      QA_ROUNDS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax and preserved transport
        run: |
          node --check shared/core.js
          node --check shared/mq.js
          node --check tv/app.js
          node --check remote/app.js
          test "$(git hash-object shared/mq.js)" = 6e9d05f26ac29c6ee6f0fae24d51cd553b91be00
          node tests/mq-refresh-2381.js
          python -m py_compile tests/browser-${{ matrix.suite }}-2383.py
      - run: python -m pip install playwright==1.56.0 websockets==15.0.1
      - name: Install Chromium and dependencies (retry transient repository errors)
        if: matrix.suite != 'audit'
        run: |
          for attempt in 1 2 3; do
            if python -m playwright install --with-deps chromium; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - run: python tests/browser-${{ matrix.suite }}-2383.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-pairing-2383-${{ matrix.suite }}
          path: tv/tests/results/2.3.8.3-*/
          if-no-files-found: warn
