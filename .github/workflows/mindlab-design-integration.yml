name: MindLab current build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install tinycss2==1.4.0
      - run: node --check pwa.js && node --check sw.js && node --check ui/app.js && node --check legacy/art.js
      - run: python -m py_compile qa/browser/authored_stages.py qa/browser/perf_bench.py qa/browser/display_audio_review.py
      - run: npm test
      - run: npm run test:authored-stages
