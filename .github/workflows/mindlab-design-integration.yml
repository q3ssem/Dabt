name: MindLab current build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install tinycss2==1.4.0
      - run: node --check pwa.js && node --check sw.js && node --check ui/app.js && node --check legacy/art.js
      - run: python -m py_compile qa/browser/authored_stages.py qa/browser/perf_bench.py qa/browser/display_audio_review.py qa/browser/design10_play.py qa/browser/motion_batch_fixes.py
      - run: npm test
      - run: npm run test:authored-stages
      - run: python qa/audit/asset_audit.py
      - run: python -m pip install playwright
      - name: Test on-demand navigation in Chrome
        run: |
          command -v google-chrome
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/mindlab-http.log 2>&1 &
          python qa/browser/phase2_startup.py http://127.0.0.1:8765/
          python qa/browser/phase3_acceptance.py http://127.0.0.1:8765/ chromium full
          python qa/browser/phase5_game_matrix.py http://127.0.0.1:8765/ chromium
          python qa/browser/board_visual_polish.py http://127.0.0.1:8765/ chromium /tmp/mindlab-visuals
          python qa/browser/journey_evidence.py http://127.0.0.1:8765/ chromium /tmp/mindlab-visuals
          python qa/browser/jaziran_evidence_seals.py http://127.0.0.1:8765/ chromium /tmp/mindlab-visuals
          python qa/browser/jaziran_story_scenes.py http://127.0.0.1:8765/ chromium /tmp/mindlab-visuals
          python qa/browser/jaziran_rescue.py http://127.0.0.1:8765/ chromium /tmp/mindlab-visuals
      - name: Validate board CSS parsing
        run: |
          python - <<'PY'
          import tinycss2
          text=open('ds/board-polish.css',encoding='utf-8').read()
          sheet=tinycss2.parse_stylesheet(text,skip_comments=True,skip_whitespace=True)
          text2=open('ui/journey-hub.css',encoding='utf-8').read()
          sheet2=tinycss2.parse_stylesheet(text2,skip_comments=True,skip_whitespace=True)
          text3=open('ui/jaziran-rescue.css',encoding='utf-8').read()
          sheet3=tinycss2.parse_stylesheet(text3,skip_comments=True,skip_whitespace=True)
          errors=[node.message for node in sheet if node.type=='error']
          assert not errors,errors
          assert not [node.message for node in sheet2 if node.type=='error'],'journey stylesheet has syntax errors'
          assert not [node.message for node in sheet3 if node.type=='error'],'rescue stylesheet has syntax errors'
          print('BOARD_POLISH_CSS=passed',len(sheet),'rules')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mindlab-board-polish-chromium
          path: /tmp/mindlab-visuals/*.png
          if-no-files-found: ignore
      - name: Compare active progress from published main with the candidate
        run: |
          # A shallow checkout of merged main does not contain the original pre-merge commit.
          # Fetch the immutable review baseline from the dedicated backup branch.
          git fetch --no-tags --depth=1 origin refs/heads/backup/mindlab-main-before-cleanup-20261122
          git cat-file -e '58409f7138d47f2ef44a4cf6438bcb96d42aa3a9^{commit}'
          git worktree add --detach /tmp/mindlab-baseline 58409f7138d47f2ef44a4cf6438bcb96d42aa3a9
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/mindlab-phase3-http.log 2>&1 &
          python -m http.server 8768 --bind 127.0.0.1 --directory /tmp/mindlab-baseline >/tmp/mindlab-main-http.log 2>&1 &
          python qa/browser/oldsave_compat.py http://127.0.0.1:8765/ http://127.0.0.1:8768/
          python qa/browser/phase3_compare_startup.py http://127.0.0.1:8768/ http://127.0.0.1:8765/

  webkit-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps webkit
      - name: Check WebKit touch navigation, save and optional-download cancellation
        run: |
          python -m http.server 8767 --bind 127.0.0.1 >/tmp/mindlab-webkit-http.log 2>&1 &
          python qa/browser/phase3_acceptance.py http://127.0.0.1:8767/ webkit full
          python qa/browser/board_visual_polish.py http://127.0.0.1:8767/ webkit /tmp/mindlab-webkit-visuals
          python qa/browser/journey_evidence.py http://127.0.0.1:8767/ webkit /tmp/mindlab-webkit-visuals
          python qa/browser/jaziran_evidence_seals.py http://127.0.0.1:8767/ webkit /tmp/mindlab-webkit-visuals
          python qa/browser/jaziran_story_scenes.py http://127.0.0.1:8767/ webkit /tmp/mindlab-webkit-visuals
          python qa/browser/jaziran_rescue.py http://127.0.0.1:8767/ webkit /tmp/mindlab-webkit-visuals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mindlab-board-polish-webkit
          path: /tmp/mindlab-webkit-visuals/*.png
          if-no-files-found: ignore
