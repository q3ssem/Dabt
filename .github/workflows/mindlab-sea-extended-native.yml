name: MindLab eleven more Seven Seas native UI engines

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mindlab-sea-extended-native.yml'
      - 'qa/browser/jaziran_sea_extended_native_ui.py'
      - 'qa/browser/jaziran_sea_six_native_ui.py'
      - 'qa/browser/player_openings.py'
      - 'index.html'
      - 'ui/**'
      - 'motion/**'
  workflow_dispatch:

concurrency:
  group: sea-extended-native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  sea-native:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        group: [island, voyage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - name: Install browser
        shell: bash
        run: |
          if [ "${{ matrix.engine }}" = "webkit" ]; then
            python -m playwright install --with-deps webkit
          else
            command -v google-chrome
          fi
      - name: Solve each level with visible player controls
        shell: bash
        run: |
          mkdir -p /tmp/mindlab-sea-extended
          python -m http.server 8798 --bind 127.0.0.1 >/tmp/mindlab-sea-extended-http.log 2>&1 &
          python qa/browser/jaziran_sea_extended_native_ui.py             http://127.0.0.1:8798/ "${{ matrix.engine }}" "${{ matrix.group }}" /tmp/mindlab-sea-extended
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sea-extended-${{ matrix.engine }}-${{ matrix.group }}
          path: /tmp/mindlab-sea-extended/*
          if-no-files-found: warn
          retention-days: 30
