name: MindLab Palace nine native UI solutions

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mindlab-palace-native.yml'
      - 'qa/browser/jaziran_palace_native_ui.py'
      - 'qa/browser/jaziran_sea_six_native_ui.py'
      - 'qa/browser/player_openings.py'
      - 'index.html'
      - 'motion/**'
      - 'ui/**'
  workflow_dispatch:
concurrency:
  group: palace-native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  palace-native:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        group: [wings, chambers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - name: Install browser
        shell: bash
        run: |
          if [ "${{ matrix.engine }}" = "webkit" ]; then
            python -m playwright install --with-deps webkit
          else
            command -v google-chrome
          fi
      - name: Solve Palace via native buttons on each level
        shell: bash
        run: |
          mkdir -p /tmp/mindlab-palace
          python -m http.server 8801 --bind 127.0.0.1 >/tmp/mindlab-palace-http.log 2>&1 &
          python qa/browser/jaziran_palace_native_ui.py             http://127.0.0.1:8801/ "${{ matrix.engine }}" "${{ matrix.group }}" /tmp/mindlab-palace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palace-native-${{ matrix.engine }}-${{ matrix.group }}
          path: /tmp/mindlab-palace/*
          if-no-files-found: warn
          retention-days: 30
