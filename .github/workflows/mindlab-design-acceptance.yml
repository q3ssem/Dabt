name: MindLab - Design Bindings and Chapter Navigation Acceptance
on:
  push:
    branches:
      - integration/designs-river-maps-20261118
    paths:
      - 'ui/**'
      - 'motion/**'
      - 'qa/**'
      - '.github/workflows/mindlab-design-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Node regression and real Chromium map / river test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original theme-generator dependency and Playwright
        run: python3 -m pip install --disable-pip-version-check 'tinycss2==1.4.0' 'playwright==1.58.0'
      - name: Check changed JavaScript syntax
        run: |
          node --check ui/journey-hub.js
          node --check motion/lab10.js
          node --check qa/tests/design-integration.cjs
      - name: Run all original project tests
        run: npm test
      - name: Verify Gemini design manifests, routing and river geometry
        run: node qa/tests/design-integration.cjs
      - name: Select a compatible Chromium browser
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Using GitHub runner preinstalled Google Chrome"
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            echo "Using runner Chromium"
            chromium --version
          else
            echo "Installing Playwright Chromium without redundant apt dependencies"
            python3 -m playwright install chromium
          fi
      - name: Test actual maps, boat animation and return crossing in mobile Chromium
        shell: bash
        env:
          MINDLAB_URL: http://127.0.0.1:8765/index.html
          OUT: qa/browser/design-integration-shots
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mindlab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          python3 qa/browser/design_integration_smoke.py
      - name: Attach browser screenshots and failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindlab-design-river-chapter-qa
          path: |
            qa/browser/design-integration-shots/
            /tmp/mindlab-http.log
          if-no-files-found: ignore
