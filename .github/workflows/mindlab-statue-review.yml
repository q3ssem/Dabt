name: MindLab statue design review
on:
  push:
    branches: [review/puzzle-design-integration]
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright/python:v1.58.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright==1.58.0 pillow==12.2.0
      - name: Test the statue scene
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/mindlab-http.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          python qa/browser/stat_pixi.py http://127.0.0.1:8765/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statues-${{ matrix.engine }}
          path: /tmp/stat-qa
