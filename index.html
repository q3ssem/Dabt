function slPicture(){const c=document.createElement('canvas');c.width=c.height=300;const x=c.getContext('2d'),r=()=>Math.random();const wob=(pts,close)=>{x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(a+(r()-.5)*2,b+(r()-.5)*2):x.moveTo(a,b));if(close)x.closePath()};
  const sc=rnd(3);x.fillStyle=['#BFE3F2','#F6D6A8','#C9C2EC'][sc];x.fillRect(0,0,300,300);
  x.fillStyle='#FFD45A';x.beginPath();x.arc(235,62,30,0,7);x.fill();x.strokeStyle='#2F2A24';x.lineWidth=3;x.stroke();
  x.fillStyle=['#8CCB72','#E2B25B','#7FB7A8'][sc];wob([[0,210],[70,165],[140,200],[220,150],[300,190],[300,300],[0,300]],1);x.fill();x.stroke();
  x.fillStyle='#F2A7A0';wob([[60,240],[60,180],[110,140],[160,180],[160,240]],1);x.fill();x.stroke();x.fillStyle='#8A5A33';x.fillRect(98,205,24,35);x.strokeRect(98,205,24,35);
  x.fillStyle='#9EC5F0';x.fillRect(70,190,20,18);x.strokeRect(70,190,20,18);x.fillStyle='#5E9550';x.beginPath();x.arc(228,200,32,0,7);x.fill();x.stroke();x.fillStyle='#8A5A33';x.fillRect(222,228,12,40);x.strokeRect(222,228,12,40);
  for(let i=0;i<3;i++){x.beginPath();x.moveTo(30+i*40,70+i*12);x.quadraticCurveTo(40+i*40,60+i*12,50+i*40,70+i*12);x.stroke()}
  x.strokeStyle='rgba(47,42,36,.25)';x.lineWidth=1;for(let k=0;k<300;k+=6){x.beginPath();x.moveTo(k,300);x.lineTo(k+40,260);x.stroke()}return c.toDataURL()}
function runSlide(){return pzPlay('pz_slide',api=>{

  api.msg('حرّك القطع المجاورة للفراغ حتى تكتمل الصورة.');const tiles=[...$('#slb').children];

  function move(i){if(api.ended)return;const b=blank();if(Math.abs(i%n-b%n)+Math.abs((i/n|0)-(b/n|0))!==1)return;[t[i],t[b]]=[t[b],t[i]];moves++;tone(460,.04);draw();tiles.forEach(e=>e.classList.remove('hint'));if(t.every((v,k)=>v===k)){$('#slb').classList.add('full');api.win(`ركّبت الصورة في ${arN(moves,AN.mv)}.`)}}
  tiles.forEach(e=>e.onclick=()=>move(t.indexOf(+e.dataset.v)));draw();
  keyH=e=>{const d=DK[e.key];if(d==null)return;e.preventDefault();const b=blank(),x=b%n,y=b/n|0,[dx,dy]=D4[d],a=x-dx,c=y-dy;if(inb(a,c,n,n))move(c*n+a)};window.TVGRAB=e=>DK[e.key]!=null;cleanup.push(()=>{window.TVGRAB=null});pzHook({P,t,move});
  const tileAt=i=>tiles.find(e=>+e.dataset.v===t[i]);
  return{hint:k=>{if(k===1){$('#slp').hidden=false;later(()=>{const p=$('#slp');if(p)p.hidden=true},2500);return'هذه الصورة كاملة لثانيتين. رتّب الصف العلوي أولًا ثم العمود الأيسر.'}
    if(n===3){const s=slSolve3(t);if(!s||!s.length)return null;const e=tileAt(s[0]);if(e)e.classList.add('hint');return`حرّك القطعة المضيئة. باقي ${arN(s.length,AN.mv)} في أقصر حل.`}
    const want=[...Array(n*n).keys()].find(v=>t[v]!==v&&v!==B);if(want==null)return null;const e=tiles.find(x=>+x.dataset.v===want);if(e)e.classList.add('hint');return`القطعة المضيئة مكانها الخانة ${want+1}. ركّز عليها الآن.`},
   reveal:()=>{t.forEach((_,i)=>t[i]=i);draw();return'هذه هي الصورة.'}}})}

function runTangram(){return pzPlay('pz_tan',api=>{
  const P=tgMake(api.lv),n=P.n,R=new Set(P.reg),pcs=P.pieces.map((p,i)=>({i,shape:shuffle([p.shape,tgRot(p.shape),tgRot(tgRot(p.shape)),tgFlip(p.shape)])[0],at:null,lock:false}));let sel=0;
  api.body.innerHTML=`<div class="tgb ltr" id="tgb" style="--n:${n}"></div><div class="row tgctl"><button class="pzgive" id="tgr">↻ تدوير</button><button class="pzgive" id="tgf">⇋ قلب</button></div><div class="tgtray ltr" id="tgt"></div>`;
  api.msg('غطِّ الشكل المنقّط كله بالقطع. اختر قطعة، دوّرها، ثم اضغط الخانة التي تبدأ عندها النقطة.');
  const cellsOf=p=>p.at==null?[]:p.shape.map(([x,y])=>[x+p.at[0]-p.shape[0][0],y+p.at[1]-p.shape[0][1]]);
  const occ=()=>{const m=new Map();pcs.forEach(p=>cellsOf(p).forEach(([x,y])=>m.set(y*n+x,p.i)));return m};
  function draw(){const o=occ();$('#tgb').innerHTML=gridBtns(n,n,i=>{const k=o.get(i);return`<button class="tgc${R.has(i)?' reg':''}${k!=null?' on':''}${k!=null&&pcs[k].lock?' lock':''}" data-i="${i}" style="${k!=null?`--pc:${QCOL[k%QCOL.length]}`:''}" aria-label="خانة"></button>`});
    $('#tgt').innerHTML=pcs.map(p=>{if(p.at!=null)return'';const w=Math.max(...p.shape.map(c=>c[0]))+1,h=Math.max(...p.shape.map(c=>c[1]))+1,S=new Set(p.shape.map(([x,y])=>y*w+x));return`<button class="tgp${p.i===sel?' on':''}" data-p="${p.i}" style="--w:${w};--pc:${QCOL[p.i%QCOL.length]}" aria-label="قطعة">${[...Array(w*h)].map((_,k)=>`<i class="${S.has(k)?'f':''}${k===p.shape[0][1]*w+p.shape[0][0]?' a':''}"></i>`).join('')}</button>`}).join('');
    $('#tgb').querySelectorAll('.tgc').forEach(e=>e.onclick=()=>tap(+e.dataset.i));$('#tgt').querySelectorAll('.tgp').forEach(e=>e.onclick=()=>{sel=+e.dataset.p;tone(600,.03);draw()})}
  function tap(i){if(api.ended)return;const o=occ();if(o.has(i)){const p=pcs[o.get(i)];if(p.lock)return;p.at=null;sel=p.i;draw();return}const p=pcs[sel];if(!p||p.at!=null)return;p.at=[i%n,i/n|0];const cs=cellsOf(p);if(cs.some(([x,y])=>!inb(x,y,n,n)||!R.has(y*n+x)||o.has(y*n+x))){p.at=null;sfx.bad();api.msg('القطعة لا تدخل هنا. جرّب تدويرها أو مكانًا آخر.');return}
    tone(480,.06,'triangle');const nx=pcs.find(q=>q.at==null);if(nx)sel=nx.i;draw();if(pcs.every(q=>q.at!=null))api.win(`ركّبت الشكل بـ ${pcs.length} قطع.`)}
  $('#tgr').onclick=()=>{const p=pcs[sel];if(p&&p.at==null){p.shape=tgRot(p.shape);draw()}};$('#tgf').onclick=()=>{const p=pcs[sel];if(p&&p.at==null){p.shape=tgFlip(p.shape);draw()}};
  draw();pzHook({P,pcs,tap,draw});
  return{hint:k=>{if(k===1)return'ابدأ بالأطراف الضيقة من الشكل: قطع قليلة فقط تدخلها.';const c=pcs.filter(p=>!p.lock);if(!c.length)return null;const p=pick(c),o=occ();pcs.forEach(q=>{if(q!==p&&!q.lock&&cellsOf(q).some(([x,y])=>P.pieces[p.i].sol.includes(y*n+x)))q.at=null});const sol=P.pieces[p.i].sol.map(c=>[c%n,c/n|0]);p.shape=tgNorm(sol);p.at=[p.shape[0][0]+Math.min(...sol.map(c=>c[0])),p.shape[0][1]+Math.min(...sol.map(c=>c[1]))];p.lock=true;draw();if(pcs.every(q=>q.at!=null))api.win('اكتمل الشكل.');return'ثبّتُّ لك قطعة في مكانها الصحيح.'},
   reveal:()=>'جرّب المرة الجاية البدء من الزوايا.'}})}

function runTents(){return pzPlay('pz_tent',api=>{
  const P=tnMake(api.lv),n=P.n,T=new Set(P.trees),S=new Set(P.sol),st=Array(n*n).fill(0),lock=new Set();
  api.body.innerHTML=`<div class="pcwrap ltr"><table class="pct tnt n${n}" id="tnt"><tr><th></th>${P.cols.map((v,j)=>`<th class="cc" data-c="${j}">${v}</th>`).join('')}</tr>${[...Array(n).keys()].map(r=>`<tr><th class="rc" data-r="${r}">${P.rows[r]}</th>${[...Array(n).keys()].map(c=>{const i=r*n+c;return`<td>${T.has(i)?`<span class="tnc tree" style="animation-delay:-${(i*.43)%3}s">${SPR.tree}</span>`:`<button class="tnc" data-i="${i}" aria-label="خانة"></button>`}</td>`}).join('')}</tr>`).join('')}</table></div>`;
  api.msg('ضع خيمة بجانب كل شجرة (فوق أو تحت أو جانب). الخيام لا تتلامس ولو قطريًا، والأرقام عدد الخيام في كل صف وعمود.');
  const cnt=(a,i)=>[...Array(n).keys()].filter(j=>st[a?j*n+i:i*n+j]===2).length;
  function cell(i){const b=$(`#tnt [data-i="${i}"]`);if(!b)return;b.className='tnc'+(st[i]===2?' tent':st[i]===1?' grass':'')+(lock.has(i)?' lock':'');b.innerHTML=st[i]===2?SPR.tent:st[i]===1?'<i class="tng"></i>':''}
  function marks(){const tent=new Set(st.map((v,i)=>v===2?i:-1).filter(i=>i>=0));$('#tnt').querySelectorAll('button.tnc').forEach(b=>{const c=+b.dataset.i,x=c%n,y=c/n|0;let bad=false;if(tent.has(c))for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if((dx||dy)&&inb(x+dx,y+dy,n,n)&&tent.has((y+dy)*n+x+dx))bad=true;b.classList.toggle('bad',bad)});
    $('#tnt').querySelectorAll('th.cc').forEach(e=>{const j=+e.dataset.c,k=cnt(1,j);e.classList.toggle('done',k===P.cols[j]);e.classList.toggle('over',k>P.cols[j])});$('#tnt').querySelectorAll('th.rc').forEach(e=>{const r=+e.dataset.r,k=cnt(0,r);e.classList.toggle('done',k===P.rows[r]);e.classList.toggle('over',k>P.rows[r])})}
  const won=()=>{const tent=st.map((v,k)=>v===2?k:-1).filter(k=>k>=0);return tent.length===S.size&&tent.every(k=>S.has(k))};
  function tap(i){if(api.ended||lock.has(i))return;st[i]=(st[i]+1)%3;tone(st[i]===2?640:400,.04);cell(i);marks();if(won())api.win(`نصبت ${S.size} خيمة في أماكنها.`)}
  $('#tnt').querySelectorAll('button.tnc').forEach(b=>b.onclick=()=>tap(+b.dataset.i));marks();pzHook({P,tap,st});
  return{hint:k=>{if(k===1)return'الصف أو العمود الذي رقمه 0 كله عشب. والشجرة التي لها جار واحد فاضي فقط، خيمتها هناك.';const c=P.sol.filter(i=>st[i]!==2);if(!c.length)return null;const i=pick(c);st[i]=2;lock.add(i);cell(i);marks();if(won())api.win('اكتملت الخيام.');return'نصبت لك خيمة صحيحة (بإطار ذهبي).'},
   reveal:()=>{st.fill(0);P.sol.forEach(i=>st[i]=2);for(let i=0;i<n*n;i++)if(!T.has(i))cell(i);marks();return'هذا هو الحل.'}}})}

function runAkari(){return pzPlay('pz_akari',api=>{
  const P=akMake(api.lv),n=P.n,g=P.g,st=Array(n*n).fill(0),lock=new Set();
  api.body.innerHTML=`<div class="akg ltr" id="akg" style="--n:${n}">${gridBtns(n,n,i=>g[i]>=0?`<span class="akc wall" data-w="${i}">${g[i]<=4?g[i]:''}</span>`:`<button class="akc" data-i="${i}" aria-label="غرفة"></button>`)}</div>`;
  api.msg('ضع مصابيح لتنير كل الغرف. المصباح ينير صفه وعموده حتى الجدار، ولا يضيء مصباح على مصباح. الرقم = عدد المصابيح الملاصقة له.');
  const near=c=>{const x=c%n,y=c/n|0;return D4.filter(([dx,dy])=>inb(x+dx,y+dy,n,n)&&st[(y+dy)*n+x+dx]===1).length};
  function draw(){const lit=new Set(),bad=new Set();for(let b=0;b<n*n;b++)if(st[b]===1){lit.add(b);akSee(n,g,b).forEach(s=>{lit.add(s);if(st[s]===1){bad.add(b);bad.add(s)}})}
    $('#akg').querySelectorAll('button.akc').forEach(e=>{const i=+e.dataset.i;e.classList.toggle('lit',lit.has(i));e.classList.toggle('bad',bad.has(i));e.classList.toggle('lock',lock.has(i))});
    $('#akg').querySelectorAll('.akc.wall').forEach(e=>{const c=+e.dataset.w;if(g[c]>4)return;const k=near(c);e.classList.toggle('ok',k===g[c]);e.classList.toggle('over',k>g[c])});return{lit,bad}}
  function cell(i){const e=$(`#akg [data-i="${i}"]`);e.innerHTML=st[i]===1?`<b class="akb">${SPR.bulb}</b>`:st[i]===2?'<i>✕</i>':''}
  function solved(){const s=draw();if(s.bad.size)return false;for(let c=0;c<n*n;c++){if(g[c]<0&&!s.lit.has(c))return false;if(g[c]>=0&&g[c]<=4&&near(c)!==g[c])return false}return true}
  function tap(i){if(api.ended||lock.has(i))return;st[i]=(st[i]+1)%3;tone(st[i]===1?720:400,.04);cell(i);if(solved())api.win('أنرت كل غرف القصر.')}
  $('#akg').querySelectorAll('button.akc').forEach(e=>e.onclick=()=>tap(+e.dataset.i));draw();pzHook({P,tap,st});
  return{hint:k=>{if(k===1)return'ابدأ بالأرقام: الرقم 4 تحيطه المصابيح من كل جهة، والرقم 0 لا مصباح بجانبه أبدًا (ضع ✕).';const c=P.sol.filter(i=>st[i]!==1);if(!c.length)return null;const i=pick(c);st[i]=1;lock.add(i);cell(i);if(solved())api.win('أنرت القصر.');return'وضعت لك مصباحًا صحيحًا (بإطار ذهبي).'},
   reveal:()=>{st.fill(0);P.sol.forEach(i=>st[i]=1);for(let i=0;i<n*n;i++)if(g[i]<0)cell(i);draw();return'هذا هو الحل.'}}})}

let SKS=7;const skR=()=>{SKS=(SKS*16807)%2147483647;return(SKS-1)/2147483646},skJ=a=>(skR()-.5)*2*a;
function skLine(x1,y1,x2,y2,a=1.4){let d='';for(let p=0;p<2;p++){const mx=(x1+x2)/2+skJ(a*1.3),my=(y1+y2)/2+skJ(a*1.3);d+=`M${(x1+skJ(a)).toFixed(1)} ${(y1+skJ(a)).toFixed(1)}Q${mx.toFixed(1)} ${my.toFixed(1)} ${(x2+skJ(a)).toFixed(1)} ${(y2+skJ(a)).toFixed(1)}`}return d}
function skEll(cx,cy,rx,ry,a=1.3){let d='';for(let p=0;p<2;p++){const st=skR()*6.28,n=16;for(let i=0;i<=n+2;i++){const t=st+i/n*6.6;d+=(i?'L':'M')+(cx+(rx+skJ(a))*Math.cos(t)).toFixed(1)+' '+(cy+(ry+skJ(a))*Math.sin(t)).toFixed(1)}}return d}
function skBlob(cx,cy,r){let d='';for(let i=0;i<=10;i++){const t=i/10*6.283,rr=r*(.85+skR()*.3);d+=(i?'L':'M')+(cx+rr*Math.cos(t)).toFixed(1)+' '+(cy+rr*Math.sin(t)*.9).toFixed(1)}return d+'Z'}
const skW=(d,c,o=.32)=>`<path d="${d}" style="fill:${c};fill-opacity:${o}" stroke="none"/>`;
const CH_EMO=['🏡🌴🐐','🏝️🌊🐚','🏙️🚦🏢','🏰👑🗝️','⚓⛵🐟','⛏️💎🪨','🔭⭐🌙','🚂🛤️🧳','📚🕯️📜'];

const skP=(d,c='var(--ink)',w=1.8,x='')=>`<path d="${d}" fill="none" style="stroke:${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${x}/>`;

function pzNodes(ch){SKS=101+ch*37;const base=[[55,262],[160,250],[262,228],[228,172],[122,160],[48,112],[140,66],[255,40]];return base.map(([x,y])=>[x+skJ(14),y+skJ(8)])}
function pzMapHTML(){const ch=pzCurCh(),p=pzState(),un=ridUnlocked(ch),nodes=pzNodes(ch),first=ch*RID_PER,cur=[...Array(RID_PER).keys()].find(k=>!p.rid[first+k]),solved=[...Array(RID_PER).keys()].filter(k=>p.rid[first+k]).length;
  SKS=900+ch*11;let g='';
  g+=skW(skBlob(70,215,58),CH_COL[ch],.22)+skW(skBlob(250,110,52),CH_COL[(ch+3)%9],.18);
  const emo=[...CH_EMO[ch]];const deco=[[285,280],[30,175],[290,150],[200,110],[40,40],[190,15],[95,220],[300,60]];deco.forEach(([x,y],i)=>{g+=`<text x="${x}" y="${y}" font-size="${16+skR()*8|0}" text-anchor="middle" style="opacity:.85">${emo[i%emo.length]}</text>`});
  let d='';for(let i=0;i<nodes.length-1;i++){const[a,b]=nodes[i],[c,e]=nodes[i+1];d+=`M${a.toFixed(1)} ${b.toFixed(1)}Q${((a+c)/2+skJ(26)).toFixed(1)} ${((b+e)/2+skJ(16)).toFixed(1)} ${c.toFixed(1)} ${e.toFixed(1)}`}
  g+=skP(d,'var(--ink)',2,'stroke-dasharray="2 7" opacity=".8"');
  nodes.forEach(([x,y],k)=>{const s=p.rid[first+k],c=un&&k===cur;if(s)g+=skW(skBlob(x,y,17),'#F3D488',.75);if(c)g+=`<g class="pulse">${skW(skBlob(x,y,21),'#FF5F7A',.35)}${skP(skEll(x,y,19,19),'#FF5F7A',2.4)}</g>`;g+=skP(skEll(x,y,15,15),'var(--ink)',1.9)});
  g+=skP(skLine(240,292,300,292,1)+skLine(296,286,302,292,.5)+skLine(296,298,302,292,.5),'var(--ink)',1.4);
  const btns=nodes.map(([x,y],k)=>{const i=first+k,s=p.rid[i],can=un&&i<RIDDLES.length;return`<button class="pznode" style="left:${x/3.2}%;top:${y/3}%" data-rid="${i}" ${can?'':'disabled'} aria-label="لغز ${i+1}${s?' محلول':''}">${s?'✓':can?(i+1):'🔒'}</button>`}).join('');
  return`<section class="gsec"><div class="sec-h"><h2>القصة</h2><span>${Object.keys(p.rid).length} من ${RIDDLES.length} لغزًا</span></div>
   <div class="pzchips" id="pzchips">${RID_CH.map((nm,i)=>`<button class="${i===ch?'on':''}" data-ch="${i}">${i+1}. ${nm}${ridUnlocked(i)?'':' 🔒'}</button>`).join('')}</div>
   <div class="card pzmap"><div class="pzmapnav"><button id="pzchp" ${ch?'':'disabled'} aria-label="الفصل السابق">›</button><div style="text-align:center"><b>الفصل ${ch+1}: ${RID_CH[ch]}</b><small>${un?`حللت ${solved} من ${RID_PER}`:'🔒 حل 5 ألغاز من الفصل السابق ليُفتح'}</small></div><button id="pzchn" ${ch<RID_CH.length-1?'':'disabled'} aria-label="الفصل التالي">‹</button></div>
   <div style="position:relative"><svg class="mapsv" viewBox="0 0 320 300" aria-hidden="true">${g}</svg>${btns}${un?'':'<div class="pzmaplock">هذا الحي مقفل.<br>حل 5 ألغاز من الفصل السابق ليُفتح.</div>'}</div></div></section>`}
function pzMapBind(){const v=$('#v-puz');v.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{PZ_CH_SEL=+b.dataset.ch;renderPuz()});
  const pv=$('#pzchp'),nx=$('#pzchn');if(pv)pv.onclick=()=>{PZ_CH_SEL=Math.max(0,pzCurCh()-1);renderPuz()};if(nx)nx.onclick=()=>{PZ_CH_SEL=Math.min(RID_CH.length-1,pzCurCh()+1);renderPuz()}}

  const org=(pts,amp)=>{const o=[];for(let i=0;i<pts.length;i++){const[a,b]=pts[i],[c,d]=pts[(i+1)%pts.length];for(let k=0;k<3;k++){const t=k/3;o.push([a+(c-a)*t+(R()-.5)*amp,b+(d-b)*t+(R()-.5)*amp])}}return o};

    ell(cx,cy,rx,ry,n=18){return[...Array(n)].map((_,i)=>[cx+rx*Math.cos(i/n*6.283),cy+ry*Math.sin(i/n*6.283)])},
    rect(x,y,w,h){return[[x,y],[x+w,y],[x+w,y+h],[x,y+h]]},

    sky(top,bot,h=ART_H){const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,top);g.addColorStop(1,bot);ctx.save();ctx.globalAlpha=.55;ctx.fillStyle=g;ctx.fillRect(0,0,ART_W,h);ctx.restore();for(let i=0;i<5;i++)B.wc(B.ell(R()*ART_W,R()*h*.6,60+R()*80,25+R()*30),top,{a:.08,layers:3,edge:0,amp:12})},
    hills(y,col,amp=30){const p=[[-10,ART_H+10],[-10,y]];for(let x=0;x<=ART_W+20;x+=35)p.push([x,y-Math.sin(x/90+R()*2)*amp*.5-R()*amp*.4]);p.push([ART_W+10,ART_H+10]);B.wc(p,col,{amp:6});B.ink(p.slice(1,-1),{w:1.1,a:.45})},
    water(y0,y1,col=ARTC.sky){B.wc([[-10,y0],[ART_W+10,y0-4],[ART_W+10,y1],[-10,y1]],col,{amp:5,a:.2});ctx.save();ctx.globalAlpha=.5;ctx.strokeStyle='#fff';ctx.lineWidth=1.4;for(let i=0;i<12;i++){const x=R()*ART_W,y=y0+8+R()*(y1-y0-12);ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+10,y-3,x+22,y);ctx.stroke()}ctx.restore()},

/* ---- doors: signs, a rule about how many signs tell the truth, one safe door ---- */
const DR_RULES=[{id:'one',t:'لافتة واحدة فقط صادقة.',ok:v=>v.filter(Boolean).length===1},{id:'onef',t:'لافتة واحدة فقط كاذبة.',ok:v=>v.filter(x=>!x).length===1},{id:'two',t:'لافتتان فقط صادقتان.',ok:v=>v.filter(Boolean).length===2},
 {id:'lady',t:'لافتة باب الكنز صادقة، ولافتات أبواب الفخ كلها كاذبة.',ok:(v,t)=>v.every((x,i)=>x===(i===t))},{id:'none',t:'كل اللافتات كاذبة.',ok:v=>v.every(x=>!x)},{id:'mix',t:'لافتة باب الكنز صادقة، وعلى الأقل لافتة فخ واحدة كاذبة.',ok:(v,t)=>v[t]&&v.some((x,i)=>i!==t&&!x)}];
const DRN=['الأول','الثاني','الثالث','الرابع','الخامس'];
function drEval(st,t,vals){switch(st.k){case 'here':return t===st.d;case 'nothere':return t!==st.d;case 'at':return t===st.x;case 'notat':return t!==st.x;case 'side':return st.x<st.d?t<st.d:t>st.d;case 'either':return t===st.x||t===st.y;case 'liar':return!vals[st.x];case 'true':return!!vals[st.x]}}
function drText(st){switch(st.k){case 'here':return'الكنز خلف هذا الباب.';case 'nothere':return'الكنز ليس خلف هذا الباب.';case 'at':return`الكنز خلف الباب ${DRN[st.x]}.`;case 'notat':return`الكنز ليس خلف الباب ${DRN[st.x]}.`;case 'side':return st.x<st.d?'الكنز خلف باب قبل هذا الباب.':'الكنز خلف باب بعد هذا الباب.';case 'either':return`الكنز خلف الباب ${DRN[st.x]} أو ${DRN[st.y]}.`;case 'liar':return`لافتة الباب ${DRN[st.x]} كاذبة.`;case 'true':return`لافتة الباب ${DRN[st.x]} صادقة.`}}
function drVals(P,t){const v=P.st.map(s=>s.k==='liar'||s.k==='true'?null:drEval(s,t));P.st.forEach((s,i)=>{if(v[i]===null)v[i]=drEval(s,t,v)});return v}
function drMake(lv){const n=[3,3,3,4,4,4,5,5][lv-1],rules=lv<=2?['one','onef']:lv<=4?['one','onef','two','lady']:['two','lady','none','mix','one'],meta=lv>=4;
  for(let tr=0;tr<3000;tr++){const rid=pick(rules),rule=DR_RULES.find(r=>r.id===rid),st=[];
    for(let d=0;d<n;d++){const kinds=['here','nothere','at','notat','side','either'];if(meta&&d>0)kinds.push('liar','true');let k=pick(kinds),s={k,d};
      if(k==='at'||k==='notat'||k==='side'){let x=rnd(n);if(x===d)x=(x+1)%n;s.x=x}if(k==='either'){const o=shuffle([...Array(n).keys()].filter(i=>i!==d));s.x=o[0];s.y=o[1]}if(k==='liar'||k==='true'){const o=[...Array(d).keys()].filter(i=>st[i].k!=='liar'&&st[i].k!=='true');if(!o.length){s={k:'here',d}}else s.x=pick(o)}st.push(s)}
    const P={n,st,rule};const ok=[...Array(n).keys()].filter(t=>rule.ok(drVals(P,t),t));if(ok.length!==1)continue;P.t=ok[0];
    if(lv>=3&&st.filter(s=>s.k==='here'||s.k==='nothere').length===n)continue;return P}
  return drMake(Math.max(1,lv-1))}

/* ---- lights out: GF(2) solver gives the fewest presses ---- */
function loSolve(n,on){const N=n*n,rows=[];for(let i=0;i<N;i++){let m=0n;const x=i%n,y=i/n|0;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const a=x+dx,b=y+dy;if(inb(a,b,n,n))m|=1n<<BigInt(b*n+a)});rows.push({m,r:on[i]?1:0})}

function osMake(lv){const[c,r,L]=[[3,3,6],[3,3,8],[4,3,10],[4,4,12],[4,4,15],[5,4,17],[5,5,20],[5,5,24]][lv-1];

 ['سباق جمال غريب: الفائز من يصل جمله آخرًا. ظل أخوان يمشيان ببطء أيامًا، فهمس لهما حكيم بكلمتين، فانطلقا بأقصى سرعة. ماذا قال؟','«تبادلا الجملين»',['«الجائزة كبيرة»','«الشمس حارقة»','«انتهى السباق»'],['كل واحد يريد أن يتأخر جمله هو.','ماذا لو ركب كل واحد جمل أخيه؟','عندها يريد أن يسبق الجمل الذي يركبه.'],'بعد التبادل، كل واحد يركب جمل أخيه ويريد أن يصل به أولًا ليصل جمله هو آخرًا.'],

 ['ثلاثة مسافرين: واحد على جمل، وواحد على حصان، وواحد يمشي. سالم لا يركب، وفيصل لا يركب الجمل، وناصر ليس الماشي. من يركب الجمل؟','ناصر',['فيصل','سالم','لا يمكن المعرفة'],['سالم لا يركب، فهو…','فيصل لا يركب الجمل، والمشي أُخذ.','يبقى الجمل لمن؟'],'سالم يمشي، وفيصل على الحصان، فالجمل لناصر.'],
 ['في بئر دلوان مربوطان بحبل واحد على بكرة؛ كلما نزل واحد صعد الآخر. الدلو الأيمن في الأعلى، فأنزلته إلى الماء. أين الدلو الأيسر الآن؟','في الأعلى',['في الماء','في المنتصف','سقط في البئر'],['الحبل واحد.','نزول أحدهما يرفع الآخر.','الأيمن نزل…'],'نزول الدلو الأيمن رفع الأيسر إلى الأعلى.'],
 ['مرشدان، أحدهما صادق دائمًا والآخر كاذب دائمًا. قال (أ): «طريق الشمال يؤدي إلى الواحة». وقال (ب): «أنا و(أ) كلانا صادقان». أي طريق تسلك؟','طريق الشمال',['الطريق المعاكس للشمال','لا يمكن المعرفة','لا طريق يؤدي'],['واحد فقط منهما صادق.','لو كان (ب) صادقًا لكانا صادقين معًا: ممنوع.','إذن (ب) الكاذب و(أ) الصادق.'],'(ب) لا يمكن أن يصدق لأن جملته تجعلهما صادقين معًا، فهو الكاذب، و(أ) الصادق: طريق الشمال يؤدي للواحة.'],
 ['وجدت آثار أقدام في الرمل تتجه نحو خيمة ولا تخرج منها، ومع ذلك الخيمة فارغة ولا مخرج آخر. كيف؟','خرج صاحبها ماشيًا إلى الخلف',['طار من الخيمة','الريح مسحت الآثار','دخل ولم يخرج'],['الآثار تُقرأ من اتجاه الأصابع.','ماذا لو مشى بطريقة غير عادية؟','للخلف!'],'مشى إلى الخلف وهو يخرج، فبدت آثاره كأنها داخلة.'],

  api.msg('اسحب النقاط حتى لا يتقاطع أي خطين.');const sv=$('#unsv');

  sv.addEventListener('pointerdown',e=>{const g=e.target.closest('.unode');if(!g||api.ended)return;const i=+g.dataset.i;if(lock.has(i))return;e.preventDefault();drag=i;sv.setPointerCapture(e.pointerId);g.classList.add('drag')});
  sv.addEventListener('pointermove',e=>{if(drag<0)return;pos[drag]=pt(e);draw()});
  const up=()=>{if(drag<0)return;sv.querySelectorAll('.drag').forEach(g=>g.classList.remove('drag'));drag=-1;moves++;tone(500,.04);if(!draw())win()};sv.addEventListener('pointerup',up);sv.addEventListener('pointercancel',up);
  function win(){$('#unsv').classList.add('done');api.win(moves?`فككت التشابك بعد ${arN(moves,['سحبة واحدة','سحبتين','سحبات','سحبة'])}.`:'فككت التشابك.')}
  draw();pzHook({P,pos,draw,win});
  return{hint:k=>{if(k===1)return'ابدأ بالنقاط التي تتصل بخطوط كثيرة، وضع النقاط التي تتصل بنقطتين فقط في الأطراف.';const c=[...Array(P.n).keys()].filter(i=>!lock.has(i));if(!c.length)return null;const{bad}=unCross(P,pos),inBad=c.filter(i=>P.e.some(([a,b],k)=>bad.has(k)&&(a===i||b===i)));const i=pick(inBad.length?inBad:c);pos[i]=P.sol[i].slice();lock.add(i);if(!draw())win();return'ثبّتُّ لك نقطة في مكانها الصحيح (بإطار ذهبي).'},
   reveal:()=>{P.sol.forEach((p,i)=>pos[i]=p.slice());draw();return'هذا شكل بلا تقاطعات.'}}})}

function runPegs(){return pzPlay('pz_peg',api=>{
  const P=pgMake(api.lv),{w,h,hole}=P;let S=new Set(P.peg),sel=-1,hist=[],moves=0;const D=[[1,0],[-1,0],[0,1],[0,-1]];

  api.msg('اقفز بكرة فوق جارتها إلى حفرة فارغة، فتُزال الكرة التي قفزت فوقها. اترك كرة واحدة فقط.');
  const jumps=c=>{const x=c%w,y=c/w|0;return D.map(([dx,dy])=>[(y+dy)*w+x+dx,(y+2*dy)*w+x+2*dx,inb(x+2*dx,y+2*dy,w,h)]).filter(([b,a,ok])=>ok&&hole[a]&&S.has(b)&&!S.has(a))};
  function draw(land,gone){$('#pgb').querySelectorAll('.pgc[data-i]').forEach(e=>{const i=+e.dataset.i,has=S.has(i);e.innerHTML=has||i===gone?`<b class="pgpeg${i===land?' land':''}${i===gone?' gone':''}">${SPR.peg}</b>`:'';e.classList.toggle('sel',i===sel);e.classList.toggle('tgt',sel>=0&&jumps(sel).some(([,a])=>a===i))})}
  function tap(i){if(api.ended||!hole[i])return;if(S.has(i)){sel=sel===i?-1:i;tone(600,.03);draw();return}if(sel<0)return;const j=jumps(sel).find(([,a])=>a===i);if(!j){sfx.bad();return}
    hist.push([...S]);S.delete(sel);S.delete(j[0]);S.add(i);moves++;const g=j[0];sel=-1;sfx.pop();draw(i,g);later(()=>draw(),320);
    if(S.size===1)later(()=>api.win(`بقيت كرة واحدة بعد ${arN(moves,['قفزة واحدة','قفزتين','قفزات','قفزة'])}.`),350);else if(![...S].some(c=>jumps(c).length))api.msg('ما فيه قفزات ممكنة. اضغط «تراجع» وجرّب طريقًا آخر.')}
  $('#pgb').querySelectorAll('.pgc[data-i]').forEach(e=>e.onclick=()=>tap(+e.dataset.i));
  $('#pgun').onclick=()=>{if(!hist.length||api.ended)return;S=new Set(hist.pop());sel=-1;draw()};$('#pgre').onclick=()=>{if(api.ended)return;S=new Set(P.peg);hist=[];sel=-1;draw()};
  draw();pzHook({P,tap,S:()=>S});
  return{hint:k=>{if(k===1)return'لا تترك كرة وحيدة بعيدة عن البقية؛ القفزات تحتاج كرتين متجاورتين وحفرة بعدهما.';const s=pgSolve(P,[...S]);if(!s)return'هذا الوضع لا يكتمل. تراجع خطوة أو ابدأ من جديد.';const[c,a]=s[0];sel=c;draw();$('#pgb').querySelector(`[data-i="${a}"]`).classList.add('hint');return'حرّك الكرة المختارة إلى الحفرة المضيئة.'},
   reveal:()=>'جرّب المرة الجاية أن تجمع الكرات نحو المنتصف.'}})}

function runKnight(){return pzPlay('pz_knight',api=>{

  api.body.innerHTML=`<div class="knw ltr"><div class="knb" id="knb" style="--n:${n}">${gridBtns(n,n,i=>P.open[i]?`<button class="knc${((i%n)+(i/n|0))%2?' dk':''}" data-i="${i}" aria-label="مربع"></button>`:'<span class="knc off"></span>')}</div><div class="kntok" id="knt">${SPR.knight}</div></div><div class="row skbtns"><button class="pzgive" id="knun">↶ تراجع</button></div>`;
  api.msg(`حرّك الحصان (حركة L) ليمرّ على كل المربعات مرة واحدة فقط. المربعات: <b class="num">${P.len}</b>`);
  const nexts=()=>{const c=path[path.length-1],x=c%n,y=c/n|0;return KN.map(([dx,dy])=>[x+dx,y+dy]).filter(([a,b])=>inb(a,b,n,n)&&P.open[b*n+a]&&!path.includes(b*n+a)).map(([a,b])=>b*n+a)};

    $('#knb').querySelectorAll('.knc[data-i]').forEach(e=>{const i=+e.dataset.i,k=path.indexOf(i);e.classList.toggle('seen',k>=0);e.classList.toggle('can',nx.has(i));e.textContent=k>=0&&k<path.length-1?k+1:''});
    api.msg(`زرت <b class="num">${path.length}</b> من <b class="num">${P.len}</b>`+(nx.size||path.length===P.len?'':' · ما فيه حركة! تراجع'))}
  function go(i){if(api.ended)return;if(!nexts().includes(i)){sfx.bad();return}path.push(i);tone(400+path.length*8,.05);$('#knt').classList.remove('hop');void $('#knt').offsetWidth;$('#knt').classList.add('hop');$('#knb').querySelectorAll('.hint').forEach(e=>e.classList.remove('hint'));draw();if(path.length===P.len)api.win(`أكمل الحصان رحلته على ${P.len} مربعًا.`)}
  $('#knb').querySelectorAll('.knc[data-i]').forEach(e=>e.onclick=()=>go(+e.dataset.i));$('#knun').onclick=()=>{if(path.length>1&&!api.ended){path.pop();draw()}};
  draw();pzHook({P,go,path:()=>path});
  return{hint:k=>{if(k===1)return'قاعدة «وارنسدورف»: اذهب دائمًا للمربع الذي له أقل عدد من الحركات التالية، واترك المربعات الواسعة للأخير.';const s=knSolve(P,path);if(!s){return'من هنا ما تكتمل الرحلة. تراجع خطوات.'}$('#knb').querySelector(`[data-i="${s[path.length]}"]`).classList.add('hint');return'اقفز إلى المربع المضيء.'},
   reveal:()=>'جرّب المرة الجاية البدء من الزوايا والأطراف.'}})}

function runStroke(){return pzPlay('pz_stroke',api=>{
  const P=osMake(api.lv),{c,r}=P,used=new Set(),X=i=>8+(i%c)*84/(c-1),Y=i=>8+(i/c|0)*84/(r-1),K=([a,b])=>a+'-'+b;let cur=null,trail=[];

  api.msg('ارسم الشكل كله بخط واحد بدون أن ترفع القلم أو تمر على خط مرتين. اضغط نقطة البداية ثم النقاط واحدة واحدة.');
  function draw(){$('#ose').querySelectorAll('.ose').forEach(l=>{const e=P.edges[+l.dataset.k];l.classList.toggle('on',used.has(K(e)))});document.querySelectorAll('.osn').forEach(b=>{const v=+b.dataset.v;b.classList.toggle('cur',v===cur);b.classList.remove('hint')});api.msg(`الخطوط: <b class="num">${used.size}</b> من <b class="num">${P.edges.length}</b>`)}

    used.add(K(e));trail.push(v);const ln=$(`#ose [data-k="${P.edges.indexOf(e)}"]`);ln.classList.add('anim');cur=v;tone(380+used.size*20,.05);draw();
    if(used.size===P.edges.length)api.win(`رسمت الشكل كاملًا بخط واحد (${arN(P.edges.length,['خط واحد','خطين','خطوط','خطًا'])}).`);else if(!P.edges.some(([a,b])=>!used.has(a+'-'+b)&&(a===cur||b===cur)))api.msg('توقف القلم! اضغط «من جديد» وجرّب نقطة بداية أخرى.')}
  document.querySelectorAll('.osn').forEach(b=>b.onclick=()=>tap(+b.dataset.v));$('#osre').onclick=()=>{if(api.ended)return;used.clear();cur=null;trail=[];$('#ose').querySelectorAll('.anim').forEach(l=>l.classList.remove('anim'));draw()};
  const odd=()=>{const d={};P.edges.forEach(([a,b])=>{d[a]=(d[a]||0)+1;d[b]=(d[b]||0)+1});return Object.keys(d).filter(v=>d[v]%2).map(Number)};

    const nx=osNext(P,used,cur);if(nx==null)return null;document.querySelector(`.osn[data-v="${nx}"]`).classList.add('hint');return'اذهب إلى النقطة المضيئة.'},
   reveal:()=>'السر في نقاط البداية والنهاية: النقاط ذات الخطوط الفردية.'}})}
