<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1024">
<meta name="description" content="ضبط دماغك: ألعاب تدريب الدماغ المبنية على أبحاث علمية">
<title>ضبط دماغك</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">
</head>
<body>
<style>
/* Layout: phone-first app shell, 480px column; tabs at bottom; game runs full-screen over the shell.
   Single deliberate night theme: deep ink ground, one signature colour per brain skill. */
:root{
  color-scheme:dark;
  --bg:#0A1024; --bg2:rgba(4,8,22,.45); --surface:rgba(var(--tint),.06); --surface2:rgba(var(--tint),.1); --line:rgba(var(--tint),.12);
  --ink:#EEF1FF; --muted:#8E97C4; --dim:#5D6694;
  --mem:#3FD0E8; --foc:#FFB547; --spd:#FF6B5A; --flx:#FF5FA8; --log:#8BE36A; --spa:#A595FF;
  --good:#4BE08A; --bad:#FF5C6C; --gold:#FFD25A;
  --font-d:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  --font-b:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  --tabh:64px;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(45% 32% at 92% 0%,rgba(63,208,232,.28),transparent 70%),radial-gradient(40% 30% at 0% 18%,rgba(255,95,168,.22),transparent 70%),radial-gradient(55% 35% at 60% 60%,rgba(139,227,106,.10),transparent 70%),radial-gradient(50% 30% at 10% 100%,rgba(255,181,71,.16),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.55;direction:rtl}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);font-weight:800;margin:0;line-height:1.2;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.shell{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--muted)}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello{display:flex;flex-direction:column}
.hello h1{font-size:30px}

/* workout */
.workout{background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.wk-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wk-head h2{font-size:26px}
.ico svg{width:58%;height:58%}
.cta{background:linear-gradient(110deg,#3FD0E8,#8BE36A 55%,#FFD45A);color:#06122A;border-radius:16px;padding:14px 20px;font-weight:800;font-size:17px;width:100%;transition:transform .12s}
.cta:active{transform:scale(.98)}
.cta.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.cta.done{background:var(--good);color:#06240F}

/* skills */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.idx-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.idx-big{font-family:var(--font-d);font-size:46px;line-height:1}
.idx-big small{font-family:var(--font-b);font-size:14px;color:var(--muted);font-weight:500;margin-inline-start:6px}

/* games list */
.stars{display:inline-flex;gap:2px}
.stars svg{width:14px;height:14px}

/* profile */
.radar svg{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--bg2);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--font-d);font-size:26px;font-weight:800}
.stat span{font-size:12.5px;color:var(--muted)}
.set{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-weight:700}
.set:first-of-type{border-top:0}
.toggle{width:50px;height:30px;border-radius:30px;background:var(--line);position:relative;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:var(--ink);transition:transform .2s}
.toggle.on{background:var(--good)}
.toggle.on::after{transform:translateX(-20px)}
.danger{color:var(--bad);font-weight:700}

/* tab bar */
.tabs{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--tabbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--dim)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--ink)}

/* game screen */
.play{position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,var(--bg)) 0%,color-mix(in srgb,var(--c2) 14%,var(--bg)) 40%,var(--bg) 85%);display:flex;flex-direction:column;overflow-y:auto}
.play::before{content:"";position:fixed;inset:0;background:radial-gradient(90% 50% at 50% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);pointer-events:none}
.pin{position:relative;max-width:480px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.pbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.x{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.pbar .t{flex:1;min-width:0}
.pbar .t b{display:block;font-family:var(--font-d);font-weight:800;font-size:20px;line-height:1.1}
.pbar .t span{font-size:12.5px;color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));font-weight:700}
.wkdots{display:flex;gap:4px}
.wkdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.wkdots i.on{background:var(--c)}
.wkdots i.done{background:var(--good)}
.stage{flex:1;display:flex;flex-direction:column;gap:14px;position:relative}

.intro{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;padding-top:8px}
.intro .hero{width:132px;height:132px;border-radius:36px;display:grid;place-items:center;box-shadow:0 18px 50px -12px var(--c)}
.intro .hero svg{width:60%;height:60%}
.intro h2{font-size:34px}
.intro .skill{color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));font-weight:800}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;text-align:start;width:100%}
.how li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px}
.how li b{flex:none;width:26px;height:26px;border-radius:8px;background:var(--c);color:var(--bg);display:grid;place-items:center;font-size:14px}
.intro .bestline{color:var(--muted);font-size:14px}
.go-btn{background:linear-gradient(120deg,var(--c),var(--c2,var(--c)));color:#0A0E1C;border-radius:18px;padding:16px;font-weight:800;font-size:19px;width:100%;margin-top:auto;box-shadow:0 10px 30px -10px var(--c)}

.hud{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hud .sc{font-family:var(--font-d);font-size:34px;line-height:1}
.hud .lbl{font-size:12px;color:var(--muted);font-weight:700}
.mult{direction:ltr;font-family:var(--font-d);font-size:22px;color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));min-width:48px;text-align:center;transition:transform .2s}
.mult.pop{transform:scale(1.35)}
.tbar{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--c);border-radius:8px;transform-origin:right}
.tleft{font-size:13px;color:var(--muted);font-weight:700}

.qp{background:var(--surface);border:1px solid var(--line);border-radius:22px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px 12px;text-align:center}
.qp .rule{font-size:15px;font-weight:800;padding:4px 12px;border-radius:999px}
.qp .main{font-family:var(--font-d);font-size:clamp(40px,13vw,64px);line-height:1.1}
.qp .sub{color:var(--muted);font-size:14px;font-weight:700}
.qo{display:grid;gap:10px}
.qo.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.qo.c4{grid-template-columns:repeat(4,minmax(0,1fr))}


.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}





.wc{width:120px;aspect-ratio:1;background:var(--bg2);border-radius:16px;display:grid;place-items:center;border:2px solid var(--line)}
.wc svg{width:86%;height:86%}
.qo.c4 .opt.svgopt svg{width:100%;height:auto;max-width:72px}






.opt{background:var(--surface2);border:2px solid var(--line);border-radius:18px;padding:16px 10px;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;transition:transform .08s,background .15s,border-color .15s}
.opt:active{transform:scale(.97)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 22%,var(--surface2))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--surface2))}
.sw{width:22px;height:22px;border-radius:50%;flex:none}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.float{position:absolute;font-family:var(--font-d);font-size:28px;color:var(--good);pointer-events:none;animation:float .8s ease-out forwards;z-index:5}
.float.neg{color:var(--bad)}
@keyframes float{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-56px)}}

.board{display:grid;gap:8px;aspect-ratio:1;width:100%;max-width:100%}
.cell{background:var(--surface2);border-radius:14px;display:grid;place-items:center;font-family:var(--font-d);color:var(--ink);transition:background .12s,transform .12s,opacity .2s;position:relative}
.cell.lit{background:var(--c);box-shadow:0 0 30px -4px var(--c);transform:scale(1.04)}
.cell.gone{opacity:.18;pointer-events:none}
.cell.okc{background:var(--good)}
.cell.noc{background:var(--bad)}
.field{position:relative;width:100%;aspect-ratio:1;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;max-width:100%}
.field .cell{position:absolute;width:18%;height:18%}
.msg{text-align:center;color:var(--muted);font-weight:700;min-height:1.5em}
.match{background:var(--c);color:#0A0E1C;border-radius:18px;padding:18px;font-weight:800;font-size:20px;width:100%}
.match.hit{background:var(--good)}
.match.miss{background:var(--bad)}

.cd{position:absolute;inset:0;display:grid;place-items:center;z-index:10;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.cd b{font-family:var(--font-d);font-weight:800;font-size:120px;color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));animation:cd .8s ease-out}
@keyframes cd{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}

.res{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:6px}
.res .bigstars{display:flex;gap:10px}
.res .bigstars svg{width:46px;height:46px;animation:pop .45s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.res .pts{font-family:var(--font-d);font-size:72px;line-height:1}
.res .pl{color:var(--muted);font-weight:700;margin-top:-6px}
.rec{background:var(--gold);color:#2A1C00;border-radius:999px;padding:4px 14px;font-weight:800;font-size:14px}
.delta{font-size:13px;font-weight:800}
.delta.up{color:var(--good)} .delta.dn{color:var(--bad)}
.rdetail{color:var(--muted);font-size:14.5px;max-width:40ch}
.rbtns{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:6px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.pad button{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 0;font-family:var(--font-d);font-size:26px;transition:transform .08s}
.pad button:active{transform:scale(.95)}
.pad .act{background:var(--c);color:#0A0E1C;border-color:color-mix(in srgb,var(--c) var(--catmix),var(--ink))}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;direction:ltr;min-height:44px}
.slots i{width:32px;height:42px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--font-d);font-style:normal;font-size:22px}
.mx{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:min(100%,200px);direction:ltr}
.mx>div{aspect-ratio:1;background:var(--bg2);border-radius:10px;display:grid;place-items:center}
.mx svg{width:84%;height:84%}
.mx .q{border:2px dashed var(--c);font-family:var(--font-d);font-size:30px;color:color-mix(in srgb,var(--c) var(--catmix),var(--ink))}
.opt.svgopt{padding:6px;min-height:0}
.opt.svgopt svg{width:64px;height:64px}
.cell svg{width:70%;height:70%}
.spark{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:start}
.spark svg{width:100%;height:64px;display:block;margin-top:4px}
.why{background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:14px;padding:12px 14px;font-size:14.5px;text-align:start;width:100%}
.why b{color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));display:block;font-size:13px;margin-bottom:2px}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:800;color:#06240F;background:var(--good);border-radius:999px;padding:2px 9px;width:fit-content}
.badge.ev{position:absolute;top:18px;right:18px}
.rline{color:var(--muted);font-weight:700;font-size:14.5px}
.rline b{color:var(--ink);font-family:var(--font-d);font-weight:800;font-size:20px}
.ddf{position:relative;width:100%;max-width:100%;aspect-ratio:1;background:radial-gradient(circle,rgba(var(--tint),.08),rgba(var(--tint),.03) 70%);border:1px solid var(--line);border-radius:50%;overflow:hidden}
.fix{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;color:var(--muted);font-family:var(--font-d)}
.ddc{position:absolute;left:50%;top:50%;width:24%;transform:translate(-50%,-50%)}
.dds,.ddslot{position:absolute;width:14%;aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center}
.dds svg,.ddslot svg{width:100%;height:100%}
.ddslot{border-radius:50%;border:2px dashed rgba(var(--tint),.3);background:rgba(var(--tint),.05)}
.ddslot.right{border-color:var(--good);border-style:solid;background:transparent}
.ddslot.wrong{background:var(--bad);border-color:var(--bad)}
.mask{position:absolute;inset:0}
.mask i{position:absolute;width:13%;height:3px;background:var(--muted);border-radius:2px;opacity:.75}
.duo .match:disabled{cursor:default}

.pc{background:var(--surface2);border-radius:8px;display:grid;place-items:center;color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));transition:background .1s}
.pc svg{width:86%;height:86%}

.ps{border-radius:8px;border:1.5px dashed var(--line);display:grid;place-items:center}

.ps svg{width:70%;height:70%}
.ps.right{background:var(--good);border:0}
.ps.wrong{background:var(--bad);border:0}
.tol{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;direction:ltr}
.tpeg{position:relative;display:flex;flex-direction:column-reverse;align-items:center;gap:6px;padding:10px 0;height:calc(var(--cap)*54px + 22px);background:var(--surface);border:1px solid var(--line);border-radius:16px;cursor:pointer}
.tpeg::before{content:"";position:absolute;bottom:8px;top:8px;width:6px;border-radius:3px;background:var(--line);left:50%;transform:translateX(-50%)}
.tpeg i{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.3);transition:transform .15s}
.tpeg.sel{border-color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));box-shadow:0 0 0 2px var(--c)}
.tpeg.sel i:last-child{transform:translateY(-10px)}
.tolgoal{display:flex;flex-direction:column;align-items:center;gap:4px}
.tol.mini{width:min(60%,220px);gap:6px}
.tol.mini .tpeg{height:calc(var(--cap)*26px + 12px);padding:5px 0;gap:3px;cursor:default;border-radius:10px}
.tol.mini i{width:22px;height:22px}
/* ===== v6 refresh: aurora night, glass surfaces, rails ===== */
body{background-color:var(--bg);background-image:radial-gradient(50% 35% at 100% 0%,rgba(63,208,232,.30),transparent 70%),radial-gradient(45% 32% at 0% 10%,rgba(165,149,255,.30),transparent 70%),radial-gradient(50% 30% at 100% 55%,rgba(255,95,168,.14),transparent 70%),radial-gradient(60% 35% at 0% 100%,rgba(139,227,106,.14),transparent 70%)}
.card,.hero-card,.rcard,.wk-row,.ref,.stat{background:linear-gradient(160deg,rgba(var(--tint),.09),rgba(var(--tint),.035));border:1px solid rgba(var(--tint),.11);box-shadow:inset 0 1px 0 rgba(var(--tint),.07)}
.view>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards}
.view>*:nth-child(2){animation-delay:.05s}.view>*:nth-child(3){animation-delay:.1s}.view>*:nth-child(4){animation-delay:.15s}
@keyframes rise{from{transform:translateY(10px)}}
.hello h1{font-size:32px}
.wkgoal{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted);background:rgba(var(--tint),.06);border:1px solid rgba(var(--tint),.1);border-radius:16px;padding:8px 12px}
.wkgoal b{color:var(--ink);font-size:13px}
.dots3{display:flex;gap:5px}
.dots3 i{width:12px;height:12px;border-radius:50%;background:rgba(var(--tint),.14)}
.dots3.big{gap:10px}.dots3.big i{width:20px;height:20px}
.dots3 i.on{background:linear-gradient(135deg,#8BE36A,#3FD0E8);box-shadow:0 0 10px rgba(139,227,106,.6)}
.hero-card{border-radius:26px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.bring-wrap{width:min(100%,230px)}
.bring{width:100%;height:auto;display:block}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;width:100%}
.legend span{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);min-width:0}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend b{margin-inline-start:auto;color:var(--ink);font-weight:700}
.workout{background:linear-gradient(165deg,var(--panel1),var(--panel2)) padding-box,linear-gradient(120deg,#3FD0E8,#8BE36A,#FFD45A,#FF5FA8,#A595FF) border-box;border:1.5px solid transparent;border-radius:26px;gap:14px}
.wk-head h2{font-size:25px}
.wk-count{font-family:var(--font-d);font-size:24px;color:var(--muted)}
.wk-list{display:flex;flex-direction:column;gap:8px}
.wk-row{display:flex;align-items:center;gap:12px;border-radius:16px;padding:8px 10px 8px 12px;text-align:start;width:100%;transition:transform .12s}
.wk-row .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.wk-row .ico svg{width:62%;height:62%}
.wk-txt{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.3}
.wk-txt b{font-size:16px}
.wk-txt span{font-size:12.5px;font-weight:700}

.cta{background:linear-gradient(110deg,#3FD0E8,#8BE36A 50%,#FFD45A);box-shadow:0 12px 28px -14px #8BE36A}
.gsec{display:flex;flex-direction:column;gap:10px}

.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 8px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rcard{flex:none;width:146px;scroll-snap-align:start;border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px;text-align:start;position:relative;transition:transform .12s}

.rcard .ico svg{width:56%;height:56%}
.rcard b{font-size:15.5px;line-height:1.25}
.rmeta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;gap:4px}
.rmeta .new{color:var(--muted)}

.refs{display:flex;flex-direction:column;gap:8px}
.ref{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;border-radius:18px;padding:12px;color:var(--ink);text-decoration:none}

.tabs{background:var(--tabbg)}

.opt{background:rgba(var(--tint),.08)}
/* pal */
.palf{position:relative;width:100%;max-width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(var(--tint),.07),rgba(var(--tint),.02) 70%);border:1px solid var(--line)}
.pbox{position:absolute;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff 10%),color-mix(in srgb,var(--c2) 60%,#0A1024));box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 8px 16px -8px rgba(0,0,0,.6);display:grid;place-items:center;transition:background .15s,transform .15s}

.pbox.nob{background:var(--bad)}
.palc{position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center}
.palc svg{width:100%;height:100%}
.palc.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}









/* loci */
.loci{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lroom{position:relative;border-radius:14px;background:rgba(var(--tint),.06);border:1px solid rgba(var(--tint),.1);height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .2s}
.lroom.off{opacity:.25}

.lroom.rok{border-color:var(--good)}
.lroom.rno{border-color:var(--bad)}
.ln{position:absolute;top:4px;right:8px;font-size:11px;color:var(--muted);font-weight:700}
.lname{font-size:12.5px;font-weight:700}
.lit{font-size:26px;line-height:1;min-height:26px}
.lpick{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.lbig{font-size:72px;line-height:1;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.lhint,.lq{color:var(--muted);font-weight:700}
.lhint b,.lq b{color:color-mix(in srgb,var(--c) var(--catmix),var(--ink))}
.lpick .qo{width:100%}
.opt.emo{font-size:32px;padding:10px 0}


/* racer */
.signbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sgw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.sg{width:48px;height:48px;border-radius:12px;background:rgba(var(--tint),.08);border:1px solid var(--line);display:grid;place-items:center}
.sg svg{width:80%;height:80%}
.sg.live{width:64px;height:64px;border:2px dashed var(--line)}
.sg.live.on{border-style:solid;border-color:#fff;animation:pop .25s}
.road{border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;direction:ltr}
.steer{background:rgba(var(--tint),.1);border:1px solid var(--line);border-radius:18px;font-size:24px;padding:14px 0;touch-action:none;user-select:none;-webkit-user-select:none}
.steer:active{background:color-mix(in srgb,var(--c) 40%,transparent)}
/* transitive */
.prem{display:flex;flex-direction:column;gap:8px;align-items:center}
.prem>div{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:14px;padding:6px 14px;font-weight:700;font-size:15px}
.prem .tok{width:34px;height:34px}
.opt.svgopt .tok{width:54px;height:54px}
/* ===== v7: habits, recall, faces, coach, brain check ===== */
.muted{color:var(--muted);font-size:14px;margin:0}
.habits{display:flex;flex-direction:column;gap:12px}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hab{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(var(--tint),.05);border:1px solid rgba(var(--tint),.1);font-size:13.5px;font-weight:700;text-align:start;color:var(--muted);transition:all .15s}
.hab .hic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(var(--tint),.08);flex:none}
.hab .hic svg{width:18px;height:18px}
.hab.on{color:var(--ink);border-color:rgba(139,227,106,.6);background:rgba(139,227,106,.12)}
.hab.on .hic{background:linear-gradient(135deg,#8BE36A,#3FD0E8);color:#06122A}
.hweek{display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.hrow .hic svg{width:18px;height:18px}
.hdots{display:flex;gap:4px}
.hdots i{width:14px;height:14px;border-radius:4px;background:rgba(var(--tint),.09)}
.hdots i.on{background:#8BE36A}
.due{display:flex;align-items:center;gap:12px;text-align:start;width:100%;border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.due .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.due .ico svg{width:60%;height:60%}
.due>span:nth-child(2){display:flex;flex-direction:column;flex:1;min-width:0}
.due b{font-size:16px}
.due small{color:var(--muted);font-size:12.5px;font-weight:700}
.due .go{color:var(--muted);font-size:22px}
.encgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.encgrid span{font-size:46px;line-height:1;padding:16px 0;border-radius:18px;background:rgba(var(--tint),.07);border:1px solid rgba(var(--tint),.1);animation:pop .4s cubic-bezier(.2,1.6,.4,1) backwards}
.encgrid span:nth-child(2){animation-delay:.08s}.encgrid span:nth-child(3){animation-delay:.16s}.encgrid span:nth-child(4){animation-delay:.24s}.encgrid span:nth-child(5){animation-delay:.32s}.encgrid span:nth-child(6){animation-delay:.4s}
.encbar{width:100%;height:6px;border-radius:6px;background:rgba(var(--tint),.1);overflow:hidden}
.encbar i{display:block;height:100%;background:linear-gradient(90deg,#7AF0D2,#3FD0E8);transform-origin:right;animation:drain 16s linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.go-btn:disabled{opacity:.45}
.recgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.recgrid .opt{padding:10px 0;font-size:30px;min-height:58px}
.opt.pick{border-color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));background:color-mix(in srgb,var(--c) 22%,transparent)}
.opt.miss{border-style:dashed;border-color:var(--good)}
.fcard{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:250px;justify-content:center;border-radius:22px;background:linear-gradient(160deg,rgba(var(--tint),.08),rgba(var(--tint),.03));border:1px solid rgba(var(--tint),.1);padding:12px}
.fcard svg{width:150px;height:150px}
.fname{font-family:var(--font-d);font-size:30px;line-height:1.1}
.fjob{color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));font-weight:800}
.ftip{color:var(--muted);font-size:13px;font-weight:700}
.lbl-in{font-size:13px;font-weight:700;color:var(--muted)}
.ta{width:100%;font:inherit;font-size:16px;color:var(--ink);background:rgba(var(--tint),.06);border:1px solid var(--line);border-radius:16px;padding:12px 14px;resize:vertical;line-height:1.7}
.ta:focus{outline:2px solid var(--c);outline-offset:1px}
.litem{font-family:var(--font-d);font-size:34px;line-height:1.2;text-align:center;max-width:100%;overflow-wrap:anywhere;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}



@keyframes pulse{0%{transform:scale(1);box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}40%{transform:scale(1.08)}100%{transform:scale(1);box-shadow:0 0 0 30px transparent}}
.rtf{position:relative;height:200px;border-radius:22px;background:rgba(var(--tint),.05);border:1px solid var(--line)}
.rtf i{position:absolute;top:50%;width:76px;height:76px;margin-top:-38px;border-radius:50%;background:rgba(var(--tint),.06);border:2px dashed rgba(var(--tint),.15)}
.rtf .dotL{left:14%}.rtf .dotR{right:14%}
.rtf i.on{background:#FFD25A;border:0;box-shadow:0 0 40px rgba(255,210,90,.7)}
.cmprow{display:flex;gap:10px;justify-content:center}
.cmprow svg{width:48px;height:48px;color:var(--ink)}
.abar{display:grid;grid-template-columns:110px 1fr 64px auto;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.abar .bt{height:8px;border-radius:8px;background:rgba(var(--tint),.1);overflow:hidden}
.abar .bt i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#3FD0E8,#8BE36A)}
.abar b{color:var(--ink);text-align:left}
.acard{display:flex;flex-direction:column;gap:10px}
.arow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.arow b{display:block;font-family:var(--font-d);font-weight:800;font-size:28px}
.aspark{width:100%;height:60px}
.coach{display:flex;flex-direction:column;gap:12px;background:linear-gradient(165deg,var(--panel3),var(--panel2)) padding-box,linear-gradient(130deg,#A595FF,#3FD0E8) border-box;border:1.5px solid transparent}
.chead{font-size:21px}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cgrid ul{margin:4px 0 0;padding-inline-start:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
@media (max-width:380px){.cgrid{grid-template-columns:1fr}}
.cplan{display:flex;flex-direction:column;gap:6px}
.cp{display:flex;align-items:center;gap:10px}
.cp .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.cp .ico svg{width:60%;height:60%}
.cp>span:last-child{display:flex;flex-direction:column;min-width:0}
.cp small{color:var(--muted);font-size:12.5px}
.chabit{margin:0;font-size:14px}
.cerr{margin:0;color:var(--bad);font-weight:700;font-size:14px}
.thinking{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;padding:8px 0}
.thinking i{width:8px;height:8px;border-radius:50%;background:#A595FF;animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.refs.clip .ref:nth-child(n+7){display:none}
/* ===== v8: Tajawal, light skin, new games ===== */
:root{--tint:255,255,255;--panel1:#18204a;--panel2:#121838;--panel3:#22224f;--tabbg:rgba(11,17,48,.88);--catmix:100%}
:root[data-skin="light"]{color-scheme:light;--bg:#EEF2FB;--bg2:rgba(20,30,80,.06);--surface:rgba(20,30,80,.05);--surface2:rgba(20,30,80,.08);--line:rgba(20,30,80,.14);--ink:#141B3D;--muted:#58618A;--dim:#8A92B5;--tint:20,30,80;--panel1:#FFFFFF;--panel2:#F3F6FD;--panel3:#F3F0FF;--tabbg:rgba(255,255,255,.92);--catmix:60%}
@media (prefers-color-scheme: light){:root[data-skin="auto"]:not([data-theme="dark"]){color-scheme:light;--bg:#EEF2FB;--bg2:rgba(20,30,80,.06);--surface:rgba(20,30,80,.05);--surface2:rgba(20,30,80,.08);--line:rgba(20,30,80,.14);--ink:#141B3D;--muted:#58618A;--dim:#8A92B5;--tint:20,30,80;--panel1:#FFFFFF;--panel2:#F3F6FD;--panel3:#F3F0FF;--tabbg:rgba(255,255,255,.92);--catmix:60%}}
:root[data-skin="auto"][data-theme="light"]{color-scheme:light;--bg:#EEF2FB;--bg2:rgba(20,30,80,.06);--surface:rgba(20,30,80,.05);--surface2:rgba(20,30,80,.08);--line:rgba(20,30,80,.14);--ink:#141B3D;--muted:#58618A;--dim:#8A92B5;--tint:20,30,80;--panel1:#FFFFFF;--panel2:#F3F6FD;--panel3:#F3F0FF;--tabbg:rgba(255,255,255,.92);--catmix:60%}
.eyebrow .dh,.eyebrow .dg{display:block}
.eyebrow .dg{opacity:.8}
.seg{display:flex;gap:4px;background:rgba(var(--tint),.07);border-radius:12px;padding:3px}
.seg button{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.share{display:flex;flex-direction:column;gap:10px}
.share img{width:100%;max-width:100%;border-radius:18px;display:block;box-shadow:0 14px 30px -18px rgba(0,0,0,.6)}
.pmtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.peek{font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.pmcard{min-height:150px;border:3px solid transparent;transition:border-color .1s}
.pmcard.cue{border-color:#FFD25A;box-shadow:0 0 0 5px rgba(255,210,90,.25),inset 0 0 34px rgba(255,210,90,.18)}
.pmcard.cue2{border-color:rgba(255,210,90,.7)}
.pmb{font-size:15.5px;padding:14px 6px}.navf{width:100%;max-width:100%;aspect-ratio:1;border-radius:22px;background:rgba(var(--tint),.05);border:1px solid var(--line);touch-action:none}
.navf{padding:6px}.navf svg{width:100%;height:100%;display:block}
#dsv line{stroke-width:2.8;stroke-linecap:round}
#dsv .fig{stroke:var(--c)}#dsv .good{stroke:#4BE08A}#dsv .extra{stroke:#FF5C6C}
#dsv .dd{fill:var(--muted)}#dsv .dd.on{fill:var(--c)}#dsv .dh{fill:transparent;cursor:pointer}


#nsv .fog{fill:rgba(var(--tint),.07)}#nsv .vis{fill:color-mix(in srgb,var(--c) 16%,transparent)}
#nsv .wl{stroke:var(--ink);stroke-width:1.7;stroke-linecap:round}#nsv .cp{fill:var(--c)}#nsv .cp.got{fill:#4BE08A}
#nsv .cpt{fill:#0A1024;font-weight:800;text-anchor:middle;font-family:Tajawal,sans-serif}#nsv .st{fill:none;stroke:var(--ink);stroke-width:1.6}#nsv .me{fill:#fff;stroke:var(--c);stroke-width:2.2}
.pad4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:". n ." "w p e" ". s .";gap:6px;direction:ltr}
.pad4 button{background:rgba(var(--tint),.1);border:1px solid var(--line);border-radius:14px;padding:10px 0;font-size:20px;touch-action:manipulation}
.pad4 [data-d=N]{grid-area:n}.pad4 [data-d=S]{grid-area:s}.pad4 [data-d=W]{grid-area:w}.pad4 [data-d=E]{grid-area:e}.pad4 .peekb{grid-area:p;font-size:13px;font-weight:700}
.pad4 button:disabled{opacity:.35}

.sp{border-radius:26px;opacity:.5;transition:opacity .08s,transform .08s;touch-action:manipulation}

.sp.on{opacity:1;transform:scale(1.03);box-shadow:0 0 34px currentColor}





.storyc{border-radius:20px;background:rgba(var(--tint),.06);border:1px solid var(--line);padding:16px;font-size:17px;line-height:1.9}
.storyc p{margin:0 0 6px}
/* ===== v9: series, hawk, crossword, breath, boosters, challenge, movement ===== */
.serrow{display:flex;flex-wrap:nowrap;gap:5px;justify-content:center;width:100%}
.sert{flex:1 1 0;min-width:0;max-width:46px;height:46px;padding:0 2px;border-radius:12px;background:rgba(var(--tint),.08);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:clamp(18px,6.2vw,26px)}
.sert.q{border:2px dashed var(--c);color:color-mix(in srgb,var(--c) var(--catmix),var(--ink))}
.sert .sertok{width:min(30px,100%);height:30px}.opt .sertok{width:30px;height:30px}
.opt.svgopt .sertok{width:48px;height:48px}
.serans{font-family:var(--font-d);font-weight:800;font-size:30px}
.abc{font-size:12px;color:var(--dim);letter-spacing:.06em;max-width:100%;overflow-wrap:anywhere;text-align:center}
.hb{position:absolute;width:13%;aspect-ratio:4/3;transform:translate(-50%,-50%)}
.hb svg{width:100%;height:100%}
.xclue{display:flex;align-items:center;gap:8px;background:rgba(var(--tint),.07);border:1px solid var(--line);border-radius:14px;padding:8px 10px;font-size:14.5px;min-height:56px}

.xgrid{display:flex;justify-content:center}

.stage:has(.xg){gap:9px}.stage:has(.xg) .duo .cta{padding:10px 12px;font-size:15px}
.xcell,.xb{aspect-ratio:1;border-radius:6px;position:relative}
.xb{background:transparent}
.xcell{background:rgba(var(--tint),.1);border:1px solid var(--line);display:grid;place-items:center}
.xcell i{position:absolute;top:1px;right:3px;font-style:normal;font-size:9px;color:var(--muted);font-weight:700}
.xcell b{font-family:var(--font-d);font-weight:800;font-size:clamp(15px,5vw,22px)}
.xcell.inw{background:color-mix(in srgb,var(--c) 22%,transparent)}
.xcell.cur{box-shadow:inset 0 0 0 2.5px var(--c)}
.xcell.bad b{color:var(--bad)}
.xkb{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.xkb button{background:rgba(var(--tint),.1);border:1px solid var(--line);border-radius:8px;padding:7px 0;font-family:var(--font-d);font-weight:800;font-size:17px;touch-action:manipulation}

const AW={times:['مرة واحدة','مرتين','مرات','مرة'],min:['دقيقة واحدة','دقيقتين','دقائق','دقيقة'],sec:['ثانية واحدة','ثانيتين','ثوانٍ','ثانية'],cyc:['دورة واحدة','دورتين','دورات','دورة'],step:['خطوة واحدة','خطوتين','خطوات','خطوة'],wrong:['اختيار خاطئ واحد','اختياران خاطئان','اختيارات خاطئة','اختيارًا خاطئًا']};

const fmtDur=s=>{s=Math.max(1,Math.round(s));const m=Math.floor(s/60),r=s%60;return m?arN(m,AW.min)+(r?' و'+arN(r,AW.sec):''):arN(r,AW.sec)};

  st:{v:1,hist:[],best:{},lv:{},days:{},wdone:{},wk:null,life:{},assess:[],enc:null,mylist:null,coach:null,plan:null,mute:false},ref:null,cloud:false,timer:null,
  loadLocal(){try{const v=localStorage.getItem('miran:v2');if(v)Object.assign(this.st,JSON.parse(v))}catch(e){}},
  merge(r){if(!r)return;const st=this.st,ids=new Set(st.hist.map(h=>h.id));(r.hist||[]).forEach(h=>{if(!ids.has(h.id))st.hist.push(h)});st.hist.sort((a,b)=>a.ts-b.ts);if(st.hist.length>400)st.hist=st.hist.slice(-400);

    for(const[k,v]of Object.entries(r.lv||{}))st.lv[k]=Math.max(st.lv[k]||1,v);
    for(const[k,v]of Object.entries(r.days||{}))st.days[k]=Math.max(st.days[k]||0,v);

    const newer=(a,b,f)=>!a?b:!b?a:(f(b)>f(a)?b:a);st.enc=newer(st.enc,r.enc,x=>x.ts||0);st.mylist=newer(st.mylist,r.mylist,x=>(x.ts||0)+(x.reviews||0));st.coach=newer(st.coach,r.coach,x=>x.d||'');st.plan=newer(st.plan,r.plan,x=>x.w||'');

const GM=Object.fromEntries(G.map(g=>[g.id,g]));S.prune();

/* ================= derived stats ================= */
function gameIndex(id){const xs=S.st.hist.filter(h=>h.g===id).slice(-10).map(h=>h.idx).sort((a,b)=>b-a).slice(0,3);return xs.length?Math.round(xs.reduce((a,b)=>a+b)/xs.length):null}
function catIndex(c){const xs=G.filter(g=>g.cat===c&&!g.noIndex).map(g=>gameIndex(g.id)).filter(v=>v!=null);return xs.length?Math.round(xs.reduce((a,b)=>a+b)/xs.length):null}
function brainIndex(){const xs=Object.keys(CATS).map(catIndex).filter(v=>v!=null);return xs.length?Math.round(xs.reduce((a,b)=>a+b)/xs.length):null}
const starsOf=i=>i==null?0:i>=850?3:i>=600?2:i>=350?1:0;
function streak(){let n=0,d=new Date();if(!S.st.days[dayKey(d)])d=addDays(d,-1);while(S.st.days[dayKey(d)]){n++;d=addDays(d,-1)}return n}
function seeded(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function workout(){const k=dayKey();if(boostActive()){if(!S.st.wk||S.st.wk.d!==k||S.st.wk.ids.join()!==S.st.boost.ids.join()){S.st.wk={d:k,ids:S.st.boost.ids.slice()};S.save()}return S.st.wk.ids}if(planActive()){if(!S.st.wk||S.st.wk.d!==k||S.st.wk.ids.join()!==S.st.plan.ids.join()){S.st.wk={d:k,ids:S.st.plan.ids.slice()};S.save()}return S.st.wk.ids}if(S.st.wk&&S.st.wk.d===k&&S.st.wk.ids.every(id=>GM[id]))return S.st.wk.ids;
  let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))|0;const r=seeded(h);const others=['spa','log','foc','flx'];for(let i=others.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[others[i],others[j]]=[others[j],others[i]]}
  const plays=id=>S.st.hist.filter(x=>x.g===id).length;
  const ids=['mem','spd',...others.slice(0,2)].map(c=>{const gs=G.filter(g=>g.cat===c&&(c!=='spd'||g.id==='dd'||g.id==='hawk')&&!g.hidden&&!g.manual&&!(g.sound&&S.st.mute)),m=Math.min(...gs.map(g=>plays(g.id))),f=gs.filter(g=>plays(g.id)===m);return f[Math.floor(r()*f.length)].id});
  S.st.wk={d:k,ids};S.save();return ids}
function doneToday(id){const k=dayKey();return S.st.hist.some(h=>h.g===id&&h.d===k)}

/* ================= small render helpers ================= */
const STAR=on=>`<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z" fill="${on?'var(--gold)':'var(--line)'}"/></svg>`;
const stars=n=>`<span class="stars">${[0,1,2].map(i=>STAR(i<n)).join('')}</span>`;
const icoBox=(g,cls='ico')=>`<div class="${cls}" style="--c:${g.col[0]};background:linear-gradient(140deg,${g.col[0]},${g.col[1]});color:${g.col[0]}">${I[g.id]}</div>`;
function greet(){const h=new Date().getHours();return h<5?'سهرانين؟':h<12?'صباح الخير':h<17?'نهارك سعيد':'مساء الخير'}
const hijri=()=>{try{const d=new Date(),h=d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),g=d.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric'});return`<span class="dh">${h}</span><span class="dg">${g}م</span>`}catch(e){return''}};
const catTxt=h=>`color:color-mix(in srgb,${h} var(--catmix),var(--ink))`;
const FLAME='<svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3-1-3 0-6 1-9.5z" fill="var(--spd)"/></svg>';

/* ================= views ================= */
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PLAY='<svg viewBox="0 0 24 24"><path d="M15.5 6l-7 6 7 6z" fill="currentColor"/></svg>';
function weekInfo(){const now=new Date(),s=addDays(now,-now.getDay()),days=[...Array(7)].map((_,i)=>dayKey(addDays(s,i)));return{done:days.filter(d=>S.st.wdone&&S.st.wdone[d]).length,days}}
function brainRing(){const keys=Object.keys(CATS),cx=100,cy=100,R=80,seg=360/keys.length,gap=5;
  const P=(a,r)=>[cx+r*Math.cos((a-90)*Math.PI/180),cy+r*Math.sin((a-90)*Math.PI/180)];
  const arc=(a0,a1)=>{const[x0,y0]=P(a0,R),[x1,y1]=P(a1,R);return`M${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`};
  let s='';keys.forEach((k,i)=>{const a0=i*seg+gap/2,a1=(i+1)*seg-gap/2,v=catIndex(k)??0;s+=`<path d="${arc(a0,a1)}" style="stroke:rgba(var(--tint),.1)" stroke-width="15" fill="none"/>`;if(v>0)s+=`<path d="${arc(a0,a0+(a1-a0)*Math.max(.03,v/1000))}" stroke="${CATS[k].hex}" stroke-width="15" fill="none"/>`});
  const bi=brainIndex();
  return`<svg viewBox="0 0 200 200" class="bring" role="img" aria-label="مؤشر العقل">${s}<circle cx="100" cy="100" r="62" style="fill:rgba(var(--tint),.05)"/><text x="100" y="110" text-anchor="middle" font-family="Tajawal,sans-serif" font-weight="800" font-size="46" style="fill:var(--ink)">${bi??'—'}</text><text x="100" y="132" text-anchor="middle" font-family="Tajawal,sans-serif" font-size="11.5" font-weight="700" style="fill:var(--muted)">مؤشر العقل · من 1000</text></svg>`}
const evBadge=g=>g.ev?'<span class="badge ev">مثبت علميًا</span>':'';
function railCard(g){const gi=gameIndex(g.id);return`<button class="rcard" data-g="${g.id}" style="--c:${g.col[0]}">${icoBox(g)}${evBadge(g)}<b>${g.name}</b><span class="rmeta"><span style="${catTxt(CATS[g.cat].hex)}">${CATS[g.cat].n}</span>${gi!=null?stars(starsOf(gi)):'<span class="new">جديدة</span>'}</span></button>`}
function renderHome(){
  const wk=workout(),done=wk.filter(doneToday).length,w=weekInfo(),fresh=G.filter(g=>!g.hidden&&!S.st.hist.some(h=>h.g===g.id)),allDone=wk.every(doneToday);
  $('#v-home').innerHTML=`
  <div class="top"><div class="hello"><span class="eyebrow">${hijri()}</span><h1>${greet()}</h1></div>
   <div class="wkgoal" title="هدف الأسبوع"><span class="dots3">${[0,1,2].map(i=>`<i class="${i<w.done?'on':''}"></i>`).join('')}</span><span><b class="num">${Math.min(w.done,3)}/3</b> هذا الأسبوع</span></div></div>
  <section class="hero-card"><div class="bring-wrap">${brainRing()}</div>
   <div class="legend">${Object.entries(CATS).map(([k,c])=>`<span><i style="background:${c.hex}"></i>${c.n}<b class="num">${catIndex(k)??'—'}</b></span>`).join('')}</div></section>
  <section class="workout"><div class="wk-head"><div><span class="eyebrow">${boostActive()?'<span class="badge">أسبوع التعزيز</span> ':planActive()?'<span class="badge">خطة المدرب</span> ':''}تمرين اليوم · 4 ألعاب + تذكر مؤجل</span><h2>${done===4?'أنهيت تمرين اليوم':done?`باقي ${arN(4-done,['لعبة واحدة','لعبتان','ألعاب','لعبة'])}`:'تمرينك جاهز'}</h2></div><span class="wk-count num">${done}/4</span></div>
   <div class="wk-list">${wk.map(id=>{const g=GM[id],d=doneToday(id);return`<button class="wk-row ${d?'done':''}" data-g="${id}" style="--c:${g.col[0]}">${icoBox(g)}<span class="wk-txt"><b>${g.name}</b><span style="${catTxt(CATS[g.cat].hex)}">${CATS[g.cat].n}</span></span><span class="wk-state">${d?CHECK:PLAY}</span></button>`}).join('')}</div>
   <button class="cta ${done===4?'done':''}" id="wkgo">${done===4?'العب لعبة إضافية':done?'تابع التمرين':'ابدأ التمرين'}</button></section>

function radarSVG(){
  const keys=Object.keys(CATS),cx=160,cy=150,R=96,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/keys.length;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const ring=f=>keys.map((_,i)=>pt(i,R*f).join(',')).join(' '),vals=keys.map(k=>catIndex(k)??0),poly=vals.map((v,i)=>pt(i,R*v/1000).join(',')).join(' ');
  return`<svg viewBox="0 0 320 300" role="img" aria-label="مخطط المهارات"><defs><linearGradient id="radarfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3FD0E8" stop-opacity=".45"/><stop offset="1" stop-color="#FF5FA8" stop-opacity=".3"/></linearGradient></defs>
   ${[.25,.5,.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" style="stroke:rgba(var(--tint),.12)"/>`).join('')}
   ${keys.map((_,i)=>{const[x,y]=pt(i,R);return`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:rgba(var(--tint),.1)"/>`}).join('')}
   <polygon points="${poly}" fill="url(#radarfill)" style="stroke:var(--ink)" stroke-width="2" stroke-linejoin="round"/>
   ${vals.map((v,i)=>{const[x,y]=pt(i,R*v/1000);return`<circle cx="${x}" cy="${y}" r="5" fill="${CATS[keys[i]].hex}" style="stroke:var(--bg)" stroke-width="2"/>`}).join('')}
   ${keys.map((k,i)=>{const[x,y]=pt(i,R+30);return`<text x="${x}" y="${y}" text-anchor="middle" font-family="Tajawal,sans-serif" font-size="13" font-weight="700" fill="${CATS[k].hex}">${CATS[k].n}</text><text x="${x}" y="${y+16}" text-anchor="middle" font-family="Tajawal,sans-serif" font-size="12" style="fill:var(--muted)">${catIndex(k)??'—'}</text>`}).join('')}
  </svg>`}

    $('#tl').textContent;$('#ml').innerHTML=`<span class="num ltr" style="font-size:18px">0 / ${min}</span>`;$('#m').innerHTML=`لغز ${pi+1} من 6 · طابق الهدف في <b class="num">${min}</b> حركات`;draw()}

/* ---------- 3. The navigator (wayfinding, Sea Hero Quest inspired) ---------- */
function runNav(){return done=>{
  const lv=S.st.lv.nav||1,n=Math.min(7,4+lv),m=Math.min(4,2+Math.floor((lv-1)/2)),LIMIT=150;
  const W=[...Array(n*n)].map(()=>({N:1,E:1,S:1,W:1})),idx=(r,c)=>r*n+c,D={N:[-1,0,'S'],S:[1,0,'N'],E:[0,1,'W'],W:[0,-1,'E']};
  (function carve(){const seen=new Set([0]),stk=[0];while(stk.length){const cur=stk[stk.length-1],r=Math.floor(cur/n),c=cur%n;const opts=Object.entries(D).filter(([d,[dr,dc]])=>{const rr=r+dr,cc=c+dc;return rr>=0&&rr<n&&cc>=0&&cc<n&&!seen.has(idx(rr,cc))});
    if(!opts.length){stk.pop();continue}const[d,[dr,dc,op]]=pick(opts),nx=idx(r+dr,c+dc);W[cur][d]=0;W[nx][op]=0;seen.add(nx);stk.push(nx)}
    for(let k=0;k<n;k++){const cur=rnd(n*n),r=Math.floor(cur/n),c=cur%n,d=pick(Object.keys(D)),[dr,dc,op]=D[d],rr=r+dr,cc=c+dc;if(rr>=0&&rr<n&&cc>=0&&cc<n){W[cur][d]=0;W[idx(rr,cc)][op]=0}}})();
  const bfs=(a)=>{const dist=Array(n*n).fill(-1),q=[a];dist[a]=0;while(q.length){const cur=q.shift(),r=Math.floor(cur/n),c=cur%n;for(const[d,[dr,dc]]of Object.entries(D)){if(W[cur][d])continue;const nx=idx(r+dr,c+dc);if(dist[nx]<0){dist[nx]=dist[cur]+1;q.push(nx)}}}return dist};
  const start=rnd(n*n);const cps=[];let prev=start;for(let k=0;k<m;k++){const d=bfs(prev);const cand=[...d.keys()].filter(i=>i!==start&&!cps.includes(i)&&d[i]>=Math.max(2,n-2));const pickc=cand.length?pick(cand):[...d.keys()].filter(i=>i!==start&&!cps.includes(i)).sort((a,b)=>d[b]-d[a])[0];cps.push(pickc);prev=pickc}
  let shortest=0;[start,...cps].reduce((a,b)=>{shortest+=bfs(a)[b];return b});
  const st=$('#stage');st.innerHTML=hudHTML(true)+`<div class="msg" id="m"></div><div class="navf"><svg id="nsv" viewBox="-2 -2 104 104"></svg></div><div class="pad4" id="pd"><button data-d="N" aria-label="أعلى">▲</button><button data-d="W" aria-label="يسار">◀</button><button class="peekb" id="pk">خريطة (1)</button><button data-d="E" aria-label="يمين">▶</button><button data-d="S" aria-label="أسفل">▼</button></div><button class="go-btn" id="rd">حفظت الخريطة</button>`;
  const svg=$('#nsv'),cs=100/n;let pos=start,steps=0,bumps=0,next=0,visited=new Set([start]),phase='study',peek=1,pts=0;
  const ctr=i=>[(i%n+.5)*cs,(Math.floor(i/n)+.5)*cs];
  function render(full){let h='';
    for(let i=0;i<n*n;i++){const r=Math.floor(i/n),c=i%n,x=c*cs,y=r*cs;const near=full||i===pos||visited.has(i);
      if(!full&&!near)h+=`<rect x="${x}" y="${y}" width="${cs}" height="${cs}" class="fog"/>`;else if(visited.has(i)&&!full)h+=`<rect x="${x}" y="${y}" width="${cs}" height="${cs}" class="vis"/>`;
      if(full||i===pos||visited.has(i)){const w=W[i];if(w.N)h+=`<line x1="${x}" y1="${y}" x2="${x+cs}" y2="${y}" class="wl"/>`;if(w.S)h+=`<line x1="${x}" y1="${y+cs}" x2="${x+cs}" y2="${y+cs}" class="wl"/>`;if(w.W)h+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+cs}" class="wl"/>`;if(w.E)h+=`<line x1="${x+cs}" y1="${y}" x2="${x+cs}" y2="${y+cs}" class="wl"/>`}}
    cps.forEach((cp,k)=>{if(full||k<next){const[x,y]=ctr(cp);h+=`<circle cx="${x}" cy="${y}" r="${cs*.3}" class="cp${k<next?' got':''}"/><text x="${x}" y="${y+cs*.12}" class="cpt" font-size="${cs*.36}">${k+1}</text>`}});
    if(full){const[x,y]=ctr(start);h+=`<rect x="${x-cs*.25}" y="${y-cs*.25}" width="${cs*.5}" height="${cs*.5}" rx="${cs*.1}" class="st"/>`}
    if(phase!=='study'){const[x,y]=ctr(pos);h+=`<circle cx="${x}" cy="${y}" r="${cs*.26}" class="me"/>`}
    svg.innerHTML=h}
  $('#tl').textContent='';$('#m').innerHTML=`احفظ الخريطة: المربع هو بدايتك، وزر النقاط <b>بالترتيب</b> من 1 إلى ${m}`;render(true);$('#pd').hidden=true;
  const go=()=>{if(phase!=='study')return;phase='walk';$('#rd').remove();$('#pd').hidden=false;$('#m').innerHTML=`اذهب إلى النقطة <b>1</b>`;render(false);timeBar(LIMIT,end)};
  $('#rd').onclick=go;later(go,7000+m*2000+n*400);
  function move(d){if(phase!=='walk')return;if(W[pos][d]){bumps++;const f=$('.navf');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');tone(140,.08,'sawtooth',.04);return}
    const[dr,dc]=D[d];pos=idx(Math.floor(pos/n)+dr,pos%n+dc);steps++;visited.add(pos);tone(480,.03);
    if(pos===cps[next]){next++;pts+=60;$('#sc').textContent=pts;sfx.lvl();floatAt(st,...relPos(svg,st),'+60');if(next>=m){render(false);later(end,500);return}$('#m').innerHTML=`ممتاز! الآن إلى النقطة <b>${next+1}</b>`}
    else if(cps.includes(pos)&&cps.indexOf(pos)>next)$('#m').innerHTML=`هذه النقطة ${cps.indexOf(pos)+1}، لكن المطلوب الآن <b>${next+1}</b>`;
    render(false)}
  $('#pd').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(b.dataset.d));
  $('#pk').onclick=()=>{if(phase!=='walk'||!peek)return;peek=0;$('#pk').disabled=true;$('#pk').textContent='خريطة (0)';render(true);later(()=>render(false),1800)};
  keyH=e=>{const k={ArrowUp:'N',ArrowDown:'S',ArrowLeft:'W',ArrowRight:'E'}[e.key];if(k){e.preventDefault();move(k)}};
  let sx=0,sy=0;svg.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};svg.onpointerup=e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'E':'W'):(dy>0?'S':'N'))};
  function end(){if(phase==='done')return;phase='done';stopAll();const eff=steps?Math.min(1,shortest/steps):0,found=next/m,mt=clamp(eff*found-(peek?0:.08),0,1);let nl=lv;if(mt>.75)nl=lv+1;else if(mt<.35&&lv>1)nl=lv-1;S.st.lv.nav=nl;
    done({pts:pts+Math.round(eff*found*200),metric:mt,detail:`وصلت إلى ${next} من ${m} نقاط، في ${arN(steps,AW.step)} (أقصر طريق ${shortest}). كفاءة طريقك ${Math.round(eff*100)}%.${bumps?` اصطدمت بالجدار ${arN(bumps,AW.times)}.`:''}`})}
}}

/* ---------- 1. Pattern series (ACTIVE reasoning: letter series, no arithmetic) ---------- */
const AL='ابتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('');
const SERCOL=['#3FD0E8','#FF5F7A','#8BE36A','#FFD45A'],SERSH=['c','s','t','d'];
function makeSeries(){let last='';return lv=>{
  const kinds=['rep','skip1','skip2','back','alt','grow','shape','skip3'].slice(0,Math.min(2+lv,8));let k;do k=pick(kinds);while(k===last&&kinds.length>1);last=k;
  if(k==='shape'){const pS=2+rnd(2),pC=pS===2?3:2,s0=rnd(4),c0=rnd(4),sh=i=>SERSH[(s0+i%pS)%4],co=i=>SERCOL[(c0+i%pC)%4],L=6;
    const tok=(s,c)=>`<svg viewBox="0 0 40 40" class="sertok">${SHP[s](20,21,13,c)}</svg>`;const ans={s:sh(L),c:co(L)};
    const set=[ans,{s:sh(L+1),c:co(L)},{s:sh(L),c:co(L+1)},{s:sh(L+1),c:co(L+1)}].filter((o,i,a)=>a.findIndex(x=>x.s===o.s&&x.c===o.c)===i);
    while(set.length<4){const o={s:pick(SERSH),c:pick(SERCOL)};if(!set.some(x=>x.s===o.s&&x.c===o.c))set.push(o)}shuffle(set);
    return{prompt:`<div class="sub">ما الشكل التالي؟ (الشكل واللون يتكرران كلٌّ بنمطه)</div><div class="serrow">${[...Array(L)].map((_,i)=>`<span class="sert">${tok(sh(i),co(i))}</span>`).join('')}<span class="sert q">؟</span></div>`,
      opts:set.map(o=>({html:tok(o.s,o.c),cls:'svgopt'})),ans:set.findIndex(o=>o===ans),cols:2}}
  let seq=[],ans;
  if(k==='rep'){const p=2+rnd(2),base=shuffle(AL.slice()).slice(0,p);for(let i=0;i<7;i++)seq.push(base[i%p]);ans=base[7%p]}
  else if(k.startsWith('skip')){const st=+k.slice(4)||1;const s=rnd(28-st*5);for(let i=0;i<5;i++)seq.push(AL[s+st*i]);ans=AL[s+st*5]}
  else if(k==='back'){const st=1+rnd(2),s=st*5+rnd(28-st*5);for(let i=0;i<5;i++)seq.push(AL[s-st*i]);ans=AL[s-st*5]}
  else if(k==='alt'){const a=rnd(8),z=27-rnd(8);for(let i=0;i<3;i++){seq.push(AL[a+i],AL[z-i])}ans=AL[a+3]}
  else{const s=rnd(24);for(let i=0;i<3;i++)for(let j=0;j<=i;j++)seq.push(AL[s+i]);ans=AL[s+3]}
  const ai=AL.indexOf(ans),cand=new Set([ans]);[ai+1,ai-1,ai+2,ai-2,ai+3].forEach(i=>{if(cand.size<4&&i>=0&&i<28)cand.add(AL[i])});seq.slice(-2).forEach(x=>{if(cand.size<4)cand.add(x)});
  const vals=shuffle([...cand].slice(0,4));
  return{prompt:`<div class="sub">ما الحرف التالي في السلسلة؟</div><div class="serrow">${seq.map(x=>`<span class="sert">${x}</span>`).join('')}<span class="sert q">؟</span></div><div class="abc">${AL.join(' ')}</div>`,opts:vals.map(v=>({html:`<span class="serans">${v}</span>`})),ans:vals.indexOf(ans),cols:2}}}

/* ---------- 2. Hawk eye (speed of processing, visual precision) ---------- */
function birdSVG(b){const f=b.f;return`<svg viewBox="0 0 40 30"><g transform="${f<0?'translate(40 0) scale(-1 1)':''}"><path d="${b.w?'M4 14c6-9 12-9 16-2 4-7 10-7 16 2-6-3-11-1-16 6-5-7-10-9-16-6z':'M4 10c7 2 12 4 16 9 4-5 9-7 16-9-5 6-10 10-16 13-6-3-11-7-16-13z'}" fill="${b.c}"/><circle cx="${b.w?27:26}" cy="${b.w?12:15}" r="1.6" fill="#0A1024"/></g></svg>`}
function runHawk(){return done=>{
  const lv=S.st.lv.hawkLv||1,N=16,BLK=4,st=$('#stage');let dur=clamp(S.st.lv.hawkMs||1000,250,1500),trial=0,ok=0,pts=0,odd=-1,phase=0,pair=null,shown=-1;const durs=[];
  st.innerHTML=hudHTML(false)+'<div class="msg" id="m"></div><div class="ddf" id="f"></div>';
  const f=$('#f'),ring=n=>[...Array(n)].map((_,i)=>{const a=i*2*Math.PI/n-Math.PI/2;return[50+36*Math.cos(a),50+36*Math.sin(a)]});
  const P=lv>=3?[...ring(8),...[0,1,2,3].map(i=>{const a=i*Math.PI/2-Math.PI/4;return[50+17*Math.cos(a),50+17*Math.sin(a)]})]:ring(8);
  const showMs=()=>$('#ml').innerHTML=`<span class="ltr num" style="font-size:18px">${Math.round(dur)} ms</span>`;showMs();
  const LAB={f:'ينظر إلى الجهة المعاكسة',w:'جناحاه في وضع مختلف',c:'لونه مختلف قليلًا'};
  function newPair(){const base={f:pick([1,-1]),w:Math.random()<.5,c:'hsl('+(rnd(12)*30)+' 75% 62%)'};const mode=pick(lv>=3?['w','c','f']:lv>=2?['w','c']:['w']);const ob={...base};
    if(mode==='f')ob.f=-base.f;else if(mode==='w')ob.w=!base.w;else ob.c=base.c.replace(/hsl\((\d+)/,(m,h)=>'hsl('+((+h+28)%360));return{base,ob,mode}}
  function next(){if(trial>=N){end();return}const b=Math.floor(trial/BLK);if(b!==shown){shown=b;preview();return}trial0()}
  function preview(){phase=0;pair=newPair();$('#m').textContent=trial?'سرب جديد: تعرّف على الطائر المختلف':'تعرّف على الطائر المختلف قبل أن يومض';
    f.innerHTML=`<div class="hkprev"><div class="hkrow"><div><b class="hkb odd">${birdSVG(pair.ob)}</b><span>ابحث عن هذا</span></div><div><b class="hkb">${birdSVG(pair.base)}</b><span>بين هذه</span></div></div><p>${LAB[pair.mode]}</p><button class="cta" id="hkgo">جاهز</button></div>`;
    $('#hkgo').onclick=()=>{if(phase===0){phase=-1;trial0()}};keyH=e=>{if(e.key==='Enter'||e.code==='Space'){e.preventDefault();$('#hkgo')&&$('#hkgo').click()}}}
  function trial0(){keyH=null;trial++;$('#tl').textContent=trial+'/'+N;phase=-1;f.innerHTML='<div class="fix">+</div>';$('#m').textContent='ثبّت نظرك على المنتصف';
    later(()=>{odd=rnd(P.length);f.innerHTML=P.map(([x,y],i)=>`<div class="hb" style="left:${x}%;top:${y}%">${birdSVG(i===odd?pair.ob:pair.base)}</div>`).join('');
      const t0=performance.now();let raf;const tick=()=>{if(performance.now()-t0>=dur){mask();return}raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick);cleanup.push(()=>cancelAnimationFrame(raf))},650)}
  function mask(){let s='';for(let i=0;i<90;i++)s+=`<i style="left:${rnd(96)}%;top:${rnd(98)}%;transform:rotate(${rnd(180)}deg)"></i>`;f.innerHTML=`<div class="mask">${s}</div>`;
    later(()=>{$('#m').textContent='أين كان الطائر المختلف؟';f.innerHTML=P.map(([x,y],i)=>`<button class="ddslot" style="left:${x}%;top:${y}%" data-i="${i}" aria-label="موضع ${i+1}"></button>`).join('');f.querySelectorAll('.ddslot').forEach(b=>b.onclick=()=>pickP(+b.dataset.i,b));phase=1},250)}
  function pickP(i,b){if(phase!==1)return;phase=2;const good=i===odd,t=f.querySelector(`[data-i="${odd}"]`);t.classList.add('right');
    if(good){ok++;durs.push(dur);const g=Math.round(clamp(9000/dur,5,120));pts+=g;$('#sc').textContent=pts;sfx.ok(2);floatAt(st,...relPos(b,st),'+'+g);dur=Math.max(80,dur*.9)}else{b.classList.add('wrong');sfx.bad();dur=Math.min(2000,dur*1.25)}
    showMs();later(next,good?500:1100)}
  function end(){stopAll();const l=durs.slice(-6),thr=l.length?l.reduce((a,b)=>a+b)/l.length:dur;S.st.lv.hawkMs=Math.round(clamp(thr*1.25,250,1500));
    let nl=lv;if(thr<250&&ok>=10)nl=Math.min(4,lv+1);else if(thr>900&&lv>1)nl=lv-1;S.st.lv.hawkLv=nl;
    done({pts,metric:thr,detail:`دقة بصرك السريعة: ${Math.round(thr)} ملّي ثانية. أصبت ${ok} من ${N}.${nl>lv?' المرة الجاية: فروق أدق وطيور أكثر.':nl<lv?' رجعنا خطوة لتثبيت المستوى.':''}`})}
  next();
}}

/* ---------- 3. Daily Arabic mini crossword ---------- */
function runXW(){return done=>{
  const plays=S.st.hist.filter(h=>h.g==='xw'&&h.d===dayKey()).length;let h=7;for(const ch of dayKey()+'#'+plays)h=(h*31+ch.charCodeAt(0))|0;
  const XL=clamp(S.st.lv.xw||1,1,5),CF=[{n:5,sz:7,t:[1],give:2},{n:6,sz:8,t:[1,2],give:1},{n:7,sz:9,t:[1,2,3],give:0},{n:8,sz:9,t:[2,3],give:0},{n:9,sz:10,t:[3,2],give:0}][XL-1];
  const X=xwGenerate(seeded(h),CF.n,CF.sz,CF.t),R=X.rows,C=X.cols,st=$('#stage');X.words.sort((p,q)=>p.n-q.n||(p.dir==='a'?-1:1));const user=X.grid.map(r=>r.map(c=>c?'':null));
  let cur=X.words[0],ci=0,hints=0,checks=0,t0=performance.now(),solved=false;const giv=new Set();
  X.words.forEach((w,k)=>{if(CF.give===2||(CF.give===1&&k%2===0)){user[w.r][w.c]=X.grid[w.r][w.c];giv.add(w.r+','+w.c)}});
  const total=X.grid.flat().filter(Boolean).length,open=total-giv.size;const num={};X.words.forEach(w=>num[w.r+','+w.c]=w.n);
  st.innerHTML=hudHTML(false)+`<div class="xclue" id="xc"></div><div class="xgrid"><div class="xg" id="xg" style="grid-template-columns:repeat(${C},1fr);--cr:${C/R}"></div></div><div class="xkb" id="xk"></div><div class="duo"><button class="cta ghost" id="xh">كشف حرف</button><button class="cta ghost" id="xchk">تحقق</button></div>`;
  $('#tl').textContent='المستوى '+XL;
  const cellsOf=w=>[...w.w].map((_,i)=>[w.r+(w.dir==='d'?i:0),w.c+(w.dir==='a'?i:0)]);
  function draw(){const g=$('#xg');g.innerHTML='';const on=new Set(cellsOf(cur).map(p=>p.join(',')));const[cr,cc]=cellsOf(cur)[ci];
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){const b=document.createElement('button');if(X.grid[r][c]==null){b.className='xb';b.disabled=true}else{b.className='xcell'+(on.has(r+','+c)?' inw':'')+(r===cr&&c===cc?' cur':'')+(giv.has(r+','+c)?' giv':'');b.innerHTML=(num[r+','+c]?`<i>${num[r+','+c]}</i>`:'')+`<b>${user[r][c]||''}</b>`;b.onclick=()=>tapCell(r,c)}g.appendChild(b)}
    $('#xc').innerHTML=`<button class="xnav" id="xp" aria-label="السابق">›</button><span><b>${cur.n} ${cur.dir==='a'?'أفقي':'عمودي'}:</b> ${cur.clue} <span class="muted">(${cur.w.length} حروف)</span></span><button class="xnav" id="xn" aria-label="التالي">‹</button>`;
    $('#xp').onclick=()=>step(-1);$('#xn').onclick=()=>step(1)}
  function step(d){const i=X.words.indexOf(cur);cur=X.words[(i+d+X.words.length)%X.words.length];ci=Math.max(0,cellsOf(cur).findIndex(([r,c])=>!user[r][c]));draw()}
  ci=Math.max(0,cellsOf(cur).findIndex(([r,c])=>!user[r][c]));
  function tapCell(r,c){const ws=X.words.filter(w=>cellsOf(w).some(([a,b])=>a===r&&b===c));const[cr,cc]=cellsOf(cur)[ci];let w;
    if(ws.includes(cur))w=(cr===r&&cc===c&&ws.length>1)?ws.find(x=>x!==cur):cur;else w=ws[0];cur=w;ci=cellsOf(cur).findIndex(([a,b])=>a===r&&b===c);draw()}
  function type(ch){if(solved)return;const cs=cellsOf(cur);while(ci<cs.length-1&&giv.has(cs[ci].join(',')))ci++;const[r,c]=cs[ci];if(giv.has(r+','+c))return;user[r][c]=ch;tone(560,.03);if(ci<cs.length-1)ci++;check(false);draw()}
  function del(){const cs=cellsOf(cur);let[r,c]=cs[ci];if((!user[r][c]||giv.has(r+','+c))&&ci>0){ci--;[r,c]=cs[ci]}if(!giv.has(r+','+c))user[r][c]='';draw()}
  function check(manual){let filled=0,right=0;for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(X.grid[r][c]){if(user[r][c])filled++;if(user[r][c]===X.grid[r][c])right++}
    if(right===total){solved=true;fin(true);return}if(manual){checks++;[...$('#xg').children].forEach((b,i)=>{const r=Math.floor(i/C),c=i%C;if(X.grid[r][c]&&user[r][c]&&user[r][c]!==X.grid[r][c])b.classList.add('bad')});sfx.bad()}
    $('#sc').textContent=right*10}
  const kb=$('#xk');[...XW_KEYS,'⌫'].forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>k==='⌫'?del():type(k);kb.appendChild(b)});
  $('#xh').onclick=()=>{if(solved)return;const wrongAt=w=>cellsOf(w).findIndex(([r,c])=>user[r][c]!==X.grid[r][c]);if(wrongAt(cur)<0){const nw=X.words.find(w=>wrongAt(w)>=0);if(!nw)return;cur=nw}const cs=cellsOf(cur);let j=wrongAt(cur);const[r,c]=cs[j];user[r][c]=X.grid[r][c];hints++;ci=Math.min(j+1,cs.length-1);check(false);draw()};
  $('#xchk').onclick=()=>check(true);
  keyH=e=>{if(XW_KEYS.includes(e.key))type(e.key);else if(e.key==='Backspace')del()};
  draw();
  function fin(){stopAll();const secs=(performance.now()-t0)/1000,m=clamp(1-hints/open*1.4-checks*.03,0,1)*(secs>480?.85:1);sfx.win();
    let nl=XL;if(m>=.85&&secs<120+XL*60)nl=Math.min(5,XL+1);else if(m<.5&&XL>1)nl=XL-1;S.st.lv.xw=nl;
    later(()=>done({pts:Math.round(m*open*15*(1+.2*(XL-1))),metric:m,detail:`${nl>XL?`صعدت إلى المستوى ${nl}! `:nl<XL?`رجعنا إلى المستوى ${nl}. `:`المستوى ${XL}. `}حللت الكلمات المتقاطعة في ${fmtDur(secs)}${hints?`، مع ${arN(hints,['حرف مكشوف واحد','حرفين مكشوفين','أحرف مكشوفة','حرفًا مكشوفًا'])}`:' بدون أي مساعدة'}.`}),700)}
}}

/* ---------- 4. Breath counting (focused-attention meditation) ---------- */
function runBreath(){return done=>{
  const T=150,st=$('#stage');let n=0,good=0,bad=0,lost=0,presses=0,fast=0,last=0,ended=false;
  st.innerHTML=hudHTML(true)+`<div class="msg" id="m">تنفّس بشكل طبيعي. مع كل زفير اضغط «نفَس»، وفي النفَس التاسع اضغط «التاسع»، ثم ابدأ من جديد</div><div class="calm" id="cm"><div class="glow"></div><span id="cmt">ركّز على إحساس النفَس</span></div><div class="duo"><button class="match" id="b1">نفَس</button><button class="match nine" id="b9">التاسع</button></div><button class="cta ghost" id="bl">فقدت العدّ، أبدأ من جديد</button>`;
  const pulse=()=>{const c=$('#cm');c.classList.remove('p');void c.offsetWidth;c.classList.add('p')};
  const say=(t,ms=2500)=>{$('#cmt').textContent=t;later(()=>{const x=$('#cmt');if(x)x.textContent='ركّز على إحساس النفَس'},ms)};
  const tooFast=()=>{const t=performance.now(),q=last&&t-last<1300;last=t;if(q){fast++;bad++;n=0;sfx.bad();say('أبطأ قليلًا: اضغط مع زفير حقيقي، ثم ابدأ العدّ من جديد',3000)}return q};
  $('#b1').onclick=()=>{presses++;pulse();if(tooFast())return;toneF(392,.12,'sine',.025);n++;if(n>8){bad++;n=0;say('فاتك التاسع، ابدأ من جديد')}};
  $('#b9').onclick=()=>{presses++;pulse();if(tooFast())return;toneF(523,.18,'sine',.03);if(n===8){good++;say('دورة كاملة ✓',1600)}else{bad++;say('ليس التاسع بعد، ابدأ من جديد')}n=0};
  $('#bl').onclick=()=>{lost++;n=0;say('لا بأس، عُد إلى النفَس الأول')};
  keyH=e=>{if(e.code==='Space'){e.preventDefault();$('#b1').click()}if(e.key==='9'||e.key==='Enter')$('#b9').click()};
  timeBar(T,()=>{if(ended)return;ended=true;stopAll();const cyc=good+bad,acc=cyc?good/cyc:0,m=acc*Math.min(1,cyc/3);
    done({pts:good*40,metric:m,detail:`${good?`أكملت ${arN(good,AW.cyc)} صحيحة من ${cyc}`:'لم تكتمل دورة صحيحة بعد'}${lost?`، وانتبهت لشرودك ${arN(lost,AW.times)}`:''}${fast?`. ضغطت أسرع من نفَس طبيعي ${arN(fast,AW.times)}؛ النفَس الكامل يأخذ ثانيتين على الأقل`:''}. ${presses<18?'كان عدد أنفاسك قليلًا؛ تأكد أنك تضغط مع كل زفير.':'ملاحظة شرود الذهن ثم العودة هي جوهر التمرين.'}`})});
}}

/* ---------- task switching with variability across sessions (Karbach & Kray) ---------- */
const SWF=[
 {rules:[{q:'زوجي أم فردي؟',o:['زوجي','فردي'],f:x=>x.n%2===0?0:1,col:'#3FD0E8'},{q:'أكبر أم أصغر من 5؟',o:['أكبر','أصغر'],f:x=>x.n>5?0:1,col:'#FF5FA8'}],stim:()=>({n:pick([1,2,3,4,6,7,8,9])}),draw:x=>`<div class="main num" style="font-size:clamp(64px,22vw,96px)">${x.n}</div>`},
 {rules:[{q:'دائرة أم مربع؟',o:['دائرة','مربع'],f:x=>x.s==='c'?0:1,col:'#8BE36A'},{q:'أحمر أم أزرق؟',o:['أحمر','أزرق'],f:x=>x.k===0?0:1,col:'#FFB547'}],stim:()=>({s:pick(['c','s']),k:rnd(2)}),draw:x=>`<svg viewBox="0 0 100 100" style="width:110px;height:110px">${SHP[x.s](50,50,34,x.k?'#4C8DFF':'#FF4D5E')}</svg>`},

      else{poly=keepA?[[x0,y0],[x1,y0],[x0,y1]]:[[x1,y0],[x1,y1],[x0,y1]];tri={anti,keepA,x0,y0,s};
        f={t,ref:([x,y])=>[x0+s-(y-y0),y0+s-(x-x0)],alt:([x,y])=>[x0+(y-y0),y0+(x-x0)],line:[[x1+.4,y0-.4],[x0-.4,y1+.4]],from:keepA?[x0+s*.72,y0+s*.72]:[x0+s*.28,y0+s*.28],to:keepA?[x0+s*.28,y0+s*.28]:[x0+s*.72,y0+s*.72]}}}
    f.prev=prev;f.poly=poly;folds.push(f)}
  const cand=[];for(let i=0;i<8;i++)for(let j=0;j<8;j++){const x=i+.5,y=j+.5;if(x<R.x0||x>R.x1||y<R.y0||y>R.y1)continue;
    if(tri){const u=x-tri.x0,v=y-tri.y0;if(!tri.anti){if(tri.keepA?u-v<1:v-u<1)continue}else{const d=u+v-tri.s;if(tri.keepA?d>-1:d<1)continue}}cand.push([x,y])}
  const holes=shuffle(cand).slice(0,Math.min(nh,cand.length));
  const unfold=(skip=-1,altK=-1)=>{let pts=new Map(holes.map(p=>[FK(p),p]));for(let k=nf-1;k>=0;k--){if(k===skip)continue;const fn=k===altK?folds[k].alt:folds[k].ref;[...pts.values()].forEach(p=>{const q=fn(p);pts.set(FK(q),q)})}return[...pts.values()]};

const fsig=ps=>ps.map(FK).sort().join('|');
function foldPanel(f,i){const P=pts=>pts.map(([x,y])=>`${FP+x*FU},${FP+y*FU}`).join(' '),[a,b]=f.line,[fx0,fy0]=f.from,[tx,ty]=f.to;
  const ax=FP+fx0*FU,ay=FP+fy0*FU,bx=FP+tx*FU,by=FP+ty*FU,mx=(ax+bx)/2,my=(ay+by)/2,dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1,cx=mx-dy/L*14,cy=my+dx/L*14,ex=bx-cx,ey=by-cy,EL=Math.hypot(ex,ey)||1,ux=ex/EL,uy=ey/EL;
  return`<svg viewBox="0 0 88 88" class="fpan"><rect x="${FP}" y="${FP}" width="80" height="80" fill="none" stroke="var(--line)" stroke-dasharray="2 3"/><polygon points="${P(f.prev)}" fill="${FPAP}" fill-opacity=".28" stroke="#9A8F78" stroke-dasharray="3 2" stroke-width=".8"/><polygon points="${P(f.poly)}" fill="${FPAP}" stroke="#9A8F78" stroke-width=".8"/>
    <line x1="${FP+a[0]*FU}" y1="${FP+a[1]*FU}" x2="${FP+b[0]*FU}" y2="${FP+b[1]*FU}" stroke="${FACC}" stroke-width="1.8" stroke-dasharray="4 3"/>
    <path d="M${ax} ${ay}Q${cx} ${cy} ${bx} ${by}" fill="none" stroke="${FACC}" stroke-width="2.8" stroke-linecap="round"/><path d="M${bx+ux*2} ${by+uy*2}L${bx-ux*8-uy*5} ${by-uy*8+ux*5}L${bx-ux*8+uy*5} ${by-uy*8-ux*5}z" fill="${FACC}"/></svg>`}
const holeSVG=(pts,poly)=>{const P=poly?poly.map(([x,y])=>`${FP+x*FU},${FP+y*FU}`).join(' '):null;
  return`<svg viewBox="0 0 88 88" class="${poly?'fpan':'fopt'}">${poly?`<rect x="${FP}" y="${FP}" width="80" height="80" fill="none" stroke="var(--line)" stroke-dasharray="2 3"/><polygon points="${P}" fill="${FPAP}" stroke="#9A8F78" stroke-width=".8"/>`:`<rect x="${FP}" y="${FP}" width="80" height="80" rx="2" fill="${FPAP}" stroke="#9A8F78" stroke-width=".8"/><path d="M${FP+40} ${FP}V${FP+80}M${FP} ${FP+40}H${FP+80}" stroke="#9A8F78" stroke-opacity=".25" stroke-width=".6"/>`}${pts.map(([x,y])=>`<circle cx="${FP+x*FU}" cy="${FP+y*FU}" r="3.3" fill="${FINK}"/>`).join('')}</svg>`};
function genPaper(lv){const nf=lv<=2?1:lv<=4?2:3,diag=lv===2||lv===4||lv>=6,nh=lv===2||lv===4||lv>=6?1+rnd(2):1;
  let F;do F=foldPlan(nf,diag,nh);while(!F.holes.length);
  const right=F.unfold(),rs=fsig(right),opts=[right],seen=new Set([rs]);
  const add=ps=>{const s=fsig(ps);if(ps.length&&!seen.has(s)){seen.add(s);opts.push(ps)}};
  add(F.unfold(0));add(F.unfold(-1,rnd(nf)));add(right.map(([x,y])=>[8-x,y]));add(right.map(([x,y])=>[x,8-y]));
  for(let t=0;opts.length<4&&t<60;t++){const ps=right.map(p=>p.slice()),i=rnd(ps.length),d=pick([[1,0],[-1,0],[0,1],[0,-1]]),q=[ps[i][0]+d[0],ps[i][1]+d[1]];if(q[0]>0&&q[0]<8&&q[1]>0&&q[1]<8&&!ps.some(p=>FK(p)===FK(q))){ps[i]=q;add(ps)}}
  const four=[right,...shuffle(opts.slice(1)).slice(0,3)];shuffle(four);
  const steps=F.folds.map((f,i)=>`<div class="fstep">${foldPanel(f,i)}<span>الطيّة ${i+1}</span></div>`).join('')+`<div class="fstep">${holeSVG(F.holes,F.poly)}<span>الثقب</span></div>`;
  return{prompt:`<div class="sub">تُطوى الورقة ثم تُثقب. كيف ستبدو بعد فتحها؟</div><div class="fsteps" style="--n:${nf+1}">${steps}</div>`,opts:four.map(ps=>({html:holeSVG(ps),cls:'svgopt'})),ans:four.indexOf(right),cols:2}}
/* cube nets: which face ends up opposite the ringed one? */
const CNEG=v=>v.map(a=>-a);
function cubeNormals(cells){const at=new Map(cells.map((c,i)=>[FK(c),i])),N=[],Rv=[],U=[];N[0]=[0,0,-1];Rv[0]=[1,0,0];U[0]=[0,1,0];const q=[0];
  while(q.length){const i=q.shift(),[x,y]=cells[i];for(const[dx,dy]of[[1,0],[-1,0],[0,-1],[0,1]]){const j=at.get(FK([x+dx,y+dy]));if(j==null||N[j])continue;
    if(dx===1){N[j]=Rv[i];Rv[j]=CNEG(N[i]);U[j]=U[i]}else if(dx===-1){N[j]=CNEG(Rv[i]);Rv[j]=N[i];U[j]=U[i]}else if(dy===-1){N[j]=U[i];U[j]=CNEG(N[i]);Rv[j]=Rv[i]}else{N[j]=CNEG(U[i]);U[j]=N[i];Rv[j]=Rv[i]}q.push(j)}}
  return N.length===6&&N.every(Boolean)&&new Set(N.map(v=>v.join())).size===6?N:null}
function cubeNet(){for(let t=0;t<400;t++){const c=norm2(polyo(6));const N=cubeNormals(c);if(N)return{c,N}}const c=[[1,0],[0,1],[1,1],[2,1],[3,1],[1,2]];return{c,N:cubeNormals(c)}}
const CFC=['#FF5F7A','#3FD0E8','#8BE36A','#FFD45A','#B49CFF','#FF9A3D'],CFS=['c','s','t','d','h','x'];
function genCube(){const{c,N}=cubeNet(),order=shuffle([0,1,2,3,4,5]),tg=rnd(6),op=N.findIndex(v=>v.join()===CNEG(N[tg]).join()),S0=26,W=Math.max(...c.map(p=>p[0]))+1,H=Math.max(...c.map(p=>p[1]))+1;
  const face=i=>SHP[CFS[order[i]]](0,0,8,CFC[order[i]]);
  const net=`<svg viewBox="-3 -3 ${W*S0+6} ${H*S0+6}" class="cnet" style="width:${Math.min(250,W*46)}px">${c.map(([x,y],i)=>`<g transform="translate(${x*S0} ${y*S0})"><rect width="${S0}" height="${S0}" fill="${FPAP}" stroke="#9A8F78" stroke-width=".8"/>${i===tg?`<rect x="2" y="2" width="${S0-4}" height="${S0-4}" rx="4" fill="none" stroke="${FACC}" stroke-width="2.8"/>`:''}<g transform="translate(${S0/2} ${S0/2})">${face(i)}</g></g>`).join('')}</svg>`;
  const others=shuffle([0,1,2,3,4,5].filter(i=>i!==tg&&i!==op)).slice(0,3),four=shuffle([op,...others]);
  return{prompt:`<div class="sub">اطوِ الشبكة إلى مكعب: أي شكل يكون مقابل الشكل المحاط؟</div>${net}`,opts:four.map(i=>({html:`<svg viewBox="-12 -12 24 24" class="fcub">${face(i)}</svg>`,cls:'svgopt'})),ans:four.indexOf(op),cols:2}}
function genFold(lv){return lv>=4&&Math.random()<.35?genCube():genPaper(lv)}

/* ================= v12: metacognition — confidence calibration (Carpenter et al. 2019) ================= */
Object.assign(I,{conf:'<svg viewBox="0 0 48 48" fill="#0A0E1C"><circle cx="10" cy="14" r="3"/><circle cx="17" cy="22" r="3"/><circle cx="9" cy="28" r="3"/><circle cx="31" cy="12" r="3"/><circle cx="38" cy="19" r="3"/><circle cx="32" cy="26" r="3"/><circle cx="40" cy="30" r="3"/><rect x="4" y="38" width="40" height="5" rx="2.5" opacity=".3"/><rect x="4" y="38" width="28" height="5" rx="2.5"/></svg>'});
function runConf(){return done=>{
  const N=24,st=$('#stage'),CONF=[50,60,70,80,90,100];let d=clamp(S.st.lv.confD||10,2,16),trial=0,run=0,cur=null,phase=0,pick1=-1,pts=0;const R=[];
  st.innerHTML=hudHTML(false)+`<div class="msg" id="m"></div><div class="cfield" id="cf"></div><div class="cside ltr" id="cs"><button class="match" id="cl">◀ اليسار</button><button class="match" id="cr">اليمين ▶</button></div><div class="cconf" id="cc" hidden><span>كم أنت متأكد؟</span><div class="ltr">${CONF.map((c,i)=>`<button data-i="${i}">${c}%</button>`).join('')}</div></div>`;
  $('#tl').textContent='0/'+N;
  const box=(inner)=>`<svg viewBox="0 0 100 100" class="cbox"><rect x="1" y="1" width="98" height="98" rx="10" fill="rgba(var(--tint),.06)" stroke="var(--line)"/>${inner}</svg>`;
  const dots=n=>{const ps=[];let t=0;while(ps.length<n&&t++<4000){const x=10+Math.random()*80,y=10+Math.random()*80;if(ps.every(([a,b])=>(a-x)**2+(b-y)**2>30))ps.push([x,y])}return ps.map(([x,y])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="var(--ink)"/>`).join('')};
  const bar=L=>{const y=20+Math.random()*60,x=50-L/2+(Math.random()-.5)*(90-L);return`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${L.toFixed(1)}" height="5" rx="2.5" fill="var(--ink)"/>`};
  function next(){if(trial>=N){end();return}trial++;$('#tl').textContent=trial+'/'+N;phase=0;$('#cc').hidden=true;$('#cs').hidden=false;
    const kind=trial%2?'dots':'line',big=rnd(2);cur={kind,big};$('#m').textContent=kind==='dots'?'أي مربع فيه نقاط أكثر؟':'أي خط أطول؟';
    let A,B;if(kind==='dots'){const base=24+rnd(10),diff=Math.max(1,Math.round(d*.7));A=base;B=base+diff}else{const base=34+rnd(16);A=base;B=base+Math.max(.6,d*.45)}
    const L=big?A:B,Rr=big?B:A;const mk=v=>kind==='dots'?dots(v):bar(v);
    $('#cf').innerHTML=`<div class="ltr cpair">${box(mk(L))}${box(mk(Rr))}</div>`;cur.ans=big?1:0;
    later(()=>{if(cur&&phase===0)$('#cf').innerHTML=`<div class="ltr cpair">${box('')}${box('')}</div>`},kind==='dots'?900:700)}
  function choose(i){if(phase!==0)return;phase=1;pick1=i;$('#cf').innerHTML=`<div class="ltr cpair">${box('')}${box('')}</div>`;tone(600,.04);$('#cs').hidden=true;$('#cc').hidden=false;$('#m').textContent='كم أنت متأكد من إجابتك؟'}
  function rate(ci){if(phase!==1)return;phase=2;const c=CONF[ci],ok=pick1===cur.ans,p=c/100,sc=Math.round(100*(1-((ok?1:0)-p)**2))-75;pts+=sc;$('#sc').textContent=pts;R.push({ok,c});
    if(ok){sfx.ok(1);if(++run>=2){run=0;d=Math.max(1,d*.85)}}else{sfx.bad();run=0;d=Math.min(16,d*1.2)}
    floatAt(st,...relPos($('#cc'),st),(sc>=0?'+':'')+sc,sc<0);$('#m').textContent=ok?`صحيح ✓ · ثقتك ${c}%`:`خطأ ✗ · كانت ثقتك ${c}%`;later(next,ok?700:1100)}
  $('#cl').onclick=()=>choose(0);$('#cr').onclick=()=>choose(1);$('#cc').querySelectorAll('button').forEach(b=>b.onclick=()=>rate(+b.dataset.i));
  keyH=e=>{if(e.key==='ArrowLeft')choose(0);else if(e.key==='ArrowRight')choose(1);else if(/^[1-6]$/.test(e.key))rate(+e.key-1)};
  function end(){stopAll();const n=R.length||1,acc=R.filter(r=>r.ok).length/n,mc=R.reduce((a,r)=>a+r.c,0)/n/100,brier=R.reduce((a,r)=>a+((r.ok?1:0)-r.c/100)**2,0)/n,m=clamp(1-brier/.25,0,1),gap=Math.round((mc-acc)*100);
    S.st.lv.confD=Math.round(clamp(d*1.15,2,16)*10)/10;
    done({pts:Math.max(0,pts),metric:m,detail:`دقتك ${Math.round(acc*100)}% ومتوسط ثقتك ${Math.round(mc*100)}%. ${Math.abs(gap)<=7?'ثقتك مضبوطة على أدائك: ممتاز!':gap>0?`ثقتك أعلى من أدائك بـ${gap} نقطة: تمهّل قبل «متأكد 100%».`:`أنت تقلل من نفسك بـ${-gap} نقطة: ثق بحكمك أكثر.`}`})}
  next();
}}

/* ================= results ================= */
function record(g,r){const prevGI=gameIndex(g.id),idx=Math.round(clamp(+g.norm(r.metric)||0,0,1000)),k=dayKey(),prevBest=S.st.best[g.id],pts=Math.max(0,Math.round(+r.pts||0)),rec=prevBest==null||pts>prevBest;if(rec)S.st.best[g.id]=pts;
  S.st.hist.push({id:Date.now().toString(36)+rnd(1e6).toString(36),g:g.id,d:k,ts:Date.now(),pts,idx});if(S.st.hist.length>400)S.st.hist.shift();
  S.st.days[k]=(S.st.days[k]||0)+1;if(RUN&&RUN.wk&&RUN.wk.every(doneToday)){S.st.wdone=S.st.wdone||{};S.st.wdone[k]=1}S.save();
  const gi=gameIndex(g.id);return{idx,gi,delta:prevGI==null?null:gi-prevGI,rec,prevBest,pts}}
function finish(r){
  stopAll();const g=curGame(),R=record(g,r),idx=R.idx,gi=R.gi,delta=R.delta,rec=R.rec,prevBest=R.prevBest,sn=starsOf(idx);r.pts=R.pts;
  const last=RUN.pos>=RUN.queue.length-1,wkDone=RUN.wk&&RUN.wk.every(doneToday);

  $('#stage').innerHTML=`<div class="res">
   <div class="bigstars">${[0,1,2].map(i=>STAR(i<sn).replace('<svg ',`<svg style="animation-delay:${.15+i*.15}s" `)).join('')}</div>

   ${rec&&prevBest!=null?'<span class="rec">رقم قياسي جديد!</span>':''}
   <div class="rline">أداء الجولة <b class="num">${idx}</b> · مؤشرك في اللعبة <b class="num">${gi}</b> ${delta!=null&&delta!==0?`<span class="delta ${delta>0?'up':'dn'} ltr">${delta>0?'+':''}${delta}</span>`:''}</div>
   ${sparkHTML(g.id)}<p class="rdetail">${r.detail}</p>
   <div class="rbtns">${!last?`<button class="go-btn" id="nx">اللعبة التالية</button>`:wkDone&&RUN.wk?`<button class="go-btn" id="fin">${encPending()?'التذكر المؤجل: ماذا حفظت؟':'إنهاء تمرين اليوم'}</button>`:''}
    <button class="cta ghost" id="ag">العب مرة أخرى</button>${last&&!(wkDone&&RUN.wk)?'<button class="cta ghost" id="hm">الرئيسية</button>':''}</div></div>`;
  let c=0;const tgt=r.pts,step=Math.max(1,Math.ceil(tgt/40));const ct=setInterval(()=>{c=Math.min(tgt,c+step);const e=$('#cnt');if(e)e.textContent=c;if(c>=tgt||!e)clearInterval(ct)},25);
  const nx=$('#nx');if(nx)nx.onclick=()=>{const go=()=>{RUN.pos++;showIntro()};if(RUN.wk&&RUN.pos===1&&S.st.move!==false)showMove(go);else go()};
  const fin=$('#fin');if(fin)fin.onclick=()=>encPending()?showRecall():celebrate();
  $('#ag').onclick=countdown;const hm=$('#hm');if(hm)hm.onclick=closePlay;
}
function celebrate(){stopAll();sfx.win();const w=weekInfo(),wd=Math.min(w.done,3);
  $('#stage').innerHTML=`<div class="res" style="margin:auto 0"><div class="intro"><div class="hero" style="background:var(--good);--c:var(--good)">${FLAME.replace('var(--spd)','#06240F')}</div></div>
   <h2 style="font-size:36px">أنهيت تمرين اليوم!</h2><div class="dots3 big">${[0,1,2].map(i=>`<i class="${i<wd?'on':''}"></i>`).join('')}</div><p class="rdetail">${wd>=3?'أكملت هدف الأسبوع: 3 تمارين. الأبحاث تقول إن هذا يكفي، فأعطِ دماغك راحة أو العب للمتعة.':`أنجزت <b class="num">${wd}</b> من 3 تمارين هذا الأسبوع. تمرين الغد مختلف ومن ألعاب لم تجربها كثيرًا.`}</p>
   <div class="rbtns"><button class="go-btn" id="hm" style="--c:var(--good)">الرئيسية</button></div></div><canvas class="confetti" id="cf"></canvas>`;
  $('#hm').onclick=closePlay;confetti();}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cv=$('#cf');if(!cv)return;const x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=Object.values(CATS).map(c=>c.hex),ps=[...Array(140)].map(()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.3,s:4+Math.random()*6,c:pick(cols)}));let raf,f=0;
  const tick=()=>{x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<240)raf=requestAnimationFrame(tick);else x.clearRect(0,0,cv.width,cv.height)};tick();cleanup.push(()=>cancelAnimationFrame(raf))}

renderAll();
S.connect();
