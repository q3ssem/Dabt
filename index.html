<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B1024">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ضبط دماغك">
<meta name="description" content="ضبط دماغك: ألعاب تدريب الدماغ المبنية على أبحاث علمية">
<title>ضبط دماغك</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">
</head>
<body>
<style>
/* Layout: phone-first app shell, 480px column; tabs at bottom; game runs full-screen over the shell.
   Single deliberate night theme: deep ink ground, one signature colour per brain skill. */
:root{
  color-scheme:dark;
  --bg:#0A1024; --bg2:rgba(4,8,22,.45); --surface:rgba(var(--tint),.06); --surface2:rgba(var(--tint),.1); --line:rgba(var(--tint),.12);
  --ink:#EEF1FF; --muted:#8E97C4; --dim:#5D6694;
  --mem:#3FD0E8; --foc:#FFB547; --spd:#FF6B5A; --flx:#FF5FA8; --log:#8BE36A; --spa:#A595FF;
  --good:#4BE08A; --bad:#FF5C6C; --gold:#FFD25A;
  --font-d:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  --font-b:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  --tabh:64px;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(45% 32% at 92% 0%,rgba(63,208,232,.28),transparent 70%),radial-gradient(40% 30% at 0% 18%,rgba(255,95,168,.22),transparent 70%),radial-gradient(55% 35% at 60% 60%,rgba(139,227,106,.10),transparent 70%),radial-gradient(50% 30% at 10% 100%,rgba(255,181,71,.16),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.55;direction:rtl}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);font-weight:800;margin:0;line-height:1.2;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.shell{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--muted)}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello{display:flex;flex-direction:column}
.hello h1{font-size:30px}

/* workout */
.workout{background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.wk-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wk-head h2{font-size:26px}
.ico svg{width:58%;height:58%}
.cta{background:linear-gradient(110deg,#3FD0E8,#8BE36A 55%,#FFD45A);color:#06122A;border-radius:16px;padding:14px 20px;font-weight:800;font-size:17px;width:100%;transition:transform .12s}
.cta:active{transform:scale(.98)}
.cta.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.cta.done{background:var(--good);color:#06240F}

/* skills */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.idx-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.idx-big{font-family:var(--font-d);font-size:46px;line-height:1}
.idx-big small{font-family:var(--font-b);font-size:14px;color:var(--muted);font-weight:500;margin-inline-start:6px}

/* games list */
.stars{display:inline-flex;gap:2px}
.stars svg{width:14px;height:14px}

/* profile */
.radar svg{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--bg2);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--font-d);font-size:26px;font-weight:800}
.stat span{font-size:12.5px;color:var(--muted)}
.set{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-weight:700}
.set:first-of-type{border-top:0}
.toggle{width:50px;height:30px;border-radius:30px;background:var(--line);position:relative;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:var(--ink);transition:transform .2s}
.toggle.on{background:var(--good)}
.toggle.on::after{transform:translateX(-20px)}
.danger{color:var(--bad);font-weight:700}

/* tab bar */
.tabs{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--tabbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--dim)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--ink)}

/* game screen */
.play{position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,var(--bg)) 0%,color-mix(in srgb,var(--c2) 14%,var(--bg)) 40%,var(--bg) 85%);display:flex;flex-direction:column;overflow-y:auto}
.play::before{content:"";position:fixed;inset:0;background:radial-gradient(90% 50% at 50% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);pointer-events:none}
.pin{position:relative;max-width:480px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.pbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.x{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.pbar .t{flex:1;min-width:0}
.pbar .t b{display:block;font-family:var(--font-d);font-weight:800;font-size:20px;line-height:1.1}
.pbar .t span{font-size:12.5px;color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));font-weight:700}
.wkdots{display:flex;gap:4px}
.wkdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.wkdots i.on{background:var(--c)}
.wkdots i.done{background:var(--good)}
.stage{flex:1;display:flex;flex-direction:column;gap:14px;position:relative}

.intro{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;padding-top:8px}
.intro .hero{width:132px;height:132px;border-radius:36px;display:grid;place-items:center;box-shadow:0 18px 50px -12px var(--c)}
.intro .hero svg{width:60%;height:60%}
.intro h2{font-size:34px}
.intro .skill{color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));font-weight:800}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;text-align:start;width:100%}
.how li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px}
.how li b{flex:none;width:26px;height:26px;border-radius:8px;background:var(--c);color:var(--bg);display:grid;place-items:center;font-size:14px}
.intro .bestline{color:var(--muted);font-size:14px}
.go-btn{background:linear-gradient(120deg,var(--c),var(--c2,var(--c)));color:#0A0E1C;border-radius:18px;padding:16px;font-weight:800;font-size:19px;width:100%;margin-top:auto;box-shadow:0 10px 30px -10px var(--c)}

.hud{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hud .sc{font-family:var(--font-d);font-size:34px;line-height:1}
.hud .lbl{font-size:12px;color:var(--muted);font-weight:700}
.mult{direction:ltr;font-family:var(--font-d);font-size:22px;color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));min-width:48px;text-align:center;transition:transform .2s}
.mult.pop{transform:scale(1.35)}
.tbar{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--c);border-radius:8px;transform-origin:right}
.tleft{font-size:13px;color:var(--muted);font-weight:700}

.qp{background:var(--surface);border:1px solid var(--line);border-radius:22px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px 12px;text-align:center}
.qp .rule{font-size:15px;font-weight:800;padding:4px 12px;border-radius:999px}
.qp .main{font-family:var(--font-d);font-size:clamp(40px,13vw,64px);line-height:1.1}
.qp .sub{color:var(--muted);font-size:14px;font-weight:700}
.qo{display:grid;gap:10px}
.qo.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.qo.c4{grid-template-columns:repeat(4,minmax(0,1fr))}


.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}





.wc{width:120px;aspect-ratio:1;background:var(--bg2);border-radius:16px;display:grid;place-items:center;border:2px solid var(--line)}
.wc svg{width:86%;height:86%}
.qo.c4 .opt.svgopt svg{width:100%;height:auto;max-width:72px}






.opt{background:var(--surface2);border:2px solid var(--line);border-radius:18px;padding:16px 10px;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;transition:transform .08s,background .15s,border-color .15s}
.opt:active{transform:scale(.97)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 22%,var(--surface2))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--surface2))}
.sw{width:22px;height:22px;border-radius:50%;flex:none}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.float{position:absolute;font-family:var(--font-d);font-size:28px;color:var(--good);pointer-events:none;animation:float .8s ease-out forwards;z-index:5}
.float.neg{color:var(--bad)}
@keyframes float{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-56px)}}

.board{display:grid;gap:8px;aspect-ratio:1;width:100%;max-width:100%}
.cell{background:var(--surface2);border-radius:14px;display:grid;place-items:center;font-family:var(--font-d);color:var(--ink);transition:background .12s,transform .12s,opacity .2s;position:relative}
.cell.lit{background:var(--c);box-shadow:0 0 30px -4px var(--c);transform:scale(1.04)}
.cell.gone{opacity:.18;pointer-events:none}
.cell.okc{background:var(--good)}
.cell.noc{background:var(--bad)}
.field{position:relative;width:100%;aspect-ratio:1;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;max-width:100%}
.field .cell{position:absolute;width:18%;height:18%}
.msg{text-align:center;color:var(--muted);font-weight:700;min-height:1.5em}
.match{background:var(--c);color:#0A0E1C;border-radius:18px;padding:18px;font-weight:800;font-size:20px;width:100%}
.match.hit{background:var(--good)}
.match.miss{background:var(--bad)}

.cd{position:absolute;inset:0;display:grid;place-items:center;z-index:10;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.cd b{font-family:var(--font-d);font-weight:800;font-size:120px;color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));animation:cd .8s ease-out}
@keyframes cd{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}

.res{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:6px}
.res .bigstars{display:flex;gap:10px}
.res .bigstars svg{width:46px;height:46px;animation:pop .45s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.res .pts{font-family:var(--font-d);font-size:72px;line-height:1}
.res .pl{color:var(--muted);font-weight:700;margin-top:-6px}
.rec{background:var(--gold);color:#2A1C00;border-radius:999px;padding:4px 14px;font-weight:800;font-size:14px}
.delta{font-size:13px;font-weight:800}
.delta.up{color:var(--good)} .delta.dn{color:var(--bad)}
.rdetail{color:var(--muted);font-size:14.5px;max-width:40ch}
.rbtns{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:6px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.pad button{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 0;font-family:var(--font-d);font-size:26px;transition:transform .08s}
.pad button:active{transform:scale(.95)}
.pad .act{background:var(--c);color:#0A0E1C;border-color:color-mix(in srgb,var(--c) var(--catmix),var(--ink))}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;direction:ltr;min-height:44px}
.slots i{width:32px;height:42px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--font-d);font-style:normal;font-size:22px}
.mx{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:min(100%,200px);direction:ltr}
.mx>div{aspect-ratio:1;background:var(--bg2);border-radius:10px;display:grid;place-items:center}
.mx svg{width:84%;height:84%}
.mx .q{border:2px dashed var(--c);font-family:var(--font-d);font-size:30px;color:color-mix(in srgb,var(--c) var(--catmix),var(--ink))}
.opt.svgopt{padding:6px;min-height:0}
.opt.svgopt svg{width:64px;height:64px}
.cell svg{width:70%;height:70%}
.spark{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:start}
.spark svg{width:100%;height:64px;display:block;margin-top:4px}
.why{background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:14px;padding:12px 14px;font-size:14.5px;text-align:start;width:100%}
.why b{color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));display:block;font-size:13px;margin-bottom:2px}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:800;color:#06240F;background:var(--good);border-radius:999px;padding:2px 9px;width:fit-content}
.badge.ev{position:absolute;top:18px;right:18px}
.rline{color:var(--muted);font-weight:700;font-size:14.5px}
.rline b{color:var(--ink);font-family:var(--font-d);font-weight:800;font-size:20px}
.ddf{position:relative;width:100%;max-width:100%;aspect-ratio:1;background:radial-gradient(circle,rgba(var(--tint),.08),rgba(var(--tint),.03) 70%);border:1px solid var(--line);border-radius:50%;overflow:hidden}
.fix{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;color:var(--muted);font-family:var(--font-d)}
.ddc{position:absolute;left:50%;top:50%;width:24%;transform:translate(-50%,-50%)}
.dds,.ddslot{position:absolute;width:14%;aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center}
.dds svg,.ddslot svg{width:100%;height:100%}
.ddslot{border-radius:50%;border:2px dashed rgba(var(--tint),.3);background:rgba(var(--tint),.05)}
.ddslot.right{border-color:var(--good);border-style:solid;background:transparent}
.ddslot.wrong{background:var(--bad);border-color:var(--bad)}
.mask{position:absolute;inset:0}
.mask i{position:absolute;width:13%;height:3px;background:var(--muted);border-radius:2px;opacity:.75}
.duo .match:disabled{cursor:default}

.pc{background:var(--surface2);border-radius:8px;display:grid;place-items:center;color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));transition:background .1s}
.pc svg{width:86%;height:86%}

.ps{border-radius:8px;border:1.5px dashed var(--line);display:grid;place-items:center}

.ps svg{width:70%;height:70%}
.ps.right{background:var(--good);border:0}
.ps.wrong{background:var(--bad);border:0}
.tol{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;direction:ltr}
.tpeg{position:relative;display:flex;flex-direction:column-reverse;align-items:center;gap:6px;padding:10px 0;height:calc(var(--cap)*54px + 22px);background:var(--surface);border:1px solid var(--line);border-radius:16px;cursor:pointer}
.tpeg::before{content:"";position:absolute;bottom:8px;top:8px;width:6px;border-radius:3px;background:var(--line);left:50%;transform:translateX(-50%)}
.tpeg i{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.3);transition:transform .15s}
.tpeg.sel{border-color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));box-shadow:0 0 0 2px var(--c)}
.tpeg.sel i:last-child{transform:translateY(-10px)}
.tolgoal{display:flex;flex-direction:column;align-items:center;gap:4px}
.tol.mini{width:min(60%,220px);gap:6px}
.tol.mini .tpeg{height:calc(var(--cap)*26px + 12px);padding:5px 0;gap:3px;cursor:default;border-radius:10px}
.tol.mini i{width:22px;height:22px}
/* ===== v6 refresh: aurora night, glass surfaces, rails ===== */
body{background-color:var(--bg);background-image:radial-gradient(50% 35% at 100% 0%,rgba(63,208,232,.30),transparent 70%),radial-gradient(45% 32% at 0% 10%,rgba(165,149,255,.30),transparent 70%),radial-gradient(50% 30% at 100% 55%,rgba(255,95,168,.14),transparent 70%),radial-gradient(60% 35% at 0% 100%,rgba(139,227,106,.14),transparent 70%)}
.card,.hero-card,.rcard,.wk-row,.ref,.stat{background:linear-gradient(160deg,rgba(var(--tint),.09),rgba(var(--tint),.035));border:1px solid rgba(var(--tint),.11);box-shadow:inset 0 1px 0 rgba(var(--tint),.07)}
.view>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards}
.view>*:nth-child(2){animation-delay:.05s}.view>*:nth-child(3){animation-delay:.1s}.view>*:nth-child(4){animation-delay:.15s}
@keyframes rise{from{transform:translateY(10px)}}
.hello h1{font-size:32px}
.wkgoal{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted);background:rgba(var(--tint),.06);border:1px solid rgba(var(--tint),.1);border-radius:16px;padding:8px 12px}
.wkgoal b{color:var(--ink);font-size:13px}
.dots3{display:flex;gap:5px}
.dots3 i{width:12px;height:12px;border-radius:50%;background:rgba(var(--tint),.14)}
.dots3.big{gap:10px}.dots3.big i{width:20px;height:20px}
.dots3 i.on{background:linear-gradient(135deg,#8BE36A,#3FD0E8);box-shadow:0 0 10px rgba(139,227,106,.6)}
.hero-card{border-radius:26px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.bring-wrap{width:min(100%,230px)}
.bring{width:100%;height:auto;display:block}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;width:100%}
.legend span{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);min-width:0}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend b{margin-inline-start:auto;color:var(--ink);font-weight:700}
.workout{background:linear-gradient(165deg,var(--panel1),var(--panel2)) padding-box,linear-gradient(120deg,#3FD0E8,#8BE36A,#FFD45A,#FF5FA8,#A595FF) border-box;border:1.5px solid transparent;border-radius:26px;gap:14px}
.wk-head h2{font-size:25px}
.wk-count{font-family:var(--font-d);font-size:24px;color:var(--muted)}
.wk-list{display:flex;flex-direction:column;gap:8px}
.wk-row{display:flex;align-items:center;gap:12px;border-radius:16px;padding:8px 10px 8px 12px;text-align:start;width:100%;transition:transform .12s}
.wk-row .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.wk-row .ico svg{width:62%;height:62%}

/* pal */

/* loci */

.ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;direction:ltr}
.steer{background:rgba(var(--tint),.1);border:1px solid var(--line);border-radius:18px;font-size:24px;padding:14px 0;touch-action:none;user-select:none;-webkit-user-select:none}

/* transitive */

.prem .tok{width:34px;height:34px}
.opt.svgopt .tok{width:54px;height:54px}
/* ===== v7: habits, recall, faces, coach, brain check ===== */
.muted{color:var(--muted);font-size:14px;margin:0}
.habits{display:flex;flex-direction:column;gap:12px}

.hdots{display:flex;gap:4px}

.due>span:nth-child(2){display:flex;flex-direction:column;flex:1;min-width:0}
.due b{font-size:16px}
.due small{color:var(--muted);font-size:12.5px;font-weight:700}
.due .go{color:var(--muted);font-size:22px}
.encgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.encgrid span{font-size:46px;line-height:1;padding:16px 0;border-radius:18px;background:rgba(var(--tint),.07);border:1px solid rgba(var(--tint),.1);animation:pop .4s cubic-bezier(.2,1.6,.4,1) backwards}
.encgrid span:nth-child(2){animation-delay:.08s}.encgrid span:nth-child(3){animation-delay:.16s}.encgrid span:nth-child(4){animation-delay:.24s}.encgrid span:nth-child(5){animation-delay:.32s}.encgrid span:nth-child(6){animation-delay:.4s}
.encbar{width:100%;height:6px;border-radius:6px;background:rgba(var(--tint),.1);overflow:hidden}
.encbar i{display:block;height:100%;background:linear-gradient(90deg,#7AF0D2,#3FD0E8);transform-origin:right;animation:drain 16s linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.go-btn:disabled{opacity:.45}
.recgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.recgrid .opt{padding:10px 0;font-size:30px;min-height:58px}
.opt.pick{border-color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));background:color-mix(in srgb,var(--c) 22%,transparent)}
.opt.miss{border-style:dashed;border-color:var(--good)}
.fcard{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:250px;justify-content:center;border-radius:22px;background:linear-gradient(160deg,rgba(var(--tint),.08),rgba(var(--tint),.03));border:1px solid rgba(var(--tint),.1);padding:12px}
.fcard svg{width:150px;height:150px}
.fname{font-family:var(--font-d);font-size:30px;line-height:1.1}
.fjob{color:color-mix(in srgb,var(--c) var(--catmix),var(--ink));font-weight:800}
.ftip{color:var(--muted);font-size:13px;font-weight:700}
.lbl-in{font-size:13px;font-weight:700;color:var(--muted)}
.ta{width:100%;font:inherit;font-size:16px;color:var(--ink);background:rgba(var(--tint),.06);border:1px solid var(--line);border-radius:16px;padding:12px 14px;resize:vertical;line-height:1.7}
.ta:focus{outline:2px solid var(--c);outline-offset:1px}
.litem{font-family:var(--font-d);font-size:34px;line-height:1.2;text-align:center;max-width:100%;overflow-wrap:anywhere;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}




.rtf{position:relative;height:200px;border-radius:22px;background:rgba(var(--tint),.05);border:1px solid var(--line)}
.rtf i{position:absolute;top:50%;width:76px;height:76px;margin-top:-38px;border-radius:50%;background:rgba(var(--tint),.06);border:2px dashed rgba(var(--tint),.15)}
.rtf .dotL{left:14%}.rtf .dotR{right:14%}
.rtf i.on{background:#FFD25A;border:0;box-shadow:0 0 40px rgba(255,210,90,.7)}
.cmprow{display:flex;gap:10px;justify-content:center}
.cmprow svg{width:48px;height:48px;color:var(--ink)}
.abar{display:grid;grid-template-columns:110px 1fr 64px auto;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.abar .bt{height:8px;border-radius:8px;background:rgba(var(--tint),.1);overflow:hidden}
.abar .bt i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#3FD0E8,#8BE36A)}
.abar b{color:var(--ink);text-align:left}
.acard{display:flex;flex-direction:column;gap:10px}
.arow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.arow b{display:block;font-family:var(--font-d);font-weight:800;font-size:28px}
.aspark{width:100%;height:60px}
.coach{display:flex;flex-direction:column;gap:12px;background:linear-gradient(165deg,var(--panel3),var(--panel2)) padding-box,linear-gradient(130deg,#A595FF,#3FD0E8) border-box;border:1.5px solid transparent}
.chead{font-size:21px}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

@media (max-width:380px){.cgrid{grid-template-columns:1fr}}
.cplan{display:flex;flex-direction:column;gap:6px}
.cp{display:flex;align-items:center;gap:10px}
.cp .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.cp .ico svg{width:60%;height:60%}
.cp>span:last-child{display:flex;flex-direction:column;min-width:0}
.cp small{color:var(--muted);font-size:12.5px}
.chabit{margin:0;font-size:14px}
.cerr{margin:0;color:var(--bad);font-weight:700;font-size:14px}
.thinking{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;padding:8px 0}

.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}

.refs.clip .ref:nth-child(n+7){display:none}
/* ===== v8: Tajawal, light skin, new games ===== */
:root{--tint:255,255,255;--panel1:#18204a;--panel2:#121838;--panel3:#22224f;--tabbg:rgba(11,17,48,.88);--catmix:100%}
:root[data-skin="light"]{color-scheme:light;--bg:#EEF2FB;--bg2:rgba(20,30,80,.06);--surface:rgba(20,30,80,.05);--surface2:rgba(20,30,80,.08);--line:rgba(20,30,80,.14);--ink:#141B3D;--muted:#58618A;--dim:#8A92B5;--tint:20,30,80;--panel1:#FFFFFF;--panel2:#F3F6FD;--panel3:#F3F0FF;--tabbg:rgba(255,255,255,.92);--catmix:60%}
@media (prefers-color-scheme: light){:root[data-skin="auto"]:not([data-theme="dark"]){color-scheme:light;--bg:#EEF2FB;--bg2:rgba(20,30,80,.06);--surface:rgba(20,30,80,.05);--surface2:rgba(20,30,80,.08);--line:rgba(20,30,80,.14);--ink:#141B3D;--muted:#58618A;--dim:#8A92B5;--tint:20,30,80;--panel1:#FFFFFF;--panel2:#F3F6FD;--panel3:#F3F0FF;--tabbg:rgba(255,255,255,.92);--catmix:60%}}
:root[data-skin="auto"][data-theme="light"]{color-scheme:light;--bg:#EEF2FB;--bg2:rgba(20,30,80,.06);--surface:rgba(20,30,80,.05);--surface2:rgba(20,30,80,.08);--line:rgba(20,30,80,.14);--ink:#141B3D;--muted:#58618A;--dim:#8A92B5;--tint:20,30,80;--panel1:#FFFFFF;--panel2:#F3F6FD;--panel3:#F3F0FF;--tabbg:rgba(255,255,255,.92);--catmix:60%}
.eyebrow .dh,.eyebrow .dg{display:block}
.eyebrow .dg{opacity:.8}
.seg{display:flex;gap:4px;background:rgba(var(--tint),.07);border-radius:12px;padding:3px}
.seg button{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.share{display:flex;flex-direction:column;gap:10px}
.share img{width:100%;max-width:100%;border-radius:18px;display:block;box-shadow:0 14px 30px -18px rgba(0,0,0,.6)}
.pmtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.peek{font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.pmcard{min-height:150px;border:3px solid transparent;transition:border-color .1s}
.pmcard.cue{border-color:#FFD25A;box-shadow:0 0 0 5px rgba(255,210,90,.25),inset 0 0 34px rgba(255,210,90,.18)}
.pmcard.cue2{border-color:rgba(255,210,90,.7)}
.pmb{font-size:15.5px;padding:14px 6px}.navf{width:100%;max-width:100%;aspect-ratio:1;border-radius:22px;background:rgba(var(--tint),.05);border:1px solid var(--line);touch-action:none}
.navf{padding:6px}.navf svg{width:100%;height:100%;display:block}
#dsv line{stroke-width:2.8;stroke-linecap:round}
#dsv .fig{stroke:var(--c)}#dsv .good{stroke:#4BE08A}#dsv .extra{stroke:#FF5C6C}
#dsv .dd{fill:var(--muted)}#dsv .dd.on{fill:var(--c)}#dsv .dh{fill:transparent;cursor:pointer}


#nsv .fog{fill:rgba(var(--tint),.07)}#nsv .vis{fill:color-mix(in srgb,var(--c) 16%,transparent)}

.pad4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:". n ." "w p e" ". s .";gap:6px;direction:ltr}
.pad4 button{background:rgba(var(--tint),.1);border:1px solid var(--line);border-radius:14px;padding:10px 0;font-size:20px;touch-action:manipulation}

.xkb{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}

.arrowbox{display:flex;flex-direction:column;align-items:center;gap:6px;width:120px}

function acInit(){if(AC)return AC;const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.15;MASTER=AC.createGain();MASTER.gain.value=.9;MASTER.connect(comp);comp.connect(AC.destination);buildBank();return AC}

function voice(ctx,out,f,t,d,{type='sine',v=.2,att=.005,harm=[[1,1]],bend=0}={}){harm.forEach(([m,a])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f*m,t);if(bend)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*m*bend),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*a,t+att);g.gain.exponentialRampToValueAtTime(.0006,t+d);o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.03)})}

  bad:c=>{voice(c,c.destination,220,0,.26,{type:'triangle',v:.28,bend:.55});voice(c,c.destination,233,0,.26,{type:'triangle',v:.16,bend:.55})},
  tick:c=>voice(c,c.destination,1320,0,.06,{harm:[[1,1]],v:.18,att:.002}),lit:c=>voice(c,c.destination,523,0,.3,{harm:BELL,v:.26}),
  go:c=>{voice(c,c.destination,660,0,.16,{harm:MAR,v:.26});voice(c,c.destination,990,.09,.3,{harm:MAR,v:.3})},
  lvl:c=>[784,1047,1319].forEach((f,i)=>voice(c,c.destination,f,i*.07,.32,{harm:BELL,v:.22})),
  win:c=>[523,659,784,1047,1319].forEach((f,i)=>voice(c,c.destination,f,i*.09,.55,{harm:BELL,v:.22})),
  flip:c=>voice(c,c.destination,1400,0,.07,{type:'triangle',v:.16,att:.002,bend:.6}),pop:c=>voice(c,c.destination,600,0,.12,{harm:[[1,1],[2,.3]],v:.24,att:.003,bend:1.8}),nav:c=>voice(c,c.destination,1760,0,.045,{v:.1,att:.002})};
function buildBank(){const O=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!O||SB_READY)return;const sr=AC.sampleRate||44100;
  Promise.all(Object.entries(SB_DEF).map(([k,fn])=>{try{const c=new O(1,Math.ceil(sr*1.1),sr);fn(c);return c.startRendering().then(b=>{SB[k]=b})}catch(e){return Promise.resolve()}})).then(()=>{SB_READY=Object.keys(SB).length>0}).catch(()=>{})}
function playBuf(k,delay=0,rate=1){if(S.st.mute||!audioOK())return false;const b=SB[k];if(!b)return false;try{const s=AC.createBufferSource();s.buffer=b;s.playbackRate.value=rate;s.connect(MASTER);s.start(AC.currentTime+.01+delay);return true}catch(e){return false}}

  go:()=>{if(!playBuf('go'))tone(990,.18,'triangle')},lit:()=>{if(!playBuf('lit'))tone(440,.12)},win:()=>{if(!playBuf('win'))[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.07,i*.11))},lvl:()=>{if(!playBuf('lvl'))[784,1175].forEach((f,i)=>tone(f,.12,'triangle',.06,i*.08))},flip:()=>{if(!playBuf('flip'))tone(1400,.05)},pop:()=>{if(!playBuf('pop'))tone(600,.08)},nav:()=>{if(!playBuf('nav'))tone(1760,.03,'sine',.03)}};

const GM=Object.fromEntries(G.map(g=>[g.id,g]));S.prune();readChallenge();

/* ================= derived stats ================= */
function GOK(id){const g=typeof GM!=='undefined'&&GM[id];return!!(g&&!g.kid&&!g.tv)}
function gameIndex(id){const xs=S.st.hist.filter(h=>h.g===id).slice(-10).map(h=>h.idx).sort((a,b)=>b-a).slice(0,3);return xs.length?Math.round(xs.reduce((a,b)=>a+b)/xs.length):null}
function catIndex(c){const xs=G.filter(g=>g.cat===c&&!g.noIndex).map(g=>gameIndex(g.id)).filter(v=>v!=null);return xs.length?Math.round(xs.reduce((a,b)=>a+b)/xs.length):null}
function brainIndex(){const xs=Object.keys(CATS).map(catIndex).filter(v=>v!=null);return xs.length?Math.round(xs.reduce((a,b)=>a+b)/xs.length):null}
const starsOf=i=>i==null?0:i>=850?3:i>=600?2:i>=350?1:0;
function streak(){let n=0,d=new Date();if(!S.st.days[dayKey(d)])d=addDays(d,-1);while(S.st.days[dayKey(d)]){n++;d=addDays(d,-1)}return n}
function seeded(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function workout(){const k=dayKey();if(boostActive()){if(!S.st.wk||S.st.wk.d!==k||S.st.wk.ids.join()!==S.st.boost.ids.join()){S.st.wk={d:k,ids:S.st.boost.ids.slice()};S.save()}return S.st.wk.ids}if(planActive()){if(!S.st.wk||S.st.wk.d!==k||S.st.wk.ids.join()!==S.st.plan.ids.join()){S.st.wk={d:k,ids:S.st.plan.ids.slice()};S.save()}return S.st.wk.ids}if(S.st.wk&&S.st.wk.d===k&&S.st.wk.ids.every(id=>GM[id]))return S.st.wk.ids;
  let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))|0;const r=seeded(h);const others=['spa','log','foc','flx'];for(let i=others.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[others[i],others[j]]=[others[j],others[i]]}
  const plays=id=>S.st.hist.filter(x=>x.g===id).length;
  const ids=['mem','spd',...others.slice(0,2)].map(c=>{const gs=G.filter(g=>g.cat===c&&(c!=='spd'||['dd','hawk','glance'].includes(g.id))&&!g.hidden&&!g.manual&&!(g.sound&&S.st.mute)),m=Math.min(...gs.map(g=>plays(g.id))),f=gs.filter(g=>plays(g.id)===m);return f[Math.floor(r()*f.length)].id});
  S.st.wk={d:k,ids};S.save();return ids}
function doneToday(id){const k=dayKey();return S.st.hist.some(h=>h.g===id&&h.d===k)}

const stars=n=>`<span class="stars">${[0,1,2].map(i=>STAR(i<n)).join('')}</span>`;
const icoBox=(g,cls='ico')=>`<div class="${cls}" style="--c:${g.col[0]};background:linear-gradient(140deg,${g.col[0]},${g.col[1]});color:${g.col[0]}">${I[g.id]}</div>`;

function weekInfo(){const now=new Date(),s=addDays(now,-now.getDay()),days=[...Array(7)].map((_,i)=>dayKey(addDays(s,i)));return{done:days.filter(d=>S.st.wdone&&S.st.wdone[d]).length,days}}
function brainRing(){const keys=Object.keys(CATS),cx=100,cy=100,R=80,seg=360/keys.length,gap=5;
  const P=(a,r)=>[cx+r*Math.cos((a-90)*Math.PI/180),cy+r*Math.sin((a-90)*Math.PI/180)];
  const arc=(a0,a1)=>{const[x0,y0]=P(a0,R),[x1,y1]=P(a1,R);return`M${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`};
  let s='';keys.forEach((k,i)=>{const a0=i*seg+gap/2,a1=(i+1)*seg-gap/2,v=catIndex(k)??0;s+=`<path d="${arc(a0,a1)}" style="stroke:rgba(var(--tint),.1)" stroke-width="15" fill="none"/>`;if(v>0)s+=`<path d="${arc(a0,a0+(a1-a0)*Math.max(.03,v/1000))}" stroke="${CATS[k].hex}" stroke-width="15" fill="none"/>`});
  const bi=brainIndex();
  return`<svg viewBox="0 0 200 200" class="bring" role="img" aria-label="مؤشر العقل">${s}<circle cx="100" cy="100" r="62" style="fill:rgba(var(--tint),.05)"/><text x="100" y="110" text-anchor="middle" font-family="Tajawal,sans-serif" font-weight="800" font-size="46" style="fill:var(--ink)">${bi??'—'}</text><text x="100" y="132" text-anchor="middle" font-family="Tajawal,sans-serif" font-size="11.5" font-weight="700" style="fill:var(--muted)">مؤشر العقل · من 1000</text></svg>`}
const evBadge=g=>g.ev?'<span class="badge ev">مثبت علميًا</span>':'';
function railCard(g){const gi=gameIndex(g.id);return`<button class="rcard" data-g="${g.id}" style="--c:${g.col[0]}">${icoBox(g)}${evBadge(g)}<b>${g.name}</b><span class="rmeta"><span style="${catTxt(CATS[g.cat].hex)}">${CATS[g.cat].n}</span>${gi!=null?stars(starsOf(gi)):'<span class="new">جديدة</span>'}</span></button>`}

  const wk=workout(),done=wk.filter(doneToday).length,w=weekInfo(),fresh=G.filter(g=>!g.hidden&&!S.st.hist.some(h=>h.g===g.id)),allDone=wk.every(doneToday);
  $('#v-home').innerHTML=`

  <section class="hero-card"><div class="bring-wrap">${brainRing()}</div>

function radarSVG(){
  const keys=Object.keys(CATS),cx=160,cy=150,R=96,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/keys.length;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const ring=f=>keys.map((_,i)=>pt(i,R*f).join(',')).join(' '),vals=keys.map(k=>catIndex(k)??0),poly=vals.map((v,i)=>pt(i,R*v/1000).join(',')).join(' ');
  return`<svg viewBox="0 0 320 300" role="img" aria-label="مخطط المهارات"><defs><linearGradient id="radarfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3FD0E8" stop-opacity=".45"/><stop offset="1" stop-color="#FF5FA8" stop-opacity=".3"/></linearGradient></defs>
   ${[.25,.5,.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" style="stroke:rgba(var(--tint),.12)"/>`).join('')}
   ${keys.map((_,i)=>{const[x,y]=pt(i,R);return`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:rgba(var(--tint),.1)"/>`}).join('')}
   <polygon points="${poly}" fill="url(#radarfill)" style="stroke:var(--ink)" stroke-width="2" stroke-linejoin="round"/>
   ${vals.map((v,i)=>{const[x,y]=pt(i,R*v/1000);return`<circle cx="${x}" cy="${y}" r="5" fill="${CATS[keys[i]].hex}" style="stroke:var(--bg)" stroke-width="2"/>`}).join('')}
   ${keys.map((k,i)=>{const[x,y]=pt(i,R+30);return`<text x="${x}" y="${y}" text-anchor="middle" font-family="Tajawal,sans-serif" font-size="13" font-weight="700" fill="${CATS[k].hex}">${CATS[k].n}</text><text x="${x}" y="${y+16}" text-anchor="middle" font-family="Tajawal,sans-serif" font-size="12" style="fill:var(--muted)">${catIndex(k)??'—'}</text>`}).join('')}
  </svg>`}

  const CAP=[3,2,1],BC=['#FF5F7A','#3FD0E8','#8BE36A'],key=s=>s.map(p=>p.join('')).join('|');
  const nb=s=>{const o=[];for(let a=0;a<3;a++)if(s[a].length)for(let b=0;b<3;b++)if(a!==b&&s[b].length<CAP[b]){const t=s.map(p=>p.slice());t[b].push(t[a].pop());o.push(t)}return o};
  const dist=(a,b)=>{const kb=key(b),seen=new Map([[key(a),0]]),q=[a];while(q.length){const s=q.shift(),d=seen.get(key(s));if(key(s)===kb)return d;for(const t of nb(s)){const kt=key(t);if(!seen.has(kt)){seen.set(kt,d+1);q.push(t)}}}return 99};
  const rand=()=>{const s=[[],[],[]];for(const b of shuffle([0,1,2])){s[pick([0,1,2].filter(p=>s[p].length<CAP[p]))].push(b)}return s};
  const tlv=clamp(S.st.lv.tol||1,1,5),targets=[[2,3,4,4,5,6],[3,4,5,5,6,6],[4,5,5,6,6,7],[5,5,6,7,7,8],[5,6,7,7,8,8]][tlv-1],tot=targets.reduce((a,b)=>a+b);let pi=0,cur,goal,min,moves,sel=null,sum=0,pts=0,live=false;
  function setup(){const want=targets[pi];let t=0;do{cur=rand();goal=rand();min=dist(cur,goal)}while(min!==want&&t++<600);moves=0;sel=null;live=true;
    $('#tl').textContent;$('#ml').innerHTML=`<span class="num ltr" style="font-size:18px">0 / ${min}</span>`;$('#m').innerHTML=`لغز ${pi+1} من 6 · طابق الهدف في <b class="num">${min}</b> حركات`;draw()}
  const pegs=(s,mini)=>s.map((p,k)=>`<div class="tpeg${!mini&&sel===k?' sel':''}" data-k="${k}" style="--cap:${CAP[k]}">${p.map(b=>`<i style="background:${BC[b]}"></i>`).join('')}</div>`).join('');

    if(cur[k].length>=CAP[k]){sfx.bad();sel=null;draw();$('#tolb').children[k].classList.add('shake');return}
    cur[k].push(cur[sel].pop());moves++;sel=null;tone(480,.07,'triangle');$('#ml').innerHTML=`<span class="num ltr" style="font-size:18px">${moves} / ${min}</span>`;draw();
    if(key(cur)===key(goal)){live=false;const eff=min/moves;sum+=eff*min;const g=Math.round(60*min*eff);pts+=g;$('#sc').textContent=pts;sfx.lvl();floatAt(st,...relPos($('#tolb'),st),'+'+g);pi++;
      $('#m').textContent=moves===min?'حل مثالي!':`حللته في ${moves} حركات، والأقل ${min}`;if(pi<targets.length)later(setup,1200);else later(end,900)}}
  function end(){stopAll();const e=sum/tot;let nl=tlv;if(pi>=targets.length&&e>=.85)nl=Math.min(5,tlv+1);else if(pi<4||e<.55)nl=Math.max(1,tlv-1);S.st.lv.tol=nl;done({pts,metric:Math.round(clamp(1000*e*(1+.08*(tlv-1)),0,1000)),detail:`حللت ${pi} من 6 ألغاز في المستوى ${tlv}.${nl>tlv?' المرة الجاية: ألغاز أطول.':nl<tlv?' رجعنا مستوى لتثبيت التخطيط.':''} الحل المثالي يعني أنك خططت قبل أن تحرك أي كرة.`})}

const AL='ابتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('');
const SERCOL=['#3FD0E8','#FF5F7A','#8BE36A','#FFD45A'],SERSH=['c','s','t','d'];

  const kinds=['rep','skip1','skip2','back','alt','grow','shape','skip3'].slice(0,Math.min(2+lv,8));let k;do k=pick(kinds);while(k===last&&kinds.length>1);last=k;
  if(k==='shape'){const pS=2+rnd(2),pC=pS===2?3:2,s0=rnd(4),c0=rnd(4),sh=i=>SERSH[(s0+i%pS)%4],co=i=>SERCOL[(c0+i%pC)%4],L=6;
    const tok=(s,c)=>`<svg viewBox="0 0 40 40" class="sertok">${SHP[s](20,21,13,c)}</svg>`;const ans={s:sh(L),c:co(L)};
    const set=[ans,{s:sh(L+1),c:co(L)},{s:sh(L),c:co(L+1)},{s:sh(L+1),c:co(L+1)}].filter((o,i,a)=>a.findIndex(x=>x.s===o.s&&x.c===o.c)===i);
    while(set.length<4){const o={s:pick(SERSH),c:pick(SERCOL)};if(!set.some(x=>x.s===o.s&&x.c===o.c))set.push(o)}shuffle(set);

      opts:set.map(o=>({html:tok(o.s,o.c),cls:'svgopt'})),ans:set.findIndex(o=>o===ans),cols:2}}
  let seq=[],ans;
  if(k==='rep'){const p=2+rnd(2),base=shuffle(AL.slice()).slice(0,p);for(let i=0;i<7;i++)seq.push(base[i%p]);ans=base[7%p]}
  else if(k.startsWith('skip')){const st=+k.slice(4)||1;const s=rnd(28-st*5);for(let i=0;i<5;i++)seq.push(AL[s+st*i]);ans=AL[s+st*5]}
  else if(k==='back'){const st=1+rnd(2),s=st*5+rnd(28-st*5);for(let i=0;i<5;i++)seq.push(AL[s-st*i]);ans=AL[s-st*5]}

  const ai=AL.indexOf(ans),cand=new Set([ans]);[ai+1,ai-1,ai+2,ai-2,ai+3].forEach(i=>{if(cand.size<4&&i>=0&&i<28)cand.add(AL[i])});seq.slice(-2).forEach(x=>{if(cand.size<4)cand.add(x)});

  function newPair(){const base={f:pick([1,-1]),w:Math.random()<.5,c:'hsl('+(rnd(12)*30)+' 75% 62%)'};const mode=pick(lv>=3?['w','c','f']:lv>=2?['w','c']:['w']);const ob={...base};

  const tap=side=>{if(!live||!cur||cur.done)return;cur.done=true;const n=cur.n,even=n%2===0,want=n===5?null:(even===(RULES[rule][0]==='زوجي'))?'r':'l';

}}

const RID_PER=8;

function ridUnlocked(ch){if(ch===0)return true;const p=pzState();let n=0;for(let i=(ch-1)*RID_PER;i<ch*RID_PER;i++)if(p.rid[i])n++;return n>=5}
function ridNext(){const p=pzState();for(let i=0;i<RIDDLES.length;i++)if(!p.rid[i]&&ridUnlocked(Math.floor(i/RID_PER)))return i;return rnd(RIDDLES.length)}

/* ---------- 2. river crossing (state-space search, solved by BFS) ---------- */
const RV={wolf:'🐺',sheep:'🐑',grass:'🌿',cat:'🐱',mouse:'🐭',cheese:'🧀',dog:'🐕',hen:'🐔',corn:'🌽',fox:'🦊'};
const RVN={wolf:'الذئب',sheep:'الخروف',grass:'العشب',cat:'القط',mouse:'الفأر',cheese:'الجبن',dog:'الكلب',hen:'الدجاجة',corn:'الذرة',fox:'الثعلب'};
const RV_EAT=[['wolf','sheep'],['sheep','grass'],['cat','mouse'],['mouse','cheese'],['dog','cat'],['hen','corn'],['fox','hen'],['wolf','hen'],['fox','mouse'],['dog','hen']];
function rvPath(n,cap,conf,s0){const F=1<<n,goal=(1<<(n+1))-1,ok=s=>{const fs=s&F?1:0;return conf.every(([a,b])=>{const sa=s>>a&1,sb=s>>b&1;return!(sa===sb&&sa!==fs)})};
  const par=new Map([[s0,-1]]),q=[s0];while(q.length){const s=q.shift();if(s===goal){const p=[s];let x=s;while(par.get(x)!==-1){x=par.get(x);p.unshift(x)}return p}
    const fs=s&F?1:0;let same=0;for(let i=0;i<n;i++)if((s>>i&1)===fs)same|=1<<i;
    for(let m=same;;m=(m-1)&same){let c=0;for(let x=m;x;x&=x-1)c++;if(c<=cap){const t=s^F^m;if(ok(t)&&!par.has(t)){par.set(t,s);q.push(t)}}if(!m)break}}return null}
function rvMake(lv){const n=[3,4,4,5,5,6,6][lv-1],cap=[1,2,1,2,2,2,3][lv-1];
  if(lv===1){const it=['wolf','sheep','grass'];return{it,cap,conf:[[0,1],[1,2]],min:rvPath(3,1,[[0,1],[1,2]],0).length-1}}
  let best=null;for(let t=0;t<80;t++){const it=shuffle(Object.keys(RV)).slice(0,n),conf=RV_EAT.filter(([a,b])=>it.includes(a)&&it.includes(b)).map(([a,b])=>[it.indexOf(a),it.indexOf(b)]);
    if(conf.length<Math.min(n-1,2+lv/3|0))continue;const p=rvPath(n,cap,conf,0);if(!p)continue;const d=p.length-1;if(d<=2*n-1&&cap>1&&t<60)continue;if(!best||d>best.min)best={it,cap,conf,min:d}}
  return best||rvMake(1)}
function runRiver(){return pzPlay('pz_river',api=>{
  const P=rvMake(api.lv),n=P.it.length,F=1<<n,goal=(1<<(n+1))-1;let s=0,boat=new Set(),moves=0,busy=false;
  api.body.innerHTML=`<div class="rvrules">${P.conf.map(([a,b])=>`<span>${RV[P.it[a]]} يأكل ${RV[P.it[b]]}</span>`).join('')}<span>القارب: المزارع + ${P.cap===1?'واحد':P.cap===2?'اثنان':'ثلاثة'}</span></div>
   <div class="rv"><div class="rvbank" id="rvL"></div><div class="rvriver"><div class="rvboat" id="rvB"></div></div><div class="rvbank" id="rvR"></div></div><button class="go-btn" id="rvgo">🚣 اعبر النهر</button>`;
  api.msg(`انقل الجميع إلى الضفة اليمنى. لا تترك من يأكل الآخر بدون المزارع. أقل حل: <b class="num">${P.min}</b> ${arN(P.min,AN.trip).replace(/^\d+ /,'')}`);
  const fs=()=>s&F?1:0;
  function draw(){const f=fs();['rvL','rvR'].forEach((idb,side)=>{$('#'+idb).innerHTML=P.it.map((k,i)=>(s>>i&1)===side&&!boat.has(i)?`<button class="rvit" data-i="${i}" ${side!==f?'disabled':''} aria-label="${RVN[k]}">${RV[k]}</button>`:'').join('')+(f===side?'':'')});
    const b=$('#rvB');b.classList.toggle('r',!!f);b.innerHTML=`<span class="rvfarm">🧑‍🌾</span>${[...boat].map(i=>`<button class="rvit inb" data-i="${i}" aria-label="${RVN[P.it[i]]}">${RV[P.it[i]]}</button>`).join('')}`;
    api.body.querySelectorAll('.rvit').forEach(e=>e.onclick=()=>tap(+e.dataset.i))}
  function tap(i){if(busy||api.ended)return;if(boat.has(i))boat.delete(i);else{if((s>>i&1)!==fs())return;if(boat.size>=P.cap){api.msg(`القارب يتسع للمزارع و${P.cap===1?'واحد فقط':P.cap===2?'اثنين فقط':'ثلاثة فقط'}`);sfx.bad();return}boat.add(i)}tone(560,.05);draw()}
  function cross(){if(busy||api.ended)return;let m=0;boat.forEach(i=>m|=1<<i);const t=s^F^m;moves++;busy=true;$('#rvB').classList.toggle('r');sfx.tick();
    later(()=>{s=t;boat.clear();busy=false;const f=fs(),eat=P.conf.find(([a,b])=>(s>>a&1)===(s>>b&1)&&(s>>a&1)!==f);
      if(eat){draw();api.msg(`${RV[P.it[eat[0]]]} أكل ${RV[P.it[eat[1]]]}! نبدأ من جديد`);api.wrong();busy=true;later(()=>{s=0;moves=0;busy=false;draw();api.msg(`حاول مرة ثانية. أقل حل: <b class="num">${P.min}</b>`)},1500);return}
      draw();if(s===goal)api.win(`عبرت الجميع في ${arN(moves,AN.trip)}، وأقل حل ممكن ${arN(P.min,AN.trip)}.`);else api.msg(`الرحلات: <b class="num">${moves}</b>`)},450)}
  $('#rvgo').onclick=cross;draw();pzHook({P,tap,cross,s:()=>s});
  return{hint:k=>{if(k===1)return`أقل عدد رحلات للحل ${arN(P.min,AN.trip)}، والرجوع يُحسب رحلة. أحيانًا لازم ترجع بأحدهم معك.`;const p=rvPath(n,P.cap,P.conf,s);if(!p||p.length<2)return'أنت قريب جدًا!';
    const d=(p[0]^p[1])&(F-1),names=P.it.filter((_,i)=>d>>i&1).map(k=>RV[k]+' '+RVN[k]);return`الخطوة التالية من وضعك الحالي: ${names.length?'اعبر ومعك '+names.join(' و'):'اعبر وحدك بدون أحد'}.`},
   reveal:()=>`أقل حل كان ${arN(P.min,AN.trip)}.`}})}

/* ---------- 3. rush hour (موقف السيارات) ---------- */
function rhDecode(b){const m={};[...b].forEach((ch,i)=>{if(ch==='o'||ch==='x')return;(m[ch]=m[ch]||[]).push(i)});const ks=Object.keys(m).sort((a,b)=>a==='A'?-1:b==='A'?1:a<b?-1:1);
  return ks.map(k=>{const c=m[k],r=Math.floor(c[0]/6),h=c.every(x=>Math.floor(x/6)===r);return{r,c:c[0]%6,len:c.length,h:h?1:0}})}
function rhSolve(vs,cap=40000){const pos0=vs.map(v=>v.h?v.c:v.r),K=p=>p.join(','),par=new Map([[K(pos0),null]]);let q=[pos0];
  const occ=p=>{const g=new Int8Array(36).fill(-1);vs.forEach((v,i)=>{for(let k=0;k<v.len;k++){const r=v.h?v.r:p[i]+k,c=v.h?p[i]+k:v.c;g[r*6+c]=i}});return g};
  while(q.length){const nq=[];for(const p of q){if(p[0]===4){const path=[];let k=K(p);while(par.get(k)){const e=par.get(k);path.unshift(e.mv);k=e.from}return path}
    const g=occ(p);for(let i=0;i<vs.length;i++){const v=vs[i];for(const d of[-1,1])for(let s=1;;s++){const np=p[i]+d*s,cell=d<0?np:np+v.len-1;if(cell<0||cell>5)break;const idx=v.h?v.r*6+cell:cell*6+v.c;if(g[idx]!==-1)break;
      const nx=p.slice();nx[i]=np;const k=K(nx);if(!par.has(k)){par.set(k,{from:K(p),mv:[i,np]});nq.push(nx);if(par.size>cap)return null}}}}q=nq}return null}
function rhRandom(lo,hi){for(let t=0;t<400;t++){const vs=[{r:2,c:rnd(3),len:2,h:1}],occ=new Set([12+vs[0].c,13+vs[0].c]);const nv=6+rnd(7);
    for(let k=0;k<60&&vs.length<nv;k++){const h=Math.random()<.5,len=Math.random()<.3?3:2,r=rnd(h?6:7-len),c=rnd(h?7-len:6);if(h&&r===2)continue;const cells=[...Array(len)].map((_,j)=>(r+(h?0:j))*6+c+(h?j:0));if(cells.some(x=>occ.has(x)))continue;cells.forEach(x=>occ.add(x));vs.push({r,c,len,h:h?1:0})}
    const p=rhSolve(vs,20000);if(p&&p.length>=lo&&p.length<=hi)return{vs,min:p.length}}return null}
const RH_LV=[[2,3],[4,5],[6,7],[8,10],[11,13],[14,17],[18,22],[23,99]];

/* ---------- 5. rotating statues (pressing one turns its neighbours) ---------- */
function stMake(lv){const n=[3,4,4,5,5,6,6][lv-1],ring=lv>=4,twist=lv>=6;

  const s=dec(pick(cand)),tgt=[...Array(n)].map(()=>rnd(4));return{n,R,s,tgt,ring,twist,dist,nxt,enc,min:dist[enc(s)]}}

/* ---------- 6. pipes (water to every house) ---------- */

function pcLine(clue,known){const L=known.length,cl=clue[0]===0?[]:clue,res=Array(L).fill(null);let any=false;

    const rem=cl.slice(ci+1).reduce((a,b)=>a+b+1,0);for(let s=pos;s+cl[ci]+rem<=L;s++){let ok=true;for(let i=pos;i<s;i++)if(known[i]===1){ok=false;break}if(!ok)break;for(let i=s;i<s+cl[ci];i++)if(known[i]===0){ok=false;break}if(!ok)continue;const e=s+cl[ci];if(e<L&&known[e]===1)continue;

function pcUnique(n,rows,cols){const g=[...Array(n)].map(()=>Array(n).fill(-1));let ch=true;while(ch){ch=false;for(let a=0;a<2;a++)for(let i=0;i<n;i++){const known=a?g.map(r=>r[i]):g[i].slice(),r=pcLine(a?cols[i]:rows[i],known);if(!r)return false;r.forEach((v,j)=>{if(v>=0&&known[j]===-1){if(a)g[j][i]=v;else g[i][j]=v;ch=true}})}}return g.every(r=>r.every(v=>v>=0))}

function runPicross(){return pzPlay('pz_pic',api=>{

  function check(){if(api.ended)return;if(g.every((r,i)=>r.every((v,j)=>(v===1)===(P.sol[i][j]===1))))api.win(`رسمت اللوحة ${n}×${n} كاملة.`)}

   reveal:()=>{for(let i=0;i<n;i++)for(let j=0;j<n;j++)g[i][j]=P.sol[i][j]?1:0;draw();return'هذه كانت اللوحة.'}}})}

/* ---------- 8. logic grid (Einstein mini, brute-force unique) ---------- */
const LG_P=['سعد','فهد','ماجد','خالد'];
const LG_C=[{n:'المشروب',v:'يشرب',it:['الشاي','القهوة','العصير','الحليب'],ic:['🍵','☕','🧃','🥛']},{n:'الحيوان',v:'يربّي',it:['القطة','الببغاء','السمكة','الأرنب'],ic:['🐱','🦜','🐟','🐰']},{n:'اللون',v:'يحب',it:['الأحمر','الأزرق','الأخضر','الأصفر'],ic:['🟥','🟦','🟩','🟨']},{n:'المدينة',v:'من',it:['الرياض','جدة','أبها','الدمام'],ic:['🏙️','🌊','⛰️','🏖️']}];
function lgPerms(n){if(n===1)return[[0]];const o=[];lgPerms(n-1).forEach(p=>{for(let i=0;i<=p.length;i++)o.push([...p.slice(0,i),n-1,...p.slice(i)])});return o}
function lgMake(lv){const[n,a]=[[3,1],[3,2],[3,2],[4,2],[4,2],[4,3],[4,3]][lv-1],maxPos=lv<=2?9:lv<=5?1:0,cats=shuffle([0,1,2,3]).slice(0,a),perms=lgPerms(n);
  let sols=[[]];for(let k=0;k<a;k++){const ns=[];sols.forEach(s=>perms.forEach(p=>ns.push([...s,p])));sols=ns}
  for(let t=0;t<30;t++){const sol=pick(sols),pool=[];
    for(let k=0;k<a;k++)for(let p=0;p<n;p++)for(let v=0;v<n;v++)pool.push(sol[k][p]===v?{t:'pos',k,p,v,w:1}:{t:'neg',k,p,v,w:3});
    for(let k1=0;k1<a;k1++)for(let k2=k1+1;k2<a;k2++)for(let v1=0;v1<n;v1++)for(let v2=0;v2<n;v2++){const same=sol[k1].indexOf(v1)===sol[k2].indexOf(v2);pool.push({t:same?'lnk':'nlk',k1,v1,k2,v2,w:same?2:2})}
    const holds=(c,s)=>c.t==='pos'?s[c.k][c.p]===c.v:c.t==='neg'?s[c.k][c.p]!==c.v:c.t==='lnk'?s[c.k1].indexOf(c.v1)===s[c.k2].indexOf(c.v2):s[c.k1].indexOf(c.v1)!==s[c.k2].indexOf(c.v2);
    const ord=pool.map(c=>[c,Math.random()*c.w]).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);let cand=sols,clues=[],npos=0;
    for(const c of ord){if(cand.length===1)break;if(c.t==='pos'&&npos>=maxPos)continue;const nc=cand.filter(s=>holds(c,s));if(nc.length<cand.length){cand=nc;clues.push(c);if(c.t==='pos')npos++}}
    if(cand.length!==1)continue;for(let i=clues.length-1;i>=0;i--){const r=clues.filter((_,j)=>j!==i);if(sols.filter(s=>r.every(c=>holds(c,s))).length===1)clues=r}
    return{n,a,cats,sol,clues:shuffle(clues)}}return lgMake(Math.max(1,lv-1))}
function lgText(c,P){const C=k=>LG_C[P.cats[k]];
  if(c.t==='pos')return`${LG_P[c.p]} ${C(c.k).v} ${C(c.k).it[c.v]}.`;const nv=k=>C(k).v==='من'?'ليس من':'لا '+C(k).v;if(c.t==='neg')return`${LG_P[c.p]} ${nv(c.k)} ${C(c.k).it[c.v]}.`;
  const who=(k,v)=>P.cats[k]===3?`الذي من ${C(k).it[v]}`:`الذي ${C(k).v} ${C(k).it[v]}`;
  return c.t==='lnk'?`${who(c.k1,c.v1)} ${C(c.k2).v} ${C(c.k2).it[c.v2]}.`:`${who(c.k1,c.v1)} ${nv(c.k2)} ${C(c.k2).it[c.v2]}.`}
function runGrid(){return pzPlay('pz_grid',api=>{
  const P=lgMake(api.lv),ans=[...Array(P.a)].map(()=>Array(P.n).fill(-1)),fixed=new Set();
  api.body.innerHTML=`<ol class="lgclues">${P.clues.map(c=>`<li>${lgText(c,P)}</li>`).join('')}</ol><table class="lgt" id="lgt"></table><button class="go-btn" id="lgok">تحقق من الحل</button>`;
  api.msg(`لكل شخص ${P.a>1?'شيء واحد من كل عمود':'شيء واحد'}، ولا يتكرر شيء. اضغط الخانة لتغيّرها.`);
  function draw(){$('#lgt').innerHTML=`<tr><th></th>${P.cats.map(k=>`<th>${LG_C[k].n}</th>`).join('')}</tr>`+LG_P.slice(0,P.n).map((nm,p)=>`<tr><th>${nm}</th>${P.cats.map((k,ci)=>{const v=ans[ci][p];return`<td><button class="lgc${fixed.has(ci+'.'+p)?' fix':''}${v>=0?' set':''}" data-c="${ci}" data-p="${p}">${v>=0?`<span>${LG_C[k].ic[v]}</span>${LG_C[k].it[v]}`:'؟'}</button></td>`}).join('')}</tr>`).join('');
    $('#lgt').querySelectorAll('.lgc').forEach(b=>b.onclick=()=>{const c=+b.dataset.c,p=+b.dataset.p;if(api.ended||fixed.has(c+'.'+p))return;ans[c][p]=ans[c][p]+1>=P.n?-1:ans[c][p]+1;tone(520,.04);draw()})}
  $('#lgok').onclick=()=>{if(api.ended)return;if(ans.some(r=>r.includes(-1))){api.msg('أكمل كل الخانات أولًا');return}if(ans.every((r,c)=>r.every((v,p)=>v===P.sol[c][p])))api.win('حللت شبكة المنطق كاملة.');else{api.wrong();api.msg('فيه خطأ. ارجع للأدلة: كل دليل يجب أن يكون صحيحًا.')}};
  draw();pzHook({P,ans,draw});
  return{hint:k=>{if(k===1)return'ارسم في ذهنك جدول «نعم/لا»: كل دليل «لا» يشطب خانة، وإذا بقي خيار واحد في الصف فهو الجواب.';const c=[];ans.forEach((r,ci)=>r.forEach((v,p)=>{if(!fixed.has(ci+'.'+p)&&v!==P.sol[ci][p])c.push([ci,p])}));if(!c.length)return null;const[ci,p]=pick(c);ans[ci][p]=P.sol[ci][p];fixed.add(ci+'.'+p);draw();const C=LG_C[P.cats[ci]];return`${LG_P[p]} ${C.v} ${C.it[P.sol[ci][p]]} (ثبّتُّها لك).`},
   reveal:()=>{P.sol.forEach((r,c)=>r.forEach((v,p)=>ans[c][p]=v));draw();return'هذا هو الحل الصحيح.'}}})}

/* ---------- 9. balance scale (fake coin; the scale answers adversarially, so only real logic wins) ---------- */
const SC_LV=[[3,'h',1],[9,'h',2],[4,'u',2],[27,'h',3],[9,'u',3],[12,'u',3],[13,'u',3]];
function runScale(){return pzPlay('pz_scale',api=>{
  const[n,mode,W]=SC_LV[api.lv-1];let cand=[];for(let c=0;c<n;c++){cand.push([c,1]);if(mode==='u')cand.push([c,-1])}
  const pos=Array(n).fill(0);let used=0,accuse=false,showSafe=false,log=[];
  api.body.innerHTML=`<div class="scale" id="scl"><div class="sbeam" id="sbm"><div class="span l" id="spl"></div><div class="span r" id="spr"></div></div><div class="spost"></div></div>
   <div class="scoins ltr" id="sco"></div><div class="sbtns"><button class="go-btn" id="sgo">⚖ زِن</button><button class="cta ghost" id="sac">أعرف المزيفة!</button></div><ol class="slog" id="slg"></ol>`;
  api.msg(`بين ${n} قطع واحدة مزيفة ${mode==='h'?'<b>أثقل</b> من الباقي':'<b>تختلف في الوزن</b> (لا نعرف أثقل أم أخف)'}. عندك ${arN(W,AN.weigh)}. اضغط القطعة لتنقلها: الصينية ← اليسار ← اليمين.`);
  const coins=()=>cand.map(x=>x[0]),sus=()=>new Set(coins());
  function draw(){const sset=sus();const btn=(c)=>`<button class="coinb${showSafe&&!sset.has(c)?' safe':''}${accuse?' acc':''}" data-c="${c}">${c+1}</button>`;
    $('#sco').innerHTML=[...Array(n).keys()].filter(c=>!pos[c]).map(btn).join('');$('#spl').innerHTML=[...Array(n).keys()].filter(c=>pos[c]===1).map(btn).join('');$('#spr').innerHTML=[...Array(n).keys()].filter(c=>pos[c]===2).map(btn).join('');
    api.body.querySelectorAll('.coinb').forEach(b=>b.onclick=()=>tap(+b.dataset.c));$('#sgo').textContent=used>=W?'انتهت الوزنات':`⚖ زِن (باقي ${W-used})`;$('#sgo').disabled=used>=W;$('#sac').classList.toggle('on',accuse);$('#sac').textContent=accuse?'اختر القطعة المزيفة…':'أعرف المزيفة!'}
  function tap(c){if(api.ended)return;if(accuse){judge(c);return}pos[c]=(pos[c]+1)%3;tone(640,.04);draw()}
  function weigh(){if(api.ended||used>=W)return;const L=pos.filter(p=>p===1).length,R=pos.filter(p=>p===2).length;if(!L||L!==R){api.msg('ضع عددًا متساويًا من القطع في الكفتين.');sfx.bad();return}
    const out=x=>{const[c,d]=x;return pos[c]===1?(d>0?'L':'R'):pos[c]===2?(d>0?'R':'L'):'E'};const grp={L:[],R:[],E:[]};cand.forEach(x=>grp[out(x)].push(x));
    const mx=Math.max(grp.L.length,grp.R.length,grp.E.length),res=shuffle(['L','R','E']).find(k=>grp[k].length===mx);cand=grp[res];used++;sfx.tick();
    $('#sbm').className='sbeam '+(res==='L'?'tl':res==='R'?'tr':'');const l=[...Array(n).keys()].filter(c=>pos[c]===1).map(c=>c+1).join('،'),r=[...Array(n).keys()].filter(c=>pos[c]===2).map(c=>c+1).join('،');
    log.push(`<li><span class="ltr">${l}</span> ⚖ <span class="ltr">${r}</span>: ${res==='E'?'متعادلتان':res==='L'?'اليسار أثقل':'اليمين أثقل'}</li>`);$('#slg').innerHTML=log.join('');draw();
    if(used>=W){accuse=true;draw();api.msg('انتهت الوزنات. اختر القطعة المزيفة.')}}
  function judge(c){const cs=sus();if(cs.size===1&&cs.has(c)){api.win(`وجدت القطعة المزيفة (${c+1}) في ${arN(used,AN.weigh)}.`);return}
    const alt=[...cs].filter(x=>x!==c);api.over(cs.has(c)?`${alt.length>3?`كان فيه ${alt.length} قطع أخرى ممكنة`:`كانت ممكن تكون القطعة ${alt.map(x=>x+1).join(' أو ')} أيضًا`}، فاختيارك كان تخمينًا لا استنتاجًا.`:`القطعة ${c+1} مستحيل تكون المزيفة حسب الوزنات. المشكوك فيها كانت: ${[...cs].map(x=>x+1).join('، ')}.`)}
  $('#sgo').onclick=weigh;$('#sac').onclick=()=>{if(api.ended)return;accuse=!accuse;draw()};draw();
  return{hint:k=>{if(k===1)return mode==='h'?'الميزان له 3 نتائج: يسار، يمين، تعادل. قسّم المشكوك فيها إلى 3 مجموعات متساوية وزن مجموعتين.':'استخدم القطع التي ثبت أنها سليمة كمرجع. وفي الوزنة التالية بدّل بعض القطع بين الكفتين وأخرج بعضها.';
    if(k===2){showSafe=true;draw();return'القطع الباهتة ثبت أنها سليمة. ركّز على البقية فقط.'}
    const s=[...sus()],m=Math.ceil(s.length/3);return mode==='h'?`ضع ${m} من المشكوك فيها في كل كفة واترك ${s.length-2*m} خارجًا.`:n>=12&&used===0?'ابدأ بوزن 4 مقابل 4.':n===9&&used===0?'ابدأ بوزن 3 مقابل 3.':n===4&&used===0?'ابدأ بوزن قطعة مقابل قطعة.':`المشكوك فيها الآن: ${s.map(x=>x+1).join('، ')}. وزّعها بحيث تبقى كل نتيجة ممكنة بنفس الحجم تقريبًا.`},
   reveal:()=>`المشكوك فيها كانت: ${[...sus()].map(x=>x+1).join('، ')}.`}})}

/* ================= spatial navigation for TV remotes ================= */
let TV_LAST=null,TV_LAST_G=null;window.TVGRAB=null;
function tvCands(){const mp=$('#modepick'),root=mp||($('#play').hidden?(S_MODE()==='tv'?$('#v-tv'):document.body):$('#play'));
  return[...root.querySelectorAll('button,[data-k],.tpeg,.xcell,input,select,[tabindex="0"]')].filter(e=>{if(e.disabled||e.hidden||e.closest('[hidden]'))return false;const r=e.getBoundingClientRect();return r.width>2&&r.height>2&&getComputedStyle(e).visibility!=='hidden'})}
function tvFocus(e,quiet){if(!e)return;if(!/^(BUTTON|INPUT|SELECT|A)$/.test(e.tagName)&&!e.hasAttribute('tabindex'))e.tabIndex=-1;try{e.focus({preventScroll:true})}catch(x){e.focus()}const r=e.getBoundingClientRect();TV_LAST={x:r.left+r.width/2,y:r.top+r.height/2};
  if(r.top<70||r.bottom>innerHeight-20)e.scrollIntoView({block:'center'});if(!quiet)sfx.nav()}
function tvMove(dir){const c=tvCands();if(!c.length)return;const a=document.activeElement;
  if(!c.includes(a)){if(TV_LAST){let b=null,bd=1e9;c.forEach(e=>{const r=e.getBoundingClientRect(),d=Math.hypot(r.left+r.width/2-TV_LAST.x,r.top+r.height/2-TV_LAST.y);if(d<bd){bd=d;b=e}});tvFocus(b)}else tvFocus(c[0]);return}
  const ra=a.getBoundingClientRect(),ax=ra.left+ra.width/2,ay=ra.top+ra.height/2;let best=null,bs=1e9;
  for(const e of c){if(e===a)continue;const r=e.getBoundingClientRect(),dx=r.left+r.width/2-ax,dy=r.top+r.height/2-ay;let mn,cr;
    if(dir==='ArrowRight'){if(dx<=3)continue;mn=dx;cr=Math.abs(dy)}else if(dir==='ArrowLeft'){if(dx>=-3)continue;mn=-dx;cr=Math.abs(dy)}else if(dir==='ArrowDown'){if(dy<=3)continue;mn=dy;cr=Math.abs(dx)}else{if(dy>=-3)continue;mn=-dy;cr=Math.abs(dx)}
    const s=mn+cr*2.5;if(s<bs){bs=s;best=e}}
  if(best)tvFocus(best)}
const tvActive=()=>S_MODE()==='tv'||!!$('#modepick');
document.addEventListener('keydown',e=>{if(!tvActive())return;const k=e.key,ae=document.activeElement,typing=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  const back=k==='Escape'||k==='GoBack'||k==='BrowserBack'||e.keyCode===10009||e.keyCode===461||(k==='Backspace'&&!typing);
  if(back&&!$('#modepick')){e.preventDefault();e.stopPropagation();if(!$('#play').hidden)closePlay();else{renderTV();setTimeout(()=>tvMove('ArrowDown'),30)}return}

  if(k==='Enter'&&ae&&ae!==document.body){e.stopPropagation();if(!/^(BUTTON|INPUT|A|SELECT)$/.test(ae.tagName)){e.preventDefault();ae.click()}}},true);

function runTvSimon(){return done=>{
  const lv=clamp(S.st.lv.tv_simon||1,1,10),st=$('#stage'),DIRS=['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'],AR=['⬆','➡','⬇','⬅'],NOTE=[523,659,784,392];

  let len=lv+1,seq=[],pos=0,listen=false,lives=2,pts=0,best=0;pzHook({seq:()=>seq,listen:()=>listen});const pads=[...st.querySelectorAll('.tsp')];
  const flash=(i,ms=420)=>{pads[i].classList.add('on');tone(NOTE[i],.25,'triangle',.08);later(()=>pads[i].classList.remove('on'),ms)};

  function input(i){if(!listen)return;flash(i,200);if(i===seq[pos]){pos++;if(pos===len){listen=false;pts+=len*10;best=Math.max(best,len);$('#sc').textContent=pts;sfx.ok(2);len++;later(round,800)}}

/* dark maze: see it for a moment, then walk it from memory with the arrows */
function mzMake(n){const W=n,H=n,walls=[...Array(W*H)].map(()=>15),seen=new Set([0]),st=[0];while(st.length){const c=st[st.length-1],x=c%W,y=c/W|0,nb=[[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]].filter(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>=0&&ny>=0&&nx<W&&ny<H&&!seen.has(ny*W+nx)});

 {id:'k_light',band:'a',maxLv:6,emo:'💡',col:['#8BE36A','#3FBF6A'],name:'اتبع الضوء',how:['شوف الأضواء','اضغطها بنفس الترتيب'],run:runKidLight},
 {id:'k_shadow',band:'a',maxLv:5,emo:'🌑',col:['#C9CFF0','#7A86C4'],name:'ظل الشكل',how:['شوف الصورة','اختر ظلها'],run:()=>kidRounds('k_shadow',{make:kidShadow})},
 {id:'k_rush',band:'b',maxLv:4,emo:'🚗',col:['#FF4D6D','#FF8A3D'],name:'موقف السيارات',how:['اسحب السيارات','أخرج السيارة الحمراء'],run:runKidRush},
 {id:'k_nback',band:'b',maxLv:5,emo:'🐾',col:['#5EE6C0','#3FD0E8'],name:'نفس الحيوان؟',how:['تذكّر الحيوانات','قل هل هو نفس اللي قبله'],run:()=>kidRounds('k_nback',{make:kidNbackMake(),n:8})},
 {id:'k_matrix',band:'b',maxLv:5,emo:'🧩',col:['#A6F05A','#2FD6A0'],name:'الصورة الناقصة',how:['شوف القاعدة في الصفوف','اختر الصورة الناقصة'],run:()=>kidRounds('k_matrix',{make:kidMatrix})},
 {id:'k_draw',band:'b',maxLv:5,emo:'🎨',col:['#FF8FD1','#B48CFF'],name:'الرسم بالمربعات',how:['شوف الرسمة','ارسم مثلها'],run:runKidDraw},
 {id:'k_map',band:'b',maxLv:5,emo:'🗺️',col:['#F2A65A','#FFD45A'],name:'خريطة الكنز',how:['امشِ حسب الأسهم','اضغط مكان الكنز'],run:()=>kidRounds('k_map',{make:kidMap})}];
KID_GAMES.forEach(g=>{Object.assign(g,{cat:g.band==='a'?'mem':'log',kid:g.band,hidden:1,noIndex:1,nocd:1,lab:'',why:'',norm:m=>m});I[g.id]=`<span class="kemo">${g.emo}</span>`;G.push(g);GM[g.id]=g});
[{id:'tv_simon',cat:'mem',col:['#B48CFF','#3FD0E8'],name:'اتبع الأسهم',lab:'Arrow span',why:'مدى الذاكرة المكانية التسلسلية (مثل مهمة كورسي) بأزرار الريموت.',how:['راقب الأسهم وهي تضيء.','كررها بنفس الترتيب بأسهم الريموت.','السلسلة تطول مع كل نجاح، وعندك محاولتان.'],run:runTvSimon},
 {id:'tv_maze',cat:'spa',col:['#5EE6C0','#7DA2FF'],name:'المتاهة المظلمة',lab:'Dark maze',why:'تحفظ خريطة المتاهة ثم تمشي فيها من ذاكرتك: ذاكرة مكانية وتخطيط طريق.',how:['احفظ الطريق في ثوانٍ.','تظلم المتاهة: امشِ بالأسهم.','كل اصطدام بالجدار يُحسب عليك.'],run:runTvMaze}].forEach(g=>{Object.assign(g,{tv:1,hidden:1,noIndex:1,norm:m=>m});G.push(g);GM[g.id]=g});
Object.assign(I,{tv_simon:'<svg viewBox="0 0 48 48" fill="#0A0E1C"><path d="M24 5l7 9H17zM24 43l-7-9h14zM5 24l9-7v14zM43 24l-9 7V17z"/><circle cx="24" cy="24" r="5" opacity=".5"/></svg>',
 tv_maze:'<svg viewBox="0 0 48 48" fill="none" stroke="#0A0E1C" stroke-width="4" stroke-linecap="round"><path d="M6 6h36v36H6zM6 18h24M18 30h24M18 18v12M30 6v6"/><circle cx="12" cy="12" r="2.5" fill="#0A0E1C"/></svg>'});

/* kid intro (simple, big) */
function kidIntro(g){$('#stage').innerHTML=`<div class="intro kintro">${icoBox(g,'hero')}<h2>${g.name}</h2><ul class="how">${g.how.map((h,i)=>`<li><b>${i+1}</b><span>${h}</span></li>`).join('')}</ul><div class="bestline">المستوى <b class="num">${pzLv(g.id)}</b></div></div><button class="go-btn" id="go">يلا نلعب ▶</button>`;
  const go=()=>countdown();$('#go').onclick=go;$('#go').focus();keyH=e=>{if(e.key==='Enter')go()}}

/* ================= kid home + parent area ================= */
let KID_VIEW='home';
function renderKid(){const v=$('#v-kid'),K=kidSt(),c=kidCur();if(!v)return;
  if(KID_VIEW==='parent')return renderParent();
  if(!c||KID_VIEW==='add')return renderKidAdd();
  const left=kidLeft(c),games=KID_GAMES.filter(g=>g.band===c.band),pct=Math.round(100*left/(K.limit*60));
  v.innerHTML=`<div class="ktop"><div class="kwho"><span class="kav">${c.av}</span><div><span class="eyebrow">أهلًا</span><h1>${esc(c.name)}</h1></div></div><button class="klock" id="kpar" aria-label="ولي الأمر">🔒<small>ولي الأمر</small></button></div>
   ${K.list.length>1?`<div class="kswitch">${K.list.map(x=>`<button class="${x.id===c.id?'on':''}" data-kid="${x.id}">${x.av} ${esc(x.name)}</button>`).join('')}</div>`:''}
   <div class="ktime"><div class="ktbar"><i style="width:${pct}%"></i></div><span>${left>0?`باقي ${fmtDur(left)} لعب اليوم`:'انتهى وقت اللعب اليوم'}</span></div>
   ${left<=0?`<section class="kbreak"><div class="kbe">🤸</div><h2>وقت الحركة!</h2><p>${pick(KID_MOVE)}</p><small>لعبنا كفاية اليوم. نكمل بكرة إن شاء الله 🌙</small></section>`:
   `<div class="kgrid">${games.map(g=>`<button class="kgame" data-g="${g.id}" style="--c:${g.col[0]}"><span class="kge" style="background:linear-gradient(140deg,${g.col[0]},${g.col[1]})">${g.emo}</span><b>${g.name}</b><span class="klv">${'★'.repeat(Math.min(5,pzLv(g.id)))}<i>${'★'.repeat(Math.max(0,5-Math.min(5,pzLv(g.id))))}</i></span></button>`).join('')}</div>`}`;
  v.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{if(kidLeft(kidCur())<=0)return renderKid();sfx.pop();startRun([b.dataset.g])});
  v.querySelectorAll('[data-kid]').forEach(b=>b.onclick=()=>{K.active=b.dataset.kid;kidTouch();renderKid()});
  $('#kpar').onclick=()=>parentGate(()=>{KID_VIEW='parent';renderKid()})}
function renderKidAdd(){const v=$('#v-kid'),K=kidSt();let band=null,av=KID_AV[K.list.length%KID_AV.length];
  v.innerHTML=`<div class="ktop"><div><span class="eyebrow">ملف طفل جديد</span><h1>من سيلعب؟</h1></div>${K.list.length?'<button class="klock" id="kback">رجوع</button>':''}</div>
   <section class="card kadd"><label class="lbl-in">اسم الطفل</label><input class="ta" id="kname" maxlength="16" placeholder="مثلًا: سارة">
   <label class="lbl-in">اختر صورته</label><div class="kavs">${KID_AV.map(a=>`<button class="${a===av?'on':''}" data-av="${a}">${a}</button>`).join('')}</div>
   <label class="lbl-in">العمر</label><div class="kbands"><button data-b="a"><b>4 – 6</b><small>سنوات</small></button><button data-b="b"><b>7 – 12</b><small>سنة</small></button></div>
   <button class="go-btn" id="ksave" style="--c:#FFD45A;--c2:#FF8A3D">إنشاء الملف</button><small class="muted" id="kerr"></small></section>
   ${K.list.length?'':'<button class="cta ghost" id="kmode">تغيير نوع الملف</button>'}`;
  v.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{av=b.dataset.av;v.querySelectorAll('[data-av]').forEach(x=>x.classList.toggle('on',x===b))});
  v.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{band=b.dataset.b;v.querySelectorAll('[data-b]').forEach(x=>x.classList.toggle('on',x===b))});
  $('#ksave').onclick=()=>{const nm=$('#kname').value.trim();if(!nm){$('#kerr').textContent='اكتب اسم الطفل';return}if(!band){$('#kerr').textContent='اختر العمر';return}const id='k'+Date.now().toString(36);K.list.push({id,name:nm,av,band,lv:{},hist:[],best:{},min:{}});K.active=id;kidTouch();KID_VIEW='home';renderKid()};
  const kb=$('#kback');if(kb)kb.onclick=()=>{KID_VIEW=KID_VIEW==='add'&&K.list.length?'parent':'home';renderKid()};const km=$('#kmode');if(km)km.onclick=showModePick}
const GATE_N=[['سبعة وأربعون',47],['ثلاثة وثمانون',83],['ستة وعشرون',26],['اثنان وتسعون',92],['واحد وستون',61],['خمسة وثلاثون',35]];
function parentGate(ok){const[w,n]=pick(GATE_N),rev=+String(n).split('').reverse().join(''),opts=shuffle([n,rev,n+10>99?n-10:n+10,(n+5)%90+10].filter((x,i,a)=>a.indexOf(x)===i)).slice(0,4);if(!opts.includes(n))opts[0]=n;
  const d=document.createElement('div');d.className='gate';d.innerHTML=`<div class="gin"><b>للكبار فقط</b><p>اضغط على الرقم: <strong>${w}</strong></p><div class="gopts">${shuffle(opts).map(x=>`<button data-n="${x}" class="num">${x}</button>`).join('')}</div><button class="cta ghost" id="gx">إلغاء</button></div>`;
  document.body.appendChild(d);d.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{d.remove();if(+b.dataset.n===n)ok();else sfx.bad()});$('#gx').onclick=()=>d.remove()}
function renderParent(){const v=$('#v-kid'),K=kidSt(),wk=[...Array(7)].map((_,i)=>dayKey(addDays(new Date(),-i)));
  v.innerHTML=`<div class="ktop"><div><span class="eyebrow">منطقة ولي الأمر</span><h1>تقدّم الأطفال</h1></div><button class="klock" id="kback">رجوع</button></div>
   <section class="card ktip"><b>💡 نشاط هذا الأسبوع بدون شاشة</b><p>${kidTip()}</p></section>
   ${K.list.map(c=>{const sec=wk.reduce((a,d)=>a+((c.min||{})[d]||0),0),gs=KID_GAMES.filter(g=>g.band===c.band),pl=(c.hist||[]).filter(h=>wk.includes(h.d));
    return`<section class="card kpc"><div class="kpch"><span class="kav">${c.av}</span><div><b>${esc(c.name)}</b><small>${c.band==='a'?'4 – 6 سنوات':'7 – 12 سنة'} · اليوم ${fmtDur(kidSecToday(c)||1)} · الأسبوع ${fmtDur(sec||1)}</small></div></div>
     <div class="kprows">${gs.map(g=>{const n=pl.filter(h=>h.g===g.id).length,lvl=(c.lv||{})[g.id]||1,last=(c.hist||[]).filter(h=>h.g===g.id).slice(-5),avg=last.length?Math.round(last.reduce((a,h)=>a+h.idx,0)/last.length/10):null;return`<div class="kprow"><span>${g.emo} ${g.name}</span><span>المستوى ${lvl}</span><span>${n?`${n} مرات هذا الأسبوع`:'لم يلعبها هذا الأسبوع'}</span><span>${avg!=null?`دقة ${avg}%`:'—'}</span></div>`}).join('')}</div>
     <div class="kpbtns"><button class="cta ghost" data-band="${c.id}">تغيير العمر إلى ${c.band==='a'?'7 – 12':'4 – 6'}</button><button class="cta ghost" data-reset="${c.id}">وقت إضافي اليوم +10 دقائق</button><button class="cta ghost danger" data-del="${c.id}">حذف الملف</button></div></section>`}).join('')}
   <section class="card"><b>وقت اللعب اليومي لكل طفل</b><div class="klims">${[10,15,20,30].map(m=>`<button class="${K.limit===m?'on':''}" data-lim="${m}">${m} دقيقة</button>`).join('')}</div><small class="muted">الأكاديمية الأمريكية لطب الأطفال تنصح بوقت شاشة محدود ومحتوى جيد، ويفضّل أن يشارك الكبار الطفل اللعب ويتحدثوا معه عنه.</small></section>
   <div class="kpbtns"><button class="cta" id="kaddc">+ إضافة طفل</button><button class="cta ghost" id="kmode">تغيير نوع الملف (الحالي: طفل)</button></div>`;
  $('#kback').onclick=()=>{KID_VIEW='home';renderKid()};$('#kaddc').onclick=()=>{KID_VIEW='add';renderKid()};$('#kmode').onclick=showModePick;
  v.querySelectorAll('[data-lim]').forEach(b=>b.onclick=()=>{K.limit=+b.dataset.lim;kidTouch();renderParent()});
  v.querySelectorAll('[data-band]').forEach(b=>b.onclick=()=>{const c=K.list.find(x=>x.id===b.dataset.band);c.band=c.band==='a'?'b':'a';kidTouch();renderParent()});
  v.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{const c=K.list.find(x=>x.id===b.dataset.reset),k=dayKey();c.min=c.min||{};c.min[k]=Math.max(0,(c.min[k]||0)-600);kidTouch();b.textContent='أُضيفت 10 دقائق ✓'});
  v.querySelectorAll('[data-del]').forEach(b=>{let arm=0;b.onclick=()=>{if(!arm){arm=1;b.textContent='متأكد؟ اضغط مرة ثانية';return}K.list=K.list.filter(x=>x.id!==b.dataset.del);if(K.active===b.dataset.del)K.active=K.list[0]?K.list[0].id:null;kidTouch();if(!K.list.length)KID_VIEW='add';renderKid()}})}


applyMode();if(!MODE)showModePick();
S.connect();
</script>
