<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>مختبر المحركات — نسخة تجريبية غير منشورة</title>
<link rel="stylesheet" href="./src/style.css">
<style>
  .lab-controls{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
  .lab-controls button{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:13px;padding:12px;min-height:46px;cursor:pointer}
  #game-container{height:min(64vh,480px);min-height:300px;border-radius:18px;border:1px solid var(--border);overflow:hidden;background:var(--surface2)}
  #game-container section[data-game-id]{width:100%;height:100%;display:block}
  .engine-canvas{display:block;width:100%;height:100%}
  #lab-status{min-height:35px;color:var(--sub)}
</style>
<script type="module" src="./dev/lab.js"></script>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div>
      <p class="eyebrow">مختبر العقل 6.0 · اختبار مهندسي المحركات</p>
      <h1>معمل <span>2D / 3D</span></h1>
      <p class="sub">لا يمثل ألعابًا أو مجسمات معتمدة، ولا يحفظ أي تقدم للمستخدم.</p>
    </div>
  </header>
  <main>
    <div class="lab-controls">
      <button id="open-3d" type="button">تجربة تمثال 360°</button>
      <button id="open-2d" type="button">تجربة رسم 2D</button>
      <button id="stop-game" type="button">إغلاق وتحرير الموارد</button>
    </div>
    <p id="lab-status" role="status" aria-live="polite">اختر تجربة للتحقق من تحميل محركها عند الحاجة.</p>
    <section id="game-container" aria-label="لوحة العرض الاختبارية"></section>
    <p>استخدم السحب بإصبع واحد أو أسهم لوحة المفاتيح لتدوير الشكل الثلاثي الأبعاد. الأشكال مؤقتة ولا تحمل تصميم مختبر العقل النهائي.</p>
  </main>
</div>
</body>
</html>
