<!doctype html><html lang="ar" dir="rtl"><head><script>/* رابط واحد: الجوال يفتح الريموت، والتلفزيون والكمبيوتر يفتحان شاشة التلفزيون. للتجاوز: ?tv=1 أو ?remote=1 */(function(){try{var q=new URLSearchParams(location.search),phone=Math.min(screen.width,screen.height)<700&&matchMedia("(pointer:coarse)").matches;if(q.get("remote")==="1")phone=true;if(q.get("tv")==="1")phone=false;q.delete("tv");q.delete("remote");var s=q.toString();location.replace((phone?"remote/remote.html":"tv/index.html")+(s?"?"+s:""))}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0A1428"><title>مختبر العقل</title><style>body{font:20px Tahoma,Arial;background:#0A1428;color:#F5EEDC;padding:10vh 8vw;line-height:2}a{display:inline-block;color:#0A1428;background:#E3BC62;padding:15px 25px;margin:15px;border-radius:15px;text-decoration:none;font-weight:bold}</style></head><body><h1>مختبر العقل</h1><a href="tv/index.html">التلفزيون</a><a href="remote/remote.html">ريموت الجوال</a></body></html>
