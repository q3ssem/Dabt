<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>معاينة مستقلة — ألغاز القصة (pz_rid) · سؤال الصناديق</title>
<style>
/* Standalone review preview of design 01 (pz_rid, RIDDLES[0]). NOT linked from the game, not in the offline cache:
   the game's pz_rid screen is unchanged until showing this design is approved. Text = RIDDLES[0] in index.html. */
body{margin:0;background:#F3EBDD;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;color:#2F2A24}
.wrap{max-width:430px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.note{background:#FFF3D6;border:1.5px dashed #C8932F;border-radius:12px;padding:8px 10px;font-size:12.5px}
.card{background:#FFFBF2;border:1.5px solid #E2D3B6;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px}
h1{font-size:18px;margin:0;display:flex;justify-content:space-between;align-items:center}h1 small{font-size:12px;color:#1F6E66;font-weight:700}
.trio{display:flex;align-items:center;gap:10px;background:#F1E7D5;border-radius:12px;padding:6px 10px;font-size:13px}.trio img{width:96px}
.msg{border-radius:12px;padding:8px 10px;font-size:13.5px;background:#E6F2F1}.msg.bad{background:#FBE3E0;color:#A2402F}.msg.ok{background:#E3F1E6;color:#1F6E44}
.crates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.crate{position:relative;background:#fff;border:1.5px solid #E2D3B6;border-radius:12px;padding:6px;text-align:center;font-weight:800;font-size:13px}
.crate img.c{width:100%;height:auto}.crate.on{border-color:#C8932F;background:#FFF6E2}
.crate img.apple{position:absolute;top:2px;left:4px;width:34%;transition:transform .5s}
.q{background:#F8F1E4;border-radius:12px;padding:8px 10px;font-size:13.5px;line-height:1.75}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{min-height:44px;border-radius:12px;border:1.5px solid #E2D3B6;background:#fff;font:inherit;font-weight:700;font-size:14px}
.opts button.no{background:#FBE3E0;border-color:#C0392B;color:#A2402F}.opts button.ok{background:#E3F1E6;border-color:#2E7D4F}
.bar{display:flex;gap:8px}.bar button{min-height:48px;border-radius:14px;border:1.5px solid #E2D3B6;background:#F1E7D5;font:inherit;font-weight:800}
.bar .h{flex:0 0 76px}.bar .m{flex:1}
</style></head>
<body><div class="wrap">
<p class="note">معاينة مستقلة للمراجعة فقط: هذه الشاشة لا تظهر في اللعبة حتى يُعتمد إظهارها. النص من <code>RIDDLES[0]</code> كما هو.</p>
<div class="card">
  <h1>ألغاز القصة <small>المستوى 1</small></h1>
  <div class="trio" id="trio"><img src="../art10/intro_trio.webp" alt="رواء ونهى وورد"><span><b>رواء ونهى وورد:</b> «الصناديق مغلقة وكل الملصقات خاطئة!»</span></div>
  <div class="msg" id="msg">اقرأ اللغز واختر الصندوق الصحيح.</div>
  <div class="crates" id="cr"></div>
  <div class="q" id="q"></div>
  <div class="opts" id="op"></div>
  <div class="bar"><button class="h" id="hint">تلميح</button><button class="m" id="main">اضغط خيارًا</button></div>
</div></div>
<script>
const R=['ثلاثة صناديق عليها ملصقات: «تفاح»، «برتقال»، «مختلط»، وكل الملصقات خاطئة. تسحب ثمرة واحدة فقط من صندوق واحد. من أي صندوق تسحب لتعرف محتوى الصناديق الثلاثة؟','من صندوق «مختلط»',['من صندوق «تفاح»','من صندوق «برتقال»','لا يمكن معرفة ذلك'],['الملصق الخاطئ معلومة بحد ذاته.','صندوق «مختلط» لا يمكن أن يكون مختلطًا.','إن سحبت منه تفاحة فهو صندوق التفاح، والباقي يُستنتج.'],'صندوق «مختلط» ليس مختلطًا، فالثمرة تكشف نوعه كله. ثم بما أن الملصقات كلها خاطئة يتحدد الصندوقان الآخران.'];
const labels=['مختلط','برتقال','تفاح'],opts=[R[1],...R[2]];let h=0,done=false;
const $=s=>document.querySelector(s),msg=(t,c='')=>{$('#msg').textContent=t;$('#msg').className='msg '+c};
$('#q').textContent=R[0];
$('#cr').innerHTML=labels.map((l,i)=>`<div class="crate" data-l="${l}"><img class="c" src="../art10/rid_crate_closed.webp" alt="صندوق"><span>«${l}»</span></div>`).join('');
$('#op').innerHTML=opts.map((o,i)=>`<button data-i="${i}">${o}</button>`).join('');
$('#op').onclick=e=>{const b=e.target.closest('button');if(!b||done||b.disabled)return;$('#trio').style.display='none';const o=opts[+b.dataset.i];
  if(o===R[1]){done=true;b.className='ok';const c=$('#cr [data-l="مختلط"]');c.classList.add('on');c.insertAdjacentHTML('beforeend','<img class="apple" src="../art10/rid_apple_drawn.webp" alt="تفاحة">');msg('سحبنا تفاحة من «مختلط» فكشفت الصناديق الثلاثة. '+R[4],'ok');$('#main').textContent='اللغز التالي'}
  else{b.className='no';b.disabled=true;msg('ليس هذا… فكّر مرة ثانية.','bad');$('#main').textContent='اختر خيارًا آخر'}};
$('#hint').onclick=()=>{if(done||h>=3)return;msg('تلميح '+(h+1)+': '+R[3][h]);if(h===1)$('#cr [data-l="مختلط"]').classList.add('on');h++};
</script></body></html>
