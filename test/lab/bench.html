<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قياس على الجهاز — Canvas وPhaser 4 وPixiJS</title>
<style>
@font-face{font-family:Tajawal;src:url(fonts/tajawal-arabic-500-normal.woff2) format('woff2');font-weight:500}
@font-face{font-family:Tajawal;src:url(fonts/tajawal-arabic-800-normal.woff2) format('woff2');font-weight:800}
body{margin:0;background:#111315;color:#f4f1ea;font-family:Tajawal,system-ui,sans-serif;padding:14px}
h1{font-size:20px;margin:0 0 4px}p{color:#a9b0b8;font-size:13px;margin:4px 0 12px}
button{font:800 15px Tajawal,sans-serif;padding:12px 18px;border-radius:12px;border:0;background:#FFC34D;color:#1b1b1b;margin-left:8px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid #2a2f36;text-align:center}
th{color:#a9b0b8;font-weight:500}td.n{direction:ltr}
iframe{width:100%;max-width:420px;aspect-ratio:9/16;border:1px solid #2a2f36;border-radius:14px;margin-top:12px;display:block}
#st{font-weight:800;margin-top:10px}
</style>
</head>
<body>
<h1>قياس الأداء على هذا الجهاز</h1>
<p>يشغّل «تتبع الكرات» بثلاثة عارضات: اللعبة العادية ثم 300 و1500 كرة. أبقِ الشاشة مضاءة ولا تلمسها نحو دقيقتين، ثم اضغط «نسخ النتائج» وأرسلها.</p>
<button id="go">ابدأ القياس</button><button id="copy" disabled>نسخ النتائج</button>
<div id="st"></div>
<table><thead><tr><th>العارض</th><th>الحالة</th><th>FPS</th><th>p95 مللي ث</th><th>إطارات بطيئة</th><th>أول إطار</th></tr></thead><tbody id="rows"></tbody></table>
<iframe id="f" title="ساحة القياس"></iframe>
<script>
'use strict';
const runs=[];['canvas','phaser','pixi'].forEach(r=>{runs.push([r,'اللعبة (8 كرات)','']);runs.push([r,'300 كرة','&mode=stress&collide=0&n=300']);runs.push([r,'1500 كرة','&mode=stress&collide=0&n=1500']);});
const out={ua:navigator.userAgent,dpr:devicePixelRatio,screen:screen.width+'x'+screen.height,at:new Date().toISOString(),results:[]};
const f=document.getElementById('f'),st=document.getElementById('st'),rows=document.getElementById('rows');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function one([r,label,q]){
  st.textContent='يقيس: '+r+' · '+label;
  f.src='play.html?r='+r+q+'&seed=7';
  await new Promise(ok=>f.onload=ok);
  const w=f.contentWindow;
  for(let i=0;i<200&&!(w.__bench&&(w.__bench.ready||w.__bench.error));i++)await wait(100);
  if(w.__bench.error)return{r,label,error:w.__bench.error};
  if(!q){for(let i=0;i<100&&!(w.GAME&&w.GAME.G.phase==='move');i++)await wait(100);await wait(300);}else await wait(800);
  w.__bench.start();await wait(4000);const m=w.__bench.stop();
  return{r,label,firstFrame:Math.round(w.__bench.firstFrame),...m};
}
document.getElementById('go').onclick=async e=>{
  e.target.disabled=true;rows.innerHTML='';out.results=[];
  for(const x of runs){const m=await one(x);out.results.push(m);
    rows.insertAdjacentHTML('beforeend',`<tr><td>${m.r}</td><td>${m.label}</td><td class=n>${m.error?'خطأ':m.fps}</td><td class=n>${m.p95??''}</td><td class=n>${m.longFrames??''}</td><td class=n>${m.firstFrame??''}</td></tr>`);}
  f.src='about:blank';st.textContent='اكتمل القياس.';document.getElementById('copy').disabled=false;e.target.disabled=false;
};
document.getElementById('copy').onclick=async()=>{const t=JSON.stringify(out);try{await navigator.clipboard.writeText(t);st.textContent='نُسخت النتائج.';}catch(e){prompt('انسخ النتائج:',t);}};
</script>
</body>
</html>
